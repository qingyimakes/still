/* ---------------------------------------------------------------------------
   Tokens. Lifted from PastLives/Theme/Theme.swift, which is the single source
   of truth in the app; px here map 1:1 to pt there. The app is light only, so
   this page commits to one palette and paints every surface explicitly.

   Type comes from the system, the same way it does in the app: New York for
   the serif, SF for the sans. See the note on --serif below.
--------------------------------------------------------------------------- */
:root{
  color-scheme: light;

  --bg:#FAFAFA; --surface:#FFFFFF; --parchment:#E0D5C7;
  --book-page:#F5F2EC; --cloth:#D3CCBD; --paper-ground:#F2F0EA;
  --quote-bg:rgba(224,213,199,.32);
  --chip:rgba(36,50,53,.07); --chip-soft:rgba(36,50,53,.045);
  --fill-muted:rgba(36,50,53,.05);

  --ink:#243235; --ink-secondary:#6B6B6B; --ink-tertiary:#5F5B54;
  --text-body:#3C3C3C; --text-body-soft:#5A5A5A; --text-body-muted:#4A4A4A;
  --initials:#8A867E; --nav-inactive:#7C8B8E; --on-ink:#FFFFFF;

  --accent:#DBFEAA; --danger:#A83C13; --like:#EC6940;

  --hairline:rgba(36,50,53,.09); --hairline-strong:rgba(36,50,53,.14);
  --hairline-card:rgba(36,50,53,.16); --divider:rgba(36,50,53,.13);

  --r-card:24px; --r-inner:16px; --r-chip:14px; --r-vote:12px; --r-pill:999px;

  /* The faces the app actually renders. `ui-serif` resolves to New York and
     `-apple-system` to SF on Apple platforms, so on an iPhone this page sets
     type in exactly what the app sets it in. The design file specifies
     Newsreader and DM Sans, but the app does not bundle them, and matching
     the app is the point of this page. */
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;

  /* Outside the phone column, on a desktop window. */
  --room:#EDEBE7;
}

<script>
/* ---------------------------------------------------------------------------
   Still, on the web.

   A port of the iOS app, reading the same PastLives/Resources/content.json the
   app ships in its bundle. Everything on this page comes out of that file:
   the questions, the replies, the quotations and their sources. Nothing is
   generated here, which is the whole point of the project — a quote is only a
   quote if it has a source you can follow.

   State (votes, likes, language) lives in this browser only, the same way the
   app keeps it on the phone and never sends it anywhere.
--------------------------------------------------------------------------- */

const IMG = 'assets/img/';
let C = null;                 // content.json
let lang = 'en';
let state = { votes:{}, likes:{} };
let stack = [{ tab:'home' }]; // view stack; last entry is what is showing
let reported = null;          // which item's report note is showing

/* --- Storage. Every access can throw (private windows, blocked site data),
       and the page has to render correctly when it does. ------------------ */
function load(){
  try{
    const raw = localStorage.getItem('still.state');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    const l = localStorage.getItem('still.lang');
    if(l === 'en' || l === 'zh') lang = l;
  }catch(e){ /* defaults stand */ }
}
function save(){
  try{
    localStorage.setItem('still.state', JSON.stringify(state));
    localStorage.setItem('still.lang', lang);
  }catch(e){ /* nothing to do; the page still works for this session */ }
}

/* --- Helpers ------------------------------------------------------------- */
const t = (en, zh) => lang === 'zh' ? zh : en;
const L = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n.toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
const byId = (arr, id) => arr.find(x => x.id === id);

function dateLabel(iso){
  const d = new Date(iso + 'T00:00:00Z');
  const o = {timeZone:'UTC'};
  if(lang === 'zh'){
    const wd = d.toLocaleDateString('zh-Hans-CN',{...o, weekday:'long'});
    return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${wd}`;
  }
  // en_GB puts the day before the month, and the app's format keeps a comma
  // after the weekday that the locale's own long form leaves out.
  const wd = d.toLocaleDateString('en-GB',{...o, weekday:'long'});
  const mo = d.toLocaleDateString('en-GB',{...o, month:'long'});
  return `${wd}, ${d.getUTCDate()} ${mo}`;
}
const initial = name => (name || '?').trim()[0] || '?';

const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
/* The app logs a report on the device and can hand it to Mail. The web port
   has neither, so the button says so rather than pretending to send. */
const reportBtn = key => `<button class="icon-btn" data-report="${esc(key)}"
  aria-label="${t('Report','举报')}">${FLAG}</button>`;
const reportNote = key => reported === key
  ? `<p class="report-note">${t('Reporting is in the app — it logs on the device and can be handed to Mail. This page cannot send anything.','举报功能在 App 内：记录在设备上，并可通过邮件发送。此页面无法发送任何内容。')}</p>`
  : '';
function avatar(name, image, cls){
  const inner = image && image.file
    ? `<img src="${IMG}${esc(image.file)}" alt="" loading="lazy">`
    : esc(initial(name));
  return `<div class="av ${cls||''}">${inner}</div>`;
}
const kindLabel = k => L((C.kinds || {})[k]) || k;
const style = k => (C.optionStyle || {})[k] || {fill:'#E0D5C7',ink:'#243235',
  text:'#5F5B54',line:'#243235',bg:'rgba(36,50,53,.06)'};

/* Questions newest first — the app sorts the feed by date descending, so an
   appended question rises to the top instead of sinking to its index. */
const questions = () => C.questions
  .filter(q => q.status === 'published')
  .sort((a,b) => b.date.localeCompare(a.date));

const responsesFor = q => C.responses.filter(r => r.questionId === q.id);

/* Ordered by how far a voice reaches, the way the thread is ordered in the
   app, so the best-known names are not always first by accident. */
function threadRows(q, filter){
  let rs = responsesFor(q);
  if(filter && filter !== 'all') rs = rs.filter(r => r.optionKey === filter);
  return rs.map(r => ({ r, v: byId(C.voices, r.voiceId) }))
           .filter(x => x.v)
           .sort((a,b) => ((b.v.reach||{}).weight||0) - ((a.v.reach||{}).weight||0));
}

function worksFor(q){
  const ids = new Set();
  Object.values(q.answers || {}).forEach(a => (a.workIds||[]).forEach(w => ids.add(w)));
  return [...ids].map(id => byId(C.works, id)).filter(Boolean);
}

/* --- Navigation ---------------------------------------------------------- */
const here = () => stack[stack.length - 1];
function go(entry){ reported = null; stack.push(entry); render(); window.scrollTo(0,0); }
function tab(name){ reported = null; stack = [{tab:name}]; render(); window.scrollTo(0,0); }
function back(){ reported = null; if(stack.length > 1){ stack.pop(); render(); } }

/* --- Views --------------------------------------------------------------- */

function optionRow(q, o, chosen){
  const p = style(o.key);
  const answered = chosen != null;
  const mine = chosen === o.key;
  const pct = (q.baselinePct || {})[o.key];
  const dim = answered && !mine ? 'opacity:.42' : '';
  return `
  <button class="opt ${mine?'mine':''}" data-vote="${esc(o.key)}"
          style="border-color:${mine?esc(p.line):'var(--hairline-strong)'}">
    <span class="fillbar" style="background:${mine?esc(p.bg):'var(--fill-muted)'};
          width:${answered && pct!=null ? pct : 0}%"></span>
    <span class="key" style="${answered?`background:${esc(p.fill)};color:${esc(p.ink)};${dim}`:''}">${esc(o.key)}</span>
    <span class="lbl">${esc(L(o.label))}</span>
    ${answered && pct!=null
      ? `<span class="pct" style="${mine?`color:${esc(p.text)}`:''}">${pct}%</span>` : ''}
  </button>`;
}

function questionCard(q, flat){
  const chosen = state.votes[q.id] ?? null;
  const liked = !!state.likes['question:'+q.id];
  const joined = q.joined || 0;
  const close = joined > 0
    ? (chosen == null
        ? t(`Answer to open the thread. ${num(joined)} living have already answered.`,
            `作答后即可展开讨论。已有 ${num(joined)} 位在世的人作答。`)
        : t(`${num(joined)} living have answered. You can change yours any time.`,
            `${num(joined)} 位在世的人已作答。你可以随时更改答案。`))
    : L((C.strings||{})[chosen == null ? 'lead' : 'bars']);

  return `
  <article class="card ${flat?'card--flat':''} q ${flat?'q--flat':''}" data-open="${flat?'':esc(q.id)}">
    <div class="q-top">
      <span class="q-date">${esc(dateLabel(q.date))}</span>
      <button class="icon-btn ${liked?'on':''}" data-like="question:${esc(q.id)}"
              aria-label="${t('Like','喜欢')}" aria-pressed="${liked}">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor"
             stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.7z"/></svg>
      </button>
      ${reportBtn('question:'+q.id)}
    </div>
    <h2 class="q-title">${esc(L(q.title))}</h2>
    <p class="q-why">${esc(L(q.why))}</p>
    <div class="opts">${q.options.map(o => optionRow(q,o,chosen)).join('')}</div>
    <p class="q-close">${esc(close)}</p>
    ${reportNote('question:'+q.id)}
    ${chosen != null && !flat
      ? `<button class="wide" data-open="${esc(q.id)}">${t('Open the thread','打开讨论')}</button>` : ''}
  </article>`;
}

function homeView(){
  const qs = questions();
  const col = side => qs.map((q,i) => i % 2 === side
    ? `<div style="order:${i}">${questionCard(q,false)}</div>` : '').join('');
  return `<div class="page"><div class="feed">
    <div class="feed-col">${col(0)}</div><div class="feed-col">${col(1)}</div>
    <p class="footer-note" style="padding:8px 8px 0">${esc(L((C.strings||{}).footer))}</p>
  </div></div>`;
}

function threadView(id, filter){
  const q = byId(C.questions, id);
  if(!q) return `<div class="empty">${t('Not found','没有找到')}</div>`;
  const rows = threadRows(q, filter);
  const books = worksFor(q);
  const f = filter || 'all';

  const pill = (key, label) => {
    const active = f === key;
    const isOpt = key !== 'all';
    const p = style(key);
    const bg = active ? (isOpt ? p.fill : 'var(--ink)') : 'var(--chip)';
    const fg = active ? (isOpt ? p.ink : 'var(--accent)') : (isOpt ? p.text : 'var(--ink)');
    return `<button class="pill" data-filter="${esc(key)}"
      style="background:${esc(bg)};color:${esc(fg)}">${esc(label)}</button>`;
  };

  return `<div class="page">
    <div style="padding:0 16px">${questionCard(q,true)}</div>

    <h3 class="section-h" style="padding-left:24px">${t('Comments from the past lives','讨论 · 按影响力排序')}</h3>
    <div class="pills">
      ${pill('all', t('All','全部'))}
      ${q.options.map(o => pill(o.key, o.key)).join('')}
    </div>

    <div class="rows">${rows.map(x => responseRow(x, q)).join('') ||
      `<p class="empty">${t('Nothing here yet.','这里还没有内容。')}</p>`}</div>

    ${books.length ? `
      <h3 class="section-h" style="padding-left:24px;font-family:var(--serif);

      <div class="shelf">${books.map(bookCard).join('')}</div>` : ''}

    <p class="footer-note">${esc(L((C.strings||{}).footer))}</p>
  </div>`;
}

/* One passage, drawn at random, from the same bundle the threads use. The
   reader never types the question, so the page cannot pretend to have read
   it — and says so. */
let drawn = null, bookOpen = false;

function quotable(){
  return C.responses.filter(r => r.quote && L(r.quote) && r.source && r.source.label);
}
function draw(){
  const pool = quotable();
  drawn = pool[Math.floor(Math.random() * pool.length)] || null;
}

function answersView(){
  if(!drawn) draw();
  const r = drawn;
  const v = r ? byId(C.voices, r.voiceId) : null;
  const q = r ? byId(C.questions, r.questionId) : null;

  return `<div class="page"><div class="ans">
    <div class="book ${bookOpen?'open':''}" id="book" role="button" tabindex="0"
         aria-label="${bookOpen ? t('Tap to close','轻点合上') : t('Then tap to open','然后轻点打开')}">

      <section class="reading">
        <p class="label" style="text-align:center;margin:0">${t('AI EXPLANATION','AI 解读')}</p>
        ${v ? `<div class="who">${avatar(L(v.name), v.image)}
          <div><b>${esc(L(v.name))}</b><span>${esc(kindLabel(r.kind))} · ${esc(L(r.origin))}</span></div>
        </div>` : ''}
        <div class="grp">
          <p class="label label--sm">${t('WHERE THIS CAME FROM','它出自哪里')}</p>
          ${q ? `<p>${t('Written for the thread','写给这条讨论：')}${lang==='zh'?'「':' “'}${esc(L(q.title))}${lang==='zh'?'」。':'”.'}</p>`:''}
          ${r.detail ? `<p>${esc(L(r.detail))}</p>` : ''}
        </div>
        <div class="grp">
          <p class="label label--sm">${t('SOURCE','出处')}</p>
          <p class="dark">${esc(L(r.source.label))}</p>
          ${r.source.url ? `<p><a href="${esc(r.source.url)}" target="_blank" rel="noopener"

        </div>
        <div class="disclaim">
          <b>${t('This was not written about your question.','这段话不是针对你的问题写的。')}</b>
          <p>${t('Nobody here knows what you are carrying. Read it against your question and see what it touches — or what it refuses.','这里没有人知道你正背负着什么。把它放在你的问题旁边读，看它触到了什么 — 或者拒绝了什么。')}</p>
        </div>

      <p class="ans-tap">${t('Then tap to open','然后轻点打开')}</p>
      <p class="ans-note">${t('One passage, drawn at random. It was not written for you, and it is not an answer.','一段文字，随机抽取。它不是为你而写的，也不是答案。')}</p>`}

}

        <p>${t('Your answers and likes. There is no account, so this is the whole of it and it cannot be undone.','你的回答与喜欢。没有账号，所以这就是全部，且无法撤销。')}</p>
        <button class="wide" id="reset" style="background:var(--chip);color:var(--danger)">${
          t('Erase','清除')}</button>
      </div>
    </div>
  </div>`;
}

/* --- Nav bar ------------------------------------------------------------- */
const TABS = [
  ['home',    t=>({en:'Home',zh:'首页'}),    '<path d="M3.5 10.6L12 3.8l8.5 6.8"/><path d="M5.6 9.8V20a.8.8 0 0 0 .8.8h11.2a.8.8 0 0 0 .8-.8V9.8"/>'],
  ['answers', t=>({en:'Answers',zh:'答案'}), '<path d="M12 6.6C10.3 5.2 8 4.5 5 4.5a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c3 0 5.3.7 7 2.1"/><path d="M12 6.6c1.7-1.4 4-2.1 7-2.1a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1 1c-3 0-5.3.7-7 2.1"/><path d="M12 6.6v13.6"/>'],
  ['explore', t=>({en:'Explore',zh:'浏览'}), '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'],
  ['me',      t=>({en:'Me',zh:'我'}),        '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>']
];
function navBar(){
  const cur = stack[0].tab;
  document.getElementById('nav').innerHTML =
    '<span class="nav-brand">Still</span>' + TABS.map(([id, label, path]) => `
    <button data-tab="${id}" ${cur===id?'aria-current="page"':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">${path}</svg>
      <span>${esc(label()[lang] || label().en)}</span>
    </button>`).join('');
}

/* --- Render -------------------------------------------------------------- */
function render(){
  const e = here();
  const view = document.getElementById('view');
  let html;
  if(e.voice)      html = voiceView(e.voice);
  else if(e.work)  html = workView(e.work);
  else if(e.thread)html = threadView(e.thread, e.filter);
  else if(e.tab === 'answers') html = answersView();
  else if(e.tab === 'explore') html = exploreView();
  else if(e.tab === 'me')      html = meView();
  else                          html = homeView();

  view.innerHTML = html;
  document.getElementById('back').hidden = stack.length <= 1;
  navBar();
}

/* --- Events. One delegated listener; the whole page is re-rendered from
       state, so nothing has to be wired up per element. -------------------- */
document.addEventListener('click', ev => {
  const hit = sel => ev.target.closest(sel);
  let el;

  if((el = hit('[data-tab]')))    return tab(el.dataset.tab);
  if((el = hit('#back')))         return back();
  if((el = hit('[data-lang]')))   { lang = el.dataset.lang; save(); return render(); }

  if((el = hit('[data-vote]'))){
    const card = el.closest('[data-open]') || el.closest('.q');
    const q = here().thread ? byId(C.questions, here().thread)
                            : byId(C.questions, card && card.dataset.open);
    if(!q) return;
    state.votes[q.id] = el.dataset.vote; save();
    // In the feed, answering is what unlocks the thread, so it opens straight
    // away rather than making the reader tap twice. Inside the thread it just
    // updates in place.
    if(here().thread) render();
    else { render(); setTimeout(() => go({tab:stack[0].tab, thread:q.id}), 320); }
    return;
  }

  if((el = hit('[data-like]'))){
    const k = el.dataset.like;
    if(state.likes[k]) delete state.likes[k]; else state.likes[k] = 1;
    save(); return render();
  }

  if((el = hit('[data-filter]'))){
    here().filter = el.dataset.filter; return render();
  }
  if((el = hit('[data-etype]'))){ exploreFilter = el.dataset.etype; return render(); }
  if((el = hit('[data-voice]'))) return go({tab:stack[0].tab, voice:el.dataset.voice});
  if((el = hit('[data-work]')))  return go({tab:stack[0].tab, work:el.dataset.work});

  if((el = hit('#book'))){
    if(bookOpen){ bookOpen = false; render(); }
    else { draw(); bookOpen = true; render(); }
    return;
  }

  if((el = hit('[data-report]'))){
    reported = reported === el.dataset.report ? null : el.dataset.report;
    render(); return;
  }

  if((el = hit('#reset'))){
    state = { votes:{}, likes:{} }; save(); return render();
  }

  if((el = hit('a'))) return;               // let real links through

  if((el = hit('[data-open]')) && el.dataset.open){
    return go({tab:stack[0].tab, thread:el.dataset.open});
  }
});

document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'book'){ ev.target.click(); }
});

addEventListener('scroll', () => {
  document.getElementById('bar').classList.toggle('scrolled', scrollY > 4);
}, {passive:true});

/* --- Boot ---------------------------------------------------------------- */
load();
fetch('assets/content.json')
  .then(r => r.json())
  .then(data => { C = data; render(); })
  .catch(() => {
    document.getElementById('view').innerHTML =
      `<p class="empty">Could not load the content file.</p>`;
  });
</script>
