<style>
/* ---------------------------------------------------------------------------
   Tokens. Lifted from PastLives/Theme/Theme.swift, which is the single source
   of truth in the app; px here map 1:1 to pt there. The app is light only, so
   this page commits to one palette and paints every surface explicitly.

   Type is the design's pair, Newsreader and DM Sans, loaded from Google
   Fonts. See the note on --serif below.
--------------------------------------------------------------------------- */
:root{
  color-scheme: light;

  --bg:#FAFAFA; --surface:#FFFFFF; --parchment:#E0D5C7;
  --book-page:#F5F2EC; --cloth:#D3CCBD; --paper-ground:#F2F0EA;
  --quote-bg:rgba(224,213,199,.32);
  --chip:rgba(36,50,53,.07); --chip-soft:rgba(36,50,53,.045);
  --fill-muted:rgba(36,50,53,.05);

  --ink:#243235; --ink-secondary:#6B6B6B; --ink-tertiary:#5F5B54;
  --text-body:#3C3C3C; --text-body-soft:#5A5A5A; --text-body-muted:#4A4A4A;
  --initials:#8A867E; --nav-inactive:#7C8B8E; --on-ink:#FFFFFF;

  --accent:#DBFEAA; --danger:#A83C13; --like:#EC6940;

  --hairline:rgba(36,50,53,.09); --hairline-strong:rgba(36,50,53,.14);
  --hairline-card:rgba(36,50,53,.16); --divider:rgba(36,50,53,.13);

  --r-card:24px; --r-inner:16px; --r-chip:14px; --r-vote:12px; --r-pill:999px;

  /* The design's pair. The app sets New York and SF, but only Safari can
     reach New York — everywhere else `ui-serif` fell back to Georgia — and
     Apple's licence forbids serving it, so the page loads the pair the app
     stands those two in for. Chinese falls through to the system faces. */
  --serif:"Newsreader","Songti SC",Georgia,serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;

  /* Outside the phone column, on a desktop window. */
  --room:#EDEBE7;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--room);font-family:var(--sans);color:var(--ink);
     -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
       text-align:left}
a{color:inherit}
img{max-width:100%}
/* `hidden` has to beat the display rules below it; the publish skeleton adds
   this too, but the page is also served straight from the repo. */
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* --- The phone column ---------------------------------------------------- */
.app{max-width:430px;margin:0 auto;min-height:100%;background:var(--bg);
     position:relative;box-shadow:0 0 0 1px rgba(36,50,53,.06)}
@media (min-width:520px){
  .app{box-shadow:0 1px 40px rgba(36,50,53,.10)}
}

/* --- Top bar. The app uses the system navigation bar, which from iOS 26
       floats over the content as glass and applies its own scroll-edge
       effect; this is the same idea in CSS. ---------------------------------*/
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:52px;
     display:flex;align-items:center;justify-content:center;
     background:rgba(250,250,250,.72);backdrop-filter:blur(20px) saturate(180%);
     -webkit-backdrop-filter:blur(20px) saturate(180%);
     border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--hairline)}
.brand{font-family:var(--serif);font-style:italic;font-size:17px}
.bar .back{position:absolute;left:12px;top:50%;transform:translateY(-50%);
           width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
           justify-content:center;background:rgba(255,255,255,.92);
           backdrop-filter:blur(20px) saturate(180%);
           -webkit-backdrop-filter:blur(20px) saturate(180%);
           box-shadow:0 1px 6px rgba(36,50,53,.10)}
.bar .back svg{width:22px;height:22px}

/* --- Page scaffold ------------------------------------------------------- */
.page{padding:16px 0 calc(64px + 42px + env(safe-area-inset-bottom,0px))}
.page-head{padding:8px 20px 4px}
.page-title{font-family:var(--serif);font-size:34px;margin:0}
.page-sub{font-size:15px;line-height:1.4;color:var(--ink-tertiary);margin:8px 0 0}

/* --- Bottom nav ---------------------------------------------------------- */
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;
     transform:translateX(-50%);width:calc(100% - 32px);max-width:430px;z-index:30;
     display:grid;grid-template-columns:repeat(5,1fr);padding:5px;
     border-radius:var(--r-pill);background:rgba(252,251,249,.86);
     backdrop-filter:blur(24px) saturate(180%);
     -webkit-backdrop-filter:blur(24px) saturate(180%);
     border:1px solid rgba(36,50,53,.05);
     box-shadow:0 6px 24px rgba(36,50,53,.10),0 1px 2px rgba(36,50,53,.05)}
.nav button{height:54px;display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:2px;color:var(--ink);border-radius:var(--r-pill)}
.nav button[aria-current="page"]{background:var(--chip)}
.nav svg{width:23px;height:23px}
.nav-brand{display:none;font-family:var(--serif);font-style:italic;font-size:21px;
           padding:4px 16px 20px}
.nav span{font-size:10.5px;font-weight:500}

/* --- Cards --------------------------------------------------------------- */
.card{background:var(--surface);border-radius:var(--r-card);
      border:1px solid var(--surface);box-shadow:0 1px 2px rgba(36,50,53,.04)}
.card--flat{background:transparent;border-color:var(--hairline-card);box-shadow:none}

.q{padding:24px}
.q--flat{padding:20px}
.q-top{display:flex;align-items:flex-start;gap:8px}
.q-date{font-size:14.5px;line-height:1.407;font-weight:500;color:var(--ink-secondary);flex:1}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;
          color:var(--ink-secondary);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--like)}
.q-title{font-family:var(--serif);font-size:36px;line-height:1.24;margin:12px 0 0;
         text-wrap:balance}
.q--flat .q-title{font-size:30px;line-height:1.3}
.q-why{font-size:17px;line-height:1.45;color:var(--text-body);margin:12px 0 0}

/* --- Options ------------------------------------------------------------- */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;
     padding:12px 16px;border-radius:var(--r-inner);overflow:hidden;
     border:1px solid var(--hairline-strong);background:transparent}
.opt .fillbar{position:absolute;inset:0 auto 0 0;width:0;background:var(--fill-muted);
              transition:width .3s ease-out}
.opt.mine{border-width:1.5px}
.opt > *{position:relative}
.opt .key{width:26px;height:26px;flex:none;border-radius:50%;display:grid;
          place-items:center;font-size:13px;font-weight:700;background:var(--chip);
          color:var(--ink-secondary)}
.opt .lbl{font-size:17px;line-height:1.376;flex:1}
.opt .pct{font-size:15px;line-height:1.4;font-weight:500;color:var(--ink-tertiary);
          font-variant-numeric:tabular-nums;flex:none}
.q-close{font-size:15px;line-height:1.4;color:var(--ink-tertiary);margin-top:16px}
.wide{display:block;width:100%;margin-top:16px;text-align:center;font-size:16px;
      padding:14px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink)}

.feed{display:flex;flex-direction:column;gap:20px;padding:4px 16px 0}
.feed .q{cursor:pointer}
/* Two column boxes that vanish below the wide breakpoint; each card carries
   its feed position as `order`, so one column reads newest first. */
.feed-col{display:contents}
.feed .footer-note{order:9999}

/* --- Thread -------------------------------------------------------------- */
.section-h{font-size:16px;padding-left:4px;margin:24px 0 12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 2px;
       scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:42px;text-align:center;font-size:14.5px;font-weight:500;
      padding:8px 16px;border-radius:var(--r-pill);background:var(--chip)}
.rows{display:flex;flex-direction:column;gap:32px;padding:16px 20px 0}
.row{display:flex;gap:12px;align-items:flex-start}
.av{width:46px;height:46px;flex:none;border-radius:50%;background:var(--parchment);
    display:grid;place-items:center;overflow:hidden;font-family:var(--serif);
    font-size:19px;color:var(--initials)}
.av img{width:100%;height:100%;object-fit:cover}
.av--lg{width:56px;height:56px;font-size:22px}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.row-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-name b{font-size:16.5px;font-weight:700}
.row-name span{font-size:14px;color:var(--ink-secondary)}
.voted{align-self:flex-start;font-size:13px;font-weight:500;padding:4px 12px;
       border-radius:var(--r-vote);line-height:1.3}
.quotebox{background:var(--quote-bg);border-radius:var(--r-inner);padding:12px 16px;
          display:flex;flex-direction:column;gap:8px}
.quotebox q{font-family:var(--serif);font-size:19px;line-height:1.516;quotes:"\201C" "\201D"}
.quotebox .src{font-size:13.5px;font-weight:500;color:var(--ink-secondary)}
.quotebox .src u{text-underline-offset:2px}
.claim{font-size:17px;font-weight:500;line-height:1.494}
.detail{font-size:16.5px;line-height:1.564;color:var(--text-body-soft)}
.reach{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.4;
       color:var(--ink-secondary)}
.readmore{font-size:14.5px;font-weight:500;padding:4px 0;text-decoration:underline;
          text-underline-offset:3px}
.row-foot{display:flex;align-items:center;gap:12px;padding-top:4px}
.row-foot .origin{font-size:14px;color:var(--ink-secondary);flex:1}

/* --- Reading list -------------------------------------------------------- */
.shelf{display:flex;gap:16px;overflow-x:auto;padding:4px 20px 12px;
       scrollbar-width:none}

.shelf::-webkit-scrollbar{display:none}
.book-card{flex:none;width:196px;padding:16px;display:flex;flex-direction:column;
           gap:12px;text-align:left}
.cover{aspect-ratio:2/3;border-radius:4px;background:var(--parchment);overflow:hidden;
       display:grid;place-items:center;padding:12px}
.cover img{width:100%;height:100%;object-fit:cover}
.cover span{font-family:var(--serif);font-size:15px;color:var(--ink);text-align:center;
            line-height:1.2}
.book-card h4{font-family:var(--serif);font-size:19px;margin:0;font-weight:400}
.book-card .by{font-size:14px;color:var(--ink-tertiary);margin:4px 0 0}
.book-card p{font-size:15px;line-height:1.4;color:var(--text-body-muted);margin:0}
.footer-note{font-size:15px;line-height:1.4;color:var(--ink-tertiary);padding:24px 24px 0}

/* --- Answers: the commonplace book --------------------------------------- */
.ans{display:flex;flex-direction:column;align-items:center;padding:16px 20px 0}
.book{width:min(300px,78%);aspect-ratio:546/750;position:relative;
      perspective:1200px;cursor:pointer;margin-top:16px;
      filter:drop-shadow(0 8px 22px rgba(36,50,53,.10))}
.book .face{position:absolute;inset:0;border-radius:3px;overflow:hidden;
            backface-visibility:hidden}
.book .leaf{background:var(--book-page);display:flex}
.book .gutter{width:26px;flex:none;
              background:linear-gradient(to left,rgba(189,181,163,.35),transparent)}
.book .leaf-text{flex:1;padding:24px;display:flex;flex-direction:column;
                 justify-content:center;gap:24px;min-width:0}
.book .block{width:9px;flex:none;background:#D6D0C2}
.book .board{width:5px;flex:none;background:var(--cloth)}
.passage{font-family:var(--serif);font-size:24px;line-height:1.7;margin:0;
         overflow-wrap:anywhere}
.attrib{font-family:var(--serif);font-style:italic;font-size:19px;margin:0}
/* The front board swings on its hinge — rigid, as a cased board is, with
   the case outside and the endpaper inside. Same model as `Turning` in
   AnswersView.swift: each side darkens as it turns from the reader, and the
   board shades the leaf under it until it lifts clear. Timing curves are
   Theme.Motion.bookOpen / bookClose. */
.book .board-turn{position:absolute;inset:0;transform-origin:left center;
                  transform-style:preserve-3d;
                  transition:transform .8s cubic-bezier(.4,0,.25,1)}
.book.open .board-turn{transform:rotateY(-180deg);
                       transition:transform .95s cubic-bezier(.45,0,.2,1)}
.book .side{position:absolute;inset:0;border-radius:3px;overflow:hidden;
            backface-visibility:hidden;-webkit-backface-visibility:hidden}
.book .side::after{content:"";position:absolute;inset:0;background:var(--ink);
                   pointer-events:none;transition:opacity .8s ease-in}
.book .cover-face{background:var(--cloth)}
.book .cover-face::after{opacity:0}
.book.open .cover-face::after{opacity:.22}
.book .cover-face img{width:100%;height:100%;object-fit:cover;display:block}
/* Laid out in its own coordinates, where the spine is on the left; the
   half-turn sets it on the right, against the gutter. */
.book .endpaper{transform:rotateY(180deg);
                border:6px solid var(--cloth);border-left:0;
                background:linear-gradient(to right,rgba(189,181,163,.35),rgba(189,181,163,0)),
                           var(--book-page)}
.book .endpaper::after{opacity:.22}
.book.open .endpaper::after{opacity:0;transition:opacity .5s ease-out .45s}
.book .leaf::after{content:"";position:absolute;inset:0;pointer-events:none;
                   background:linear-gradient(to right,rgba(36,50,53,.30),rgba(36,50,53,0));
                   transition:opacity .45s ease-out .1s}
.book.open .leaf::after{opacity:0}
.ans-hold{font-family:var(--serif);font-size:28px;line-height:1.414;text-align:center;
          margin:20px 0 0;text-wrap:balance}
.ans-tap{font-size:17px;line-height:1.376;text-align:center;margin:8px 0 0}
.ans-note{font-size:12px;line-height:1.4;color:var(--ink-tertiary);text-align:center;
          margin:12px 0 0;max-width:34ch}
.label{font-size:13px;font-weight:600;letter-spacing:1.4px}
.label--sm{font-size:12px;font-weight:400;letter-spacing:.6px;color:var(--ink-secondary)}
.reading{width:100%;display:flex;flex-direction:column;gap:16px;padding-top:24px}
.reading .who{display:flex;align-items:center;gap:12px}
.reading .who b{font-size:16.5px}
.reading .who div span{display:block;font-size:14.5px;color:var(--ink-secondary)}
.reading .grp{display:flex;flex-direction:column;gap:4px}
.reading .grp p{font-size:15px;line-height:1.4;color:var(--text-body-soft);margin:0}
.reading .grp p.dark{color:var(--ink)}
.disclaim{background:var(--chip);border-radius:var(--r-inner);padding:16px;
          display:flex;flex-direction:column;gap:4px}
.disclaim b{font-size:15px;font-weight:500}
.disclaim p{font-size:15px;line-height:1.4;color:var(--ink-tertiary);margin:0}


/* --- Explore ------------------------------------------------------------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 0}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.tile .av{width:52px;height:52px}
.tile h4{font-family:var(--serif);font-size:19px;margin:0;font-weight:400;line-height:1.2}
.tile span{font-size:12px;color:var(--ink-secondary)}

/* --- Entry (voice / work) ------------------------------------------------ */
.entry{padding:20px}
.entry-head{display:flex;gap:16px;align-items:center}
.entry h2{font-family:var(--serif);font-size:28px;margin:0;font-weight:400}
.entry .meta{font-size:14.5px;line-height:1.407;color:var(--ink-secondary);margin:4px 0 0}
.entry .body{font-size:16.5px;line-height:1.564;color:var(--text-body-soft);margin:16px 0 0}
.entry .credit{font-size:12px;line-height:1.5;color:var(--ink-tertiary);margin:20px 0 0;
               padding-top:16px;border-top:1px solid var(--hairline)}

/* --- Me ------------------------------------------------------------------ */
.me{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.stat-row{display:flex;gap:12px}
.stat{flex:1;padding:16px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400}
.stat span{font-size:14px;color:var(--ink-secondary)}
.panel{padding:16px;display:flex;flex-direction:column;gap:8px}
.panel h3{font-size:16px;margin:0}
.panel p{font-size:15px;line-height:1.4;color:var(--text-body-soft);margin:0}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;text-align:center;font-size:14.5px;font-weight:500;padding:8px;
            border-radius:var(--r-pill);color:var(--ink-secondary)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
                                 box-shadow:0 1px 2px rgba(36,50,53,.10)}
.rule{padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--ink);
      color:var(--on-ink);border-radius:var(--r-card)}
.rule b{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:400}
.rule p{font-size:15px;line-height:1.4;margin:0;opacity:.82}

.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kind{font-size:12px;padding:5px 10px;border-radius:var(--r-pill);background:var(--chip);
      color:var(--ink-tertiary)}


/* --- Chat --------------------------------------------------------------- */
/* Everything a philosopher "says" here is written by a model. The design's
   job is to make that impossible to miss: a SIMULATED tag on every generated
   line, and a visually separate block, in the thread's own quote styling, for
   the passages they actually wrote. The two must never look alike. */
/* A messaging app, not a document: the frame is fixed to the viewport, the
   transcript is the only thing that scrolls, and the composer never leaves
   the bottom of the screen. */
.page--chat{padding:8px 0 0}
.chat{display:flex;flex-direction:column;
      height:calc(100dvh - 52px - 76px - env(safe-area-inset-bottom,0px));
      padding:0 20px}
.chat .cast{flex:none}
.chat .msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;
            padding:8px 0 12px;margin:0 -4px;
            padding-left:4px;padding-right:4px}
.chat .notice{flex:none;margin:0 0 8px}
.cast{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.cast-add{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;
          width:64px}
.cast-add .ring{width:46px;height:46px;border-radius:50%;display:grid;
                place-items:center;border:1px dashed var(--hairline-strong);
                color:var(--ink-secondary);font-size:22px}
.cast-chip{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;
           gap:4px;position:relative}
.cast-chip small{font-size:11px;line-height:1.2;text-align:center;color:var(--ink-secondary);
                 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
                 -webkit-box-orient:vertical}
.cast-chip .x{position:absolute;top:-2px;right:6px;width:19px;height:19px;
              border-radius:50%;background:var(--ink);color:var(--on-ink);
              font-size:12px;line-height:19px;text-align:center}
.tier{font-size:9.5px;font-weight:700;letter-spacing:.7px;padding:2px 5px;
      border-radius:var(--r-pill);background:var(--chip);color:var(--ink-secondary)}
.tier.pro{background:var(--ink);color:var(--accent)}

.msgs{display:flex;flex-direction:column;gap:20px;padding:4px 0}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg.mine{flex-direction:row-reverse}
.msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.msg.mine .msg-body{align-items:flex-end}
.msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg-head b{font-size:15.5px;font-weight:700}
.sim{font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--danger);
     background:var(--dangerBg,rgba(236,105,64,.10));padding:2px 6px;
     border-radius:var(--r-pill)}
.bubble{font-size:16.5px;line-height:1.55;background:var(--surface);
        border:1px solid var(--hairline);border-radius:var(--r-inner);
        padding:12px 14px;max-width:100%}
.msg.mine .bubble{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.said{background:var(--quote-bg);border-radius:var(--r-inner);padding:12px 14px;
      display:flex;flex-direction:column;gap:6px}
.said .tag{font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--ink-secondary)}
.said q{font-family:var(--serif);font-size:18px;line-height:1.5;quotes:"\201C" "\201D"}
.said .src{font-size:13px;font-weight:500;color:var(--ink-secondary)}
/* The review's §10 asks the interface to separate commitments the texts
   actually carry from modern applications derived from them. This is that
   separation, kept closed by default so the position reads as a position. */
.derived{font-size:14px;line-height:1.5;background:var(--chip-soft);
         border:1px solid var(--hairline);border-radius:var(--r-inner);
         padding:10px 12px}
.derived summary{font-size:13px;font-weight:500;color:var(--ink-secondary);
                 cursor:pointer;list-style:none}
.derived summary::-webkit-details-marker{display:none}
.derived summary::before{content:"▸ ";font-size:11px}
.derived[open] summary::before{content:"▾ "}
.derived p{margin:10px 0 0;color:var(--text-body-soft)}
.derived .tag{display:block;font-size:9.5px;font-weight:700;letter-spacing:.8px;
              color:var(--ink-secondary);margin-bottom:2px}
.derived .tag.warn{color:var(--danger)}

.composer{flex:none;display:flex;gap:8px;align-items:flex-end;
          background:var(--bg);padding:8px 0 4px}
.composer textarea{flex:1;min-height:46px;max-height:140px;resize:none;
                   font:inherit;font-size:16.5px;line-height:1.4;color:var(--ink);
                   background:var(--surface);border:1px solid var(--hairline-strong);
                   border-radius:var(--r-inner);padding:12px 14px}
.composer button{flex:none;height:46px;padding:0 18px;border-radius:var(--r-pill);
                 background:var(--ink);color:var(--on-ink);font-size:15px;font-weight:500}
.composer button[disabled]{opacity:.4}
.chat-acts{display:flex;gap:8px;flex-wrap:wrap}
.ghost{font-size:14.5px;font-weight:500;padding:8px 14px;border-radius:var(--r-pill);
       background:var(--chip);color:var(--ink)}

.picker{display:flex;flex-direction:column;gap:2px;padding:0 20px}
.picker input{width:100%;font:inherit;font-size:16.5px;color:var(--ink);
              background:var(--surface);border:1px solid var(--hairline-strong);
              border-radius:var(--r-inner);padding:12px 14px;margin-bottom:12px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 4px;
      border-bottom:1px solid var(--hairline)}
.prow .meta{flex:1;min-width:0}
.prow b{font-size:16px;font-weight:500;display:block}
.prow span{font-size:12.5px;color:var(--ink-secondary)}
.prow .pick{flex:none;font-size:13px;font-weight:500;padding:6px 12px;
            border-radius:var(--r-pill);background:var(--chip)}
.prow .pick.on{background:var(--ink);color:var(--on-ink)}
.notice{font-size:14px;line-height:1.5;color:var(--ink-tertiary);background:var(--chip);
        border-radius:var(--r-inner);padding:12px 14px}
@media (min-width:900px){
  .chat{height:calc(100dvh - 60px)}
}
/* Consecutive lines from one speaker read as one turn, so only the first
   carries the face and the name. */
.msg.cont{margin-top:-14px}
.msg.cont .av{visibility:hidden;height:0}
.msg.cont .msg-head{display:none}
.stamp{font-size:11px;color:var(--ink-tertiary);align-self:flex-end;
       padding:0 2px}
.msg.mine .stamp{align-self:flex-start}
.typing{display:flex;gap:4px;align-items:center;padding:12px 14px;
        background:var(--surface);border:1px solid var(--hairline);
        border-radius:var(--r-inner);width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-secondary);
          animation:blip 1.2s infinite ease-in-out;display:block}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}
                30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){ .typing i{animation:none;opacity:.5} }
.report-note{font-size:13px;line-height:1.45;color:var(--danger);
             background:rgba(236,105,64,.10);border-radius:var(--r-chip);
             padding:10px 12px;margin-top:12px}
.empty{padding:40px 20px;text-align:center;font-size:15px;color:var(--ink-tertiary)}

/* ---------------------------------------------------------------------------
   Wider viewports.

   The phone layout is the design; on a laptop it should not be a 430px strip
   floating in grey. Two steps: a tablet widens the column, and a desktop
   turns the bottom tab bar on its side into a sidebar, which is what the
   width is actually good for. Nothing about the cards, type or colour
   changes — only how much room they get and where the navigation lives.
--------------------------------------------------------------------------- */

/* Tablet: the column grows, the floating tab bar stays. */
@media (min-width:640px){
  .app{max-width:560px}
  .nav{max-width:430px}
  .grid{grid-template-columns:repeat(3,1fr)}
}

/* Desktop: navigation moves to the left and stays put. */
@media (min-width:900px){
  body{background:var(--bg)}
  .app{max-width:none;box-shadow:none;display:grid;
       grid-template-columns:248px minmax(0,1fr);
       grid-template-rows:auto 1fr;align-items:start}

  /* The sidebar spans both rows, so the top bar starts beside it. */
  .nav{grid-column:1;grid-row:1 / span 2;position:sticky;
       top:env(safe-area-inset-top,0px);bottom:auto;left:auto;transform:none;
       width:auto;max-width:none;height:100vh;height:100dvh;
       display:flex;flex-direction:column;align-items:stretch;gap:2px;
       padding:20px 12px;border:0;border-right:1px solid var(--hairline);
       border-radius:0;background:transparent;backdrop-filter:none;
       -webkit-backdrop-filter:none;box-shadow:none}
  .nav-brand{display:block}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;
              height:46px;padding:0 16px}
  .nav span{font-size:15px}

  /* The wordmark lives in the sidebar now, so the bar keeps only the back
     button — and stops being a translucent slab over nothing. */
  .bar{grid-column:2;grid-row:1;justify-content:flex-start;height:auto;
       padding:12px 0 0 24px;background:transparent;backdrop-filter:none;
       -webkit-backdrop-filter:none;border-bottom:0}
  .bar.scrolled{border-bottom-color:transparent}
  .bar .brand{display:none}
  .bar .back{position:static;transform:none}

  #view{grid-column:2;grid-row:2;min-width:0}
  /* A measure, not the whole window: 36px headlines across 1400px are
     unreadable. */
  .page{max-width:620px;margin:0 auto;
        padding:16px 0 64px}

  .pills{padding-left:20px;padding-right:20px}
  .grid{grid-template-columns:repeat(3,1fr)}
}

/* Wide desktop: the book and what is written about it sit side by side
   instead of stacked, which is the one place the extra width genuinely
   changes how the page reads. */
@media (min-width:1180px){
  .page{max-width:1000px}
  .ans{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);
       gap:40px;align-items:start;padding-top:32px}
  .ans .book{grid-column:1;width:100%;margin-top:0}
  .ans > :not(.book):not(.reading){grid-column:1}
  .ans .reading{grid-column:2;grid-row:1 / span 6;padding-top:0}
  .feed{padding-left:0;padding-right:0}

  /* Home: two columns, cards dealt left, right, left — so the newest two sit
     side by side and neither column leaves holes under a short card. */
  .feed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        gap:20px;align-items:start}
  .feed-col{display:flex;flex-direction:column;gap:20px}
  .feed .footer-note{grid-column:1 / -1}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

<div class="app">
  <header class="bar" id="bar">
    <button class="back" id="back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="brand">Still</span>
  </header>

  <main id="view"></main>

  <nav class="nav" id="nav"></nav>
</div>

<script>
/* ---------------------------------------------------------------------------
   Still, on the web.

   A port of the iOS app, reading the same PastLives/Resources/content.json the
   app ships in its bundle. Everything on this page comes out of that file:
   the questions, the replies, the quotations and their sources. Nothing is
   generated here, which is the whole point of the project — a quote is only a
   quote if it has a source you can follow.

   State (votes, likes, language) lives in this browser only, the same way the
   app keeps it on the phone and never sends it anywhere.
--------------------------------------------------------------------------- */

const IMG = 'assets/img/';
let C = null;                 // content.json
let lang = 'en';
let state = { votes:{}, likes:{} };
let stack = [{ tab:'home' }]; // view stack; last entry is what is showing
let reported = null;          // which item's report note is showing
let PHIL = [];                // the ranked roster, from assets/philosophers.json
let SAMPLE = undefined;       // the model, once asked for: null means no model here
let chat = { cast: [], msgs: [], busy:false, query:'', picking:false, said:{},
             typing:null, draft:'' };

/* --- Storage. Every access can throw (private windows, blocked site data),
       and the page has to render correctly when it does. ------------------ */
function load(){
  try{
    const c = localStorage.getItem('still.chat');
    if(c) chat = Object.assign(chat, JSON.parse(c), {busy:false, picking:false});
  }catch(e){ /* defaults stand */ }
  try{
    const raw = localStorage.getItem('still.state');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    const l = localStorage.getItem('still.lang');
    if(l === 'en' || l === 'zh') lang = l;
  }catch(e){ /* defaults stand */ }
}
function save(){
  try{
    localStorage.setItem('still.state', JSON.stringify(state));
    localStorage.setItem('still.lang', lang);
    localStorage.setItem('still.chat', JSON.stringify(
      {cast: chat.cast, msgs: chat.msgs.slice(-60), said: chat.said}));
  }catch(e){ /* nothing to do; the page still works for this session */ }
}

/* --- Helpers ------------------------------------------------------------- */
const t = (en, zh) => lang === 'zh' ? zh : en;
const L = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n.toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
const byId = (arr, id) => arr.find(x => x.id === id);

function dateLabel(iso){
  const d = new Date(iso + 'T00:00:00Z');
  const o = {timeZone:'UTC'};
  if(lang === 'zh'){
    const wd = d.toLocaleDateString('zh-Hans-CN',{...o, weekday:'long'});
    return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${wd}`;
  }
  // en_GB puts the day before the month, and the app's format keeps a comma
  // after the weekday that the locale's own long form leaves out.
  const wd = d.toLocaleDateString('en-GB',{...o, weekday:'long'});
  const mo = d.toLocaleDateString('en-GB',{...o, month:'long'});
  return `${wd}, ${d.getUTCDate()} ${mo}`;
}
const initial = name => (name || '?').trim()[0] || '?';

const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
/* The app logs a report on the device and can hand it to Mail. The web port
   has neither, so the button says so rather than pretending to send. */
const reportBtn = key => `<button class="icon-btn" data-report="${esc(key)}"
  aria-label="${t('Report','举报')}">${FLAG}</button>`;
const reportNote = key => reported === key
  ? `<p class="report-note">${t('Reporting is in the app — it logs on the device and can be handed to Mail. This page cannot send anything.','举报功能在 App 内：记录在设备上，并可通过邮件发送。此页面无法发送任何内容。')}</p>`
  : '';
function avatar(name, image, cls){
  const inner = image && image.file
    ? `<img src="${IMG}${esc(image.file)}" alt="" loading="lazy">`
    : esc(initial(name));
  return `<div class="av ${cls||''}">${inner}</div>`;
}
const kindLabel = k => L((C.kinds || {})[k]) || k;
const style = k => (C.optionStyle || {})[k] || {fill:'#E0D5C7',ink:'#243235',
  text:'#5F5B54',line:'#243235',bg:'rgba(36,50,53,.06)'};

/* Questions newest first — the app sorts the feed by date descending, so an
   appended question rises to the top instead of sinking to its index. */
const questions = () => C.questions
  .filter(q => q.status === 'published')
  .sort((a,b) => b.date.localeCompare(a.date));

const responsesFor = q => C.responses.filter(r => r.questionId === q.id);

/* Ordered by how far a voice reaches, the way the thread is ordered in the
   app, so the best-known names are not always first by accident. */
function threadRows(q, filter){
  let rs = responsesFor(q);
  if(filter && filter !== 'all') rs = rs.filter(r => r.optionKey === filter);
  return rs.map(r => ({ r, v: byId(C.voices, r.voiceId) }))
           .filter(x => x.v)
           .sort((a,b) => ((b.v.reach||{}).weight||0) - ((a.v.reach||{}).weight||0));
}

function worksFor(q){
  const ids = new Set();
  Object.values(q.answers || {}).forEach(a => (a.workIds||[]).forEach(w => ids.add(w)));
  return [...ids].map(id => byId(C.works, id)).filter(Boolean);
}

/* --- Navigation ---------------------------------------------------------- */
const here = () => stack[stack.length - 1];
function go(entry){ reported = null; stack.push(entry); render(); window.scrollTo(0,0); }
function tab(name){ reported = null; stack = [{tab:name}]; render(); window.scrollTo(0,0); }
function back(){ reported = null;
  if(chat.picking){ chat.picking = false; return render(); }
  if(stack.length > 1){ stack.pop(); render(); } }

/* --- Views --------------------------------------------------------------- */

function optionRow(q, o, chosen){
  const p = style(o.key);
  const answered = chosen != null;
  const mine = chosen === o.key;
  const pct = (q.baselinePct || {})[o.key];
  const dim = answered && !mine ? 'opacity:.42' : '';
  return `
  <button class="opt ${mine?'mine':''}" data-vote="${esc(o.key)}"
          style="border-color:${mine?esc(p.line):'var(--hairline-strong)'}">
    <span class="fillbar" style="background:${mine?esc(p.bg):'var(--fill-muted)'};
          width:${answered && pct!=null ? pct : 0}%"></span>
    <span class="key" style="${answered?`background:${esc(p.fill)};color:${esc(p.ink)};${dim}`:''}">${esc(o.key)}</span>
    <span class="lbl">${esc(L(o.label))}</span>
    ${answered && pct!=null
      ? `<span class="pct" style="${mine?`color:${esc(p.text)}`:''}">${pct}%</span>` : ''}
  </button>`;
}

function questionCard(q, flat){
  const chosen = state.votes[q.id] ?? null;
  const liked = !!state.likes['question:'+q.id];
  const joined = q.joined || 0;
  const close = joined > 0
    ? (chosen == null
        ? t(`Answer to open the thread. ${num(joined)} living have already answered.`,
            `作答后即可展开讨论。已有 ${num(joined)} 位在世的人作答。`)
        : t(`${num(joined)} living have answered. You can change yours any time.`,
            `${num(joined)} 位在世的人已作答。你可以随时更改答案。`))
    : L((C.strings||{})[chosen == null ? 'lead' : 'bars']);

  return `
  <article class="card ${flat?'card--flat':''} q ${flat?'q--flat':''}" data-open="${flat?'':esc(q.id)}">
    <div class="q-top">
      <span class="q-date">${esc(dateLabel(q.date))}</span>
      <button class="icon-btn ${liked?'on':''}" data-like="question:${esc(q.id)}"
              aria-label="${t('Like','喜欢')}" aria-pressed="${liked}">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor"
             stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.7z"/></svg>
      </button>
      ${reportBtn('question:'+q.id)}
    </div>
    <h2 class="q-title">${esc(L(q.title))}</h2>
    <p class="q-why">${esc(L(q.why))}</p>
    <div class="opts">${q.options.map(o => optionRow(q,o,chosen)).join('')}</div>
    <p class="q-close">${esc(close)}</p>
    ${reportNote('question:'+q.id)}
    ${chosen != null && !flat
      ? `<button class="wide" data-open="${esc(q.id)}">${t('Open the thread','打开讨论')}</button>` : ''}
  </article>`;
}

function homeView(){
  const qs = questions();
  const col = side => qs.map((q,i) => i % 2 === side
    ? `<div style="order:${i}">${questionCard(q,false)}</div>` : '').join('');
  return `<div class="page"><div class="feed">
    <div class="feed-col">${col(0)}</div><div class="feed-col">${col(1)}</div>
    <p class="footer-note" style="padding:8px 8px 0">${esc(L((C.strings||{}).footer))}</p>
  </div></div>`;
}

function threadView(id, filter){
  const q = byId(C.questions, id);
  if(!q) return `<div class="empty">${t('Not found','没有找到')}</div>`;
  const rows = threadRows(q, filter);
  const books = worksFor(q);
  const f = filter || 'all';

  const pill = (key, label) => {
    const active = f === key;
    const isOpt = key !== 'all';
    const p = style(key);
    const bg = active ? (isOpt ? p.fill : 'var(--ink)') : 'var(--chip)';
    const fg = active ? (isOpt ? p.ink : 'var(--accent)') : (isOpt ? p.text : 'var(--ink)');
    return `<button class="pill" data-filter="${esc(key)}"
      style="background:${esc(bg)};color:${esc(fg)}">${esc(label)}</button>`;
  };

  return `<div class="page">
    <div style="padding:0 16px">${questionCard(q,true)}</div>

    <h3 class="section-h" style="padding-left:24px">${t('Comments from the past lives','讨论 · 按影响力排序')}</h3>
    <div class="pills">
      ${pill('all', t('All','全部'))}
      ${q.options.map(o => pill(o.key, o.key)).join('')}
    </div>

    <div class="rows">${rows.map(x => responseRow(x, q)).join('') ||
      `<p class="empty">${t('Nothing here yet.','这里还没有内容。')}</p>`}</div>

    ${books.length ? `
      <h3 class="section-h" style="padding-left:24px;font-family:var(--serif);
          font-style:italic;font-size:21px">${esc(L((C.strings||{}).books))}</h3>
      <div class="shelf">${books.map(bookCard).join('')}</div>` : ''}

    <p class="footer-note">${esc(L((C.strings||{}).footer))}</p>
  </div>`;
}

function responseRow({r, v}, q){
  const p = style(r.optionKey);
  const opt = (q.options.find(o => o.key === r.optionKey) || {});
  const liked = !!state.likes['response:'+r.id];
  const src = r.source || {};
  const link = src.url || (v.wiki ? `https://en.wikipedia.org/wiki/${encodeURIComponent(v.wiki)}` : null);

  return `
  <article class="row">
    <button data-voice="${esc(v.id)}" aria-label="${esc(L(v.name))}">${avatar(L(v.name), v.image)}</button>
    <div class="row-body">
      <div class="row-name">
        <b>${esc(L(v.name))}</b><span>${esc(kindLabel(r.kind))}</span>
      </div>
      <span class="voted" style="background:${esc(p.bg)};color:${esc(p.text)}">${
        t('Voted for ','投给 ')}${esc(r.optionKey)} · ${esc(L(opt.label))}</span>

      ${r.quote && L(r.quote) && src.label ? `
        <div class="quotebox">
          <q>${esc(L(r.quote))}</q>
          <span class="src">— ${src.url
            ? `<a href="${esc(src.url)}" target="_blank" rel="noopener"><u>${esc(L(src.label))}</u></a>`
            : `<u>${esc(L(src.label))}</u>`}</span>
        </div>` : ''}

      <p class="claim">${esc(L(r.claim))}</p>
      ${r.detail ? `<p class="detail">${esc(L(r.detail))}</p>` : ''}
      ${r.extra ? `<p class="detail">${esc(L(r.extra))}</p>` : ''}
      ${v.reach ? `<p class="reach">${esc(L(v.reach.note))}</p>` : ''}
      ${link ? `<a class="readmore" href="${esc(link)}" target="_blank" rel="noopener">${
        esc(L((C.strings||{}).readMore))}</a>` : ''}

      <div class="row-foot">
        <span class="origin">${esc(L(r.origin))}</span>
        <button class="icon-btn ${liked?'on':''}" data-like="response:${esc(r.id)}"
                aria-label="${t('Like','喜欢')}" aria-pressed="${liked}">
          <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor"
               stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.7z"/></svg>
        </button>
        ${reportBtn('response:'+r.id)}
      </div>
      ${reportNote('response:'+r.id)}
    </div>
  </article>`;
}

function bookCard(w){
  return `<button class="card book-card" data-work="${esc(w.id)}">
    <div class="cover">${w.image && w.image.file
      ? `<img src="${IMG}${esc(w.image.file)}" alt="" loading="lazy">`
      : `<span>${esc(L(w.title))}</span>`}</div>
    <div><h4>${esc(L(w.title))}</h4><p class="by">${esc(L(w.author))}</p></div>
    <p>${esc(L(w.why))}</p>
  </button>`;
}

/* --- Answers ------------------------------------------------------------- */
/* One passage, drawn at random, from the same bundle the threads use. The
   reader never types the question, so the page cannot pretend to have read
   it — and says so. */
let drawn = null, bookOpen = false;

function quotable(){
  return C.responses.filter(r => r.quote && L(r.quote) && r.source && r.source.label);
}
function draw(){
  const pool = quotable();
  drawn = pool[Math.floor(Math.random() * pool.length)] || null;
}

function answersView(){
  if(!drawn) draw();
  const r = drawn;
  const v = r ? byId(C.voices, r.voiceId) : null;
  const q = r ? byId(C.questions, r.questionId) : null;

  return `<div class="page"><div class="ans">
    <div class="book ${bookOpen?'open':''}" id="book" role="button" tabindex="0"
         aria-label="${bookOpen ? t('Tap to close','轻点合上') : t('Then tap to open','然后轻点打开')}">
      <div class="face leaf">
        <div class="gutter"></div>
        <div class="leaf-text">
          <p class="passage">“${esc(L(r && r.quote))}”</p>
          <p class="attrib">— ${esc(L(v && v.name))}</p>
        </div>
        <div class="block"></div><div class="board"></div>
      </div>
      <div class="board-turn">
        <div class="side cover-face"><img src="${IMG}BookCover.png" alt=""></div>
        <div class="side endpaper"></div>
      </div>
    </div>

    ${bookOpen ? `
      <p class="ans-tap" style="margin-top:20px"><u>${t('Tap to close','轻点合上')}</u></p>
      <section class="reading">
        <p class="label" style="text-align:center;margin:0">${t('AI EXPLANATION','AI 解读')}</p>
        ${v ? `<div class="who">${avatar(L(v.name), v.image)}
          <div><b>${esc(L(v.name))}</b><span>${esc(kindLabel(r.kind))} · ${esc(L(r.origin))}</span></div>
        </div>` : ''}
        <div class="grp">

const clock = ts => { const d = new Date(ts || Date.now());
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0'); };

function msgRow(m, i){
  // Same speaker twice running reads as one turn.
  const prev = chat.msgs[i-1];
  const cont = prev && !!prev.mine === !!m.mine && prev.id === m.id ? ' cont' : '';
  if(m.mine) return `<article class="msg mine${cont}">
      ${'' /* no avatar for the reader: the app has no account and no face */}
      <div class="msg-body"><div class="bubble">${esc(m.text)}</div>
      <span class="stamp">${clock(m.at)}</span></div>
    </article>`;

  const p = philById(m.id) || {name:m.name, image:null};
  // Shown once per philosopher: something they demonstrably wrote, so the
  // generated voice always has the real one beside it for comparison.
  const q = m.said;
  return `<article class="msg${cont}">
    ${castAvatar(p)}
    <div class="msg-body">
      <div class="msg-head"><b>${esc(p.name)}</b>
        <span class="sim">${t('SIMULATED','模拟')}</span></div>
      <div class="bubble">${esc(m.text)}</div>

async function model(){
  if(SAMPLE === undefined){
    try{ SAMPLE = (window.claude && claude.use) ? await claude.use('sample') : null; }
    catch(e){ SAMPLE = null; }
    render();
  }
  return SAMPLE;
}

/* The instruction the whole feature rests on.
   Shaped by the Extrapolative Fidelity review: the task is mandatory-response
   philosophical extrapolation, so "he never discussed this" is not an
   acceptable answer. What is asked for is a controlled interpretive
   continuation — a position derived from commitments the texts actually
   carry — not a guess at what the man would really have thought.

   Three constraints come straight out of the review. Position before voice,
   because style that arrives first hides the reasoning (SHARP). An explicit
   bridge from commitment to modern object, because anachronism is not using
   the word "algorithm" — it is smuggling in modern facts as things the
   thinker already knew (Skinner, §8). And sharp disagreement, because a
   shared base model flattens every thinker toward the same balanced modern
   assistant (RoleCDE; Shi & Haupt's artificial consensus). */
function brief(cast){
  return [
    'You are generating a CONTROLLED INTERPRETIVE CONTINUATION, not a historical claim.',
    'The reader is told on every line that these words are generated.',
    '',
    'Speakers: ' + cast.map(p => p.name).join(', ') + '.',
    '',
    'Work in this order for each speaker. Do not skip to the voice.',
    'a. Find the commitment. Which principle, distinction or priority that this',
    '   thinker demonstrably held actually bears on the question?',
    'b. Build the bridge. Restate the modern object as the philosophical problem',
    '   that commitment can handle. Do NOT assume the thinker knows any modern',
    '   fact, institution or technology. Using the word "algorithm" is fine;',
    '   treating the thinker as already knowing how one works is not.',
    'c. Only then write the position, in their manner.',
    '',
    'Hard rules:',
    '1. NEVER produce a quotation. No quotation marks around anything attributed',
    '   to them, and never "as I wrote in". Real quotations are added by the app',
    '   from sourced texts; you do not supply them.',
    '2. You must take a substantive position. "He never addressed this" is a',
    '   failure, not caution. If the commitments underdetermine the answer, say',
    '   which way they lean and what would settle it.',
    '3. Do not converge. These people disagree about foundations; a reply that',
    '   any thoughtful modern person could have written is a failed reply.',
    '   Refuse the balanced, both-sides, safety-conscious register.',
    '4. Two to four sentences of position. Plain speech. No greetings, no stage',
    '   directions, no asterisks.',
    '',
    'Reply with JSON only: an array of',
    '{"name": <one of the speakers>,',
    ' "commitment": <the principle you are reasoning from, under 12 words>,',
    ' "bridge": <one sentence: how that principle reaches this modern object>,',
    ' "text": <the position, in their manner>}.',
    'One to three entries. Not every speaker has to answer.'
  ].join('\n');
}

function transcript(){
  return chat.msgs.slice(-12).map(m =>
    (m.mine ? 'Reader' : m.name) + ': ' + m.text).join('\n');
}

async function speak(extra){
  const cast = chat.cast.map(philById).filter(Boolean);
  if(!cast.length || chat.busy) return;
  const m = await model();
  if(!m) return;

  chat.busy = true; render();
  try{
    const out = await m.json([{ role:'user', content:
      brief(cast) + '\n\nConversation so far:\n' + (transcript() || '(nothing yet)') +
      '\n\n' + extra }]);
    const rows = Array.isArray(out) ? out : (out && out.replies) || [];
    chat.busy = false;
    for(const r of rows){
      const p = cast.find(x => x.name === r.name) || cast[0];
      if(!p || !r.text) continue;
      // Everything arrived in one response, but delivering it in one go reads
      // as a wall of text rather than people answering. Each turn gets its own
      // typing pause, roughly scaled to how much there is to say.
      chat.typing = p.id; render();
      await new Promise(r2 => setTimeout(r2,
        Math.min(2200, 450 + String(r.text).length * 9)));
      chat.typing = null;
      // One real passage per philosopher, the first time they speak.
      let said = null;
      if(p.quotes.length && !chat.said[p.id]){
        said = p.quotes[Math.floor(Math.random()*p.quotes.length)];
        chat.said[p.id] = 1;
      }
      chat.msgs.push({ id:p.id, name:p.name, text:String(r.text), said,
                       at: Date.now(),
                       commitment: r.commitment ? String(r.commitment) : null,
                       bridge: r.bridge ? String(r.bridge) : null });
      save(); render();
    }
  }catch(e){
    chat.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
      t('The model did not answer. Try again.','模型没有回应，请重试。') });
  }
  chat.busy = false; chat.typing = null; save(); render();
}

  const cur = stack[0].tab;
  document.getElementById('nav').innerHTML =
    '<span class="nav-brand">Still</span>' + TABS.map(([id, label, path]) => `
    <button data-tab="${id}" ${cur===id?'aria-current="page"':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">${path}</svg>
      <span>${esc(label()[lang] || label().en)}</span>
    </button>`).join('');
}

/* --- Render -------------------------------------------------------------- */
function render(){
  const e = here();
  const view = document.getElementById('view');
  let html;
  if(e.voice)      html = voiceView(e.voice);
  else if(e.work)  html = workView(e.work);
  else if(e.thread)html = threadView(e.thread, e.filter);
  else if(e.tab === 'chat')    html = chatView();
  else if(e.tab === 'answers') html = answersView();
  else if(e.tab === 'explore') html = exploreView();
  else if(e.tab === 'me')      html = meView();
  else                          html = homeView();

  const box = document.getElementById('say');
  const hadFocus = box && document.activeElement === box;
  if(box) chat.draft = box.value;

  view.innerHTML = html;

  // A chat that jumps to the top on every new line is unusable, and a
  // composer that loses what you typed mid-sentence is worse.
  const list = document.getElementById('msgs');
  if(list){
    list.scrollTop = list.scrollHeight;
    // Images and wrapped text can change the height after this tick.
    requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });
  }
  const nb = document.getElementById('say');
  if(nb){
    nb.value = chat.draft || '';
    grow(nb);
    if(hadFocus){ nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); }
  }
  document.getElementById('back').hidden = stack.length <= 1 && !chat.picking;
  navBar();
}

/* --- Events. One delegated listener; the whole page is re-rendered from
       state, so nothing has to be wired up per element. -------------------- */
document.addEventListener('click', ev => {
  const hit = sel => ev.target.closest(sel);
  let el;

  if((el = hit('[data-tab]')))    return tab(el.dataset.tab);
  if((el = hit('#back')))         return back();
  if((el = hit('[data-lang]')))   { lang = el.dataset.lang; save(); return render(); }

  if((el = hit('[data-vote]'))){
    const card = el.closest('[data-open]') || el.closest('.q');
    const q = here().thread ? byId(C.questions, here().thread)
                            : byId(C.questions, card && card.dataset.open);
    if(!q) return;
    state.votes[q.id] = el.dataset.vote; save();
    // In the feed, answering is what unlocks the thread, so it opens straight
    // away rather than making the reader tap twice. Inside the thread it just
    // updates in place.
    if(here().thread) render();
    else { render(); setTimeout(() => go({tab:stack[0].tab, thread:q.id}), 320); }
    return;
  }

  if((el = hit('[data-like]'))){
    const k = el.dataset.like;
    if(state.likes[k]) delete state.likes[k]; else state.likes[k] = 1;
    save(); return render();
  }

  if((el = hit('[data-filter]'))){
    here().filter = el.dataset.filter; return render();
  }
  if((el = hit('[data-etype]'))){ exploreFilter = el.dataset.etype; return render(); }
  if((el = hit('[data-voice]'))) return go({tab:stack[0].tab, voice:el.dataset.voice});
  if((el = hit('[data-work]')))  return go({tab:stack[0].tab, work:el.dataset.work});

  /* The turn runs on the element that is already on screen: re-rendering
     with `.open` already set would draw the book open with nothing to
     transition from. A new passage goes under the shut cover first, the
     board swings, and only then is the page re-rendered to match. */
  if((el = hit('#book'))){
    if(el.dataset.turning) return;
    const opening = !bookOpen;
    if(opening){ draw(); render(); el = document.getElementById('book'); void el.offsetWidth; }
    el.dataset.turning = '1';
    el.classList.toggle('open', opening);
    const settle = () => { bookOpen = opening; render(); };
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) settle();
    else setTimeout(settle, opening ? 950 : 800);
    return;
  }

  if((el = hit('[data-pick-open]'))){ chat.picking = true; return render(); }
  if((el = hit('[data-toggle]'))){
    const id = el.dataset.toggle;
    chat.cast = chat.cast.includes(id)
      ? chat.cast.filter(x => x !== id) : chat.cast.concat(id);
    save(); return render();
  }
  if((el = hit('[data-drop]'))){
    chat.cast = chat.cast.filter(x => x !== el.dataset.drop); save(); return render();
  }
  if((el = hit('[data-talk]'))){
    return speak('Continue: have them take up the argument with each other. '
               + 'Do not address the reader.');
  }
  if((el = hit('[data-clear]'))){
    chat.msgs = []; chat.said = {}; save(); return render();
  }

  if((el = hit('[data-report]'))){
    reported = reported === el.dataset.report ? null : el.dataset.report;
    render(); return;
  }

  if((el = hit('#reset'))){
    state = { votes:{}, likes:{} }; save(); return render();
  }

  if((el = hit('a'))) return;               // let real links through

  if((el = hit('[data-open]')) && el.dataset.open){
    return go({tab:stack[0].tab, thread:el.dataset.open});
  }
});

function grow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(140, el.scrollHeight) + 'px';
}

function send(){
  const box = document.getElementById('say');
  const text = box ? box.value.trim() : '';
  if(!text || chat.busy) return;
  chat.msgs.push({ mine:true, text, at: Date.now() });
  chat.draft = ''; if(box){ box.value = ''; grow(box); }
  save(); render();
  speak('The reader just said: ' + text + '\nAnswer them.');
}

document.addEventListener('submit', ev => {
  if(ev.target.id !== 'composer') return;
  ev.preventDefault(); send();
});

document.addEventListener('input', ev => {
  if(ev.target.id === 'say'){ chat.draft = ev.target.value; grow(ev.target); return; }
  if(ev.target.id === 'pq'){
    // Re-rendering on every keystroke would steal the caret, so the list is
    // refreshed in place and the field left alone.
    chat.query = ev.target.value;
    const v = document.querySelector('.picker');
    if(v){ const inp = v.querySelector('input');
      v.innerHTML = pickerView().split('<div class="picker">')[1].split('</div></div>')[0];
      const n = v.querySelector('input'); if(n){ n.value = chat.query; n.focus();
        n.setSelectionRange(chat.query.length, chat.query.length); } }
  }
});

document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'book'){ ev.target.click(); }
  // Enter sends; Shift+Enter is a new line. On a phone the key is Return and
  // people expect it to send, as it does everywhere else.
  if(ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'say'){
    ev.preventDefault(); send();
  }
});

addEventListener('scroll', () => {
  document.getElementById('bar').classList.toggle('scrolled', scrollY > 4);
}, {passive:true});

/* --- Boot ---------------------------------------------------------------- */
load();
Promise.all([
  fetch('assets/content.json').then(r => r.json()),
  fetch('assets/philosophers.json').then(r => r.json()).catch(() => ({philosophers:[]}))
]).then(([data, roster]) => { C = data; PHIL = roster.philosophers || []; render(); model(); })
  .catch(() => {
    document.getElementById('view').innerHTML =
      `<p class="empty">Could not load the content file.</p>`;
  });
</script>
