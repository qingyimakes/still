/* The agent answers one question for one thinker; it has no transcript. The
   question is the reader's last line, or for "let them argue", the last line
   anyone said. */
async function agentSpeak(c, cast){
  const last = c.msgs[c.msgs.length - 1];
  const question = last && last.text;
  if(!question){
    c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
      t('Say something first. The agent answers what was said; it does not start a conversation.',
        '先说点什么。代理回答别人说过的话，不会自己开启对话。') });
    return;
  }
  const missing = cast.filter(p => !AGENT_IDS[p.id]);
  if(missing.length && !c.agentMissingNoted){
    c.agentMissingNoted = 1;
    c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
      t(`${missing.map(p => p.name).join(', ')} ${missing.length > 1 ? 'are' : 'is'} not in the agent's library, so only the others answer.`,
        `${missing.map(p => p.name).join('、')} 不在代理的文库中，因此只有其他人回应。`) });
    save(); render();
  }
  ROUND = { id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                 : String(Date.now()) + Math.random().toString(16).slice(2),
            ctl: new AbortController() };
  const stopped = () => {
    chat.stopped = false;   // said here; speak() need not say it again
    c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
      t('Stopped. No one else was asked.', '已停止，没有再问其他人。') });
    save(); render();
  };
  // Chats opened before B11 have the card but no ask: send its words.
  const ctxMsg = c.msgs.find(m => m.context && m.quote);
  const askCtx = !ctxMsg ? null : ctxMsg.ask || { quote: ctxMsg.quote.en || L(ctxMsg.quote), work: '',
    author: (ctxMsg.source && ctxMsg.source.label && String(ctxMsg.source.label.en || '').split(',')[0]) || '', passageId: '' };
  let answered = 0;
  // Busy: one calm line. If no one has answered yet, the reader's message
  // goes back into the box, so trying again is one tap.
  const busyLine = (b, restore) => {
    chat.typing = null;
    const mine = restore && !answered && c.msgs[c.msgs.length - 1];
    if(mine && mine.mine){
      c.msgs.pop();
      chat.draft = mine.text;
      setTimeout(() => { const box = document.getElementById('say'); if(box){ box.value = mine.text; grow(box); syncSend(); } });
    }
    c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: lang === 'zh'
      ? '现在提问的人很多，请过一分钟再试。'
      : String((b && b.detail) || 'Lots of people are asking right now. Try again in a minute.') });
    save(); render();
  };
  for(const p of cast.filter(x => AGENT_IDS[x.id])){
    if(ROUND.ctl.signal.aborted){ stopped(); return; }
    // Nothing runs in a tab nobody is looking at. The round stops here and
    // the next one needs another click.
    if(document.hidden){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t('Stopped because the page was hidden. Send again to continue.',
          '页面被隐藏，因此已停止。再次发送即可继续。') });
      save(); render();
      return;
    }
    chat.typing = p.id; render();
    let row = null, busy = false;
    try{
      const pick = agentChoice();
      const out = await agentFetch('/v1/ask',
        { question, thinker: AGENT_IDS[p.id], why: true, message_id: ROUND && ROUND.id,
          lang: questionLang(question),
          ...(askCtx ? { context: askCtx } : {}),
          ...(pick ? { choice: pick.id } : {}) }, 90000);
      if(out && out.busy){ busyLine(out.busy, true); return; }
      if(out && out.rated){
        chat.typing = null;
        c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: t(
          'Too many messages at once. Wait a minute and try again.', '消息太频繁了，请稍等一分钟再试。') });
        save(); render(); return;
      }
      if(out && out.limit && out.limit.choice === 'tester'){
        chat.typing = null;
        c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: out.limit.reason === 'site_daily'
          ? t("Still has reached today's limit for everyone. It resets at midnight.", 'Still 今天的总额度已用完，午夜重置。')
          : t("Your code's 15 messages for today are used up. They reset at midnight.", '你的访问码今天的 15 条消息已用完，午夜重置。') });
        save(); render(); return;
      }
      if(out && out.limit){
        chat.typing = null;
        const used = out.limit.used_up || [{ choice: out.limit.choice, group: out.limit.choice,
                                             reason: out.limit.reason }];
        const claudeHit = used.find(u => u.group === 'claude');
        const groqHit = used.filter(u => u.group !== 'claude');
        // A Claude cap: the pop-up, once per limit. The chat goes on with Groq.
        if(claudeHit) claudeLimitAlert(claudeHit.reason, out.limit.usage);
        // Groq used up too (or a Groq-only pick): the inline line.
        if(groqHit.length){
          const names = [...new Set(groqHit.map(u => modelName(u.model || u.choice)))];
          const parts = [t(`Today's limit for ${names.join(', ')} is used up. It resets at midnight.`,
                           `${names.join('、')} 今天的额度已用完，午夜重置。`)];
          if(claudeHit) parts.push(claudeHit.reason === 'period'
            ? t("This period's Claude budget is used up too.", '本期的 Claude 预算也已用完。')
            : t("Claude's daily limit is used up too.", 'Claude 今天的额度也已用完。'));
          c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: parts.join(' ') });
        }
        refreshAgentInfo();
        save(); render();
        return;   // the rest of the round would hit the same cap
      }
      row = out && out.answers && out.answers[0];
      // One thinker busy inside a 200: say so for them, and go on.
      if(row && (row.busy || (out && out.busy === true))){ busyLine(row, false); continue; }
    }catch(e){
      if(ROUND && ROUND.ctl.signal.aborted){ chat.typing = null; stopped(); return; }
      // The agent wants its passcode: stop the round and ask for it.
      if(e.message === 'auth' || e.message === 'access'){ chat.typing = null; save(); render(); return; }
      if(e.message === 'starting'){
        chat.typing = null;
        c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: t(
          'The thinkers are waking up. This can take a minute or two; send your message again when they are ready.',
          '思想家们正在醒来，可能需要一两分钟；准备好后请再发一次。') });
        save(); render(); return;
      }
      // An HTTP status means the agent is up and something behind it failed;
      // no status means the agent itself is gone.
      if(/^agent \d+$/.test(e.message)) busy = true; else AGENT_STATE = 'down';
    }
    chat.typing = null;
    // The next thinker's worst case would cross the per-message cap: skipped
    // without a call, and said plainly.
    if(row && (row.skipped || (row.why && row.why.skipped))){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t(`Skipped ${pn(p)} to stay under the per-message limit.`,
          `为了不超过单条消息的上限，跳过了 ${pn(p)}。`) });
      save(); render();
      continue;
    }
    // The model was rate-limited or failed and the agent fell back to its
    // extractive composer. Nothing generated stands in for the reply.
    // The API refused the model itself (e.g. Fable 5.1 needs 30-day data
    // retention): say so, not "busy", and let the menu grey it out.
    if(row && row.why && row.why.degraded && row.why.unavailable){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t(`${modelName(row.why.served_by)} is not available on this account, so ${pn(p)} has no reply. Pick another model.`,
          `${modelName(row.why.served_by)} 在这个账户上不可用，因此 ${pn(p)} 没有回应。请换一个模型。`) });
      save(); render(); refreshAgentInfo();
      continue;
    }
    if(row && row.why && row.why.degraded){ busy = true; row = null; }
    if(busy){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t(`The model is busy, so ${pn(p)} has no reply this time. Try again in a minute.`,
          `模型正忙，${pn(p)} 这次没有回应。请过一分钟再试。`) });
      save(); render();
      continue;
    }
    // No passage bears on it and no model wrote from principle: the
    // interface says so. Nothing is put in the thinker's mouth.
    if(row && row.why && row.why.no_passage){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t(`No passage in the agent's texts for ${pn(p)} bears on this.`,
          `代理所存${pn(p)}的文本中，没有段落涉及这个问题。`) });
      save(); render();
      continue;
    }
    if(!row || !row.answer){
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t('The agent did not answer. Try again.','代理没有回应，请重试。') });
      save(); render();
      if(AGENT_STATE === 'down') return;
      continue;
    }
    const why = row.why || { sentences:[], passages:[] };
    const passed = why.fell_back_from || [];
    if(passed.length && !AGENT_FELL_BACK)
      AGENT_FELL_BACK = passed.some(x => /^limit/.test(x.reason)) ? 'limit' : 'error';
    // The host of the model that actually wrote it, which under Auto may not
    // be the first one tried.
    const served = agentChoices().find(r => r.id === why.served_by);
    why.provider_host = (served && served.provider_host)
      || (AGENT_INFO && AGENT_INFO.provider_host) || '';
    answered++;
    c.msgs.push({ id:p.id, name:p.name, text:String(row.answer), said:null,
                  at: Date.now(), agent: why, round: ROUND && ROUND.id });
    markFresh(c.msgs[c.msgs.length - 1]);
    c.at = Date.now(); save(); render();
  }
}

const QUOTE_MARKS = /[\u201C\u201D\u201E\u201F"\u00AB\u00BB\u300C\u300D\u300E\u300F]/g;

/* The answer as the reader sees it. A span keeps its quotation marks only if
   the agent's verifier matched it word-for-word to a passage; every other
   quotation mark is removed, so nothing unverified can look like a quote. */
const BLOCK_QUOTE_CHARS = 90;
function agentBubble(a, fallback){
  const nums = {}, byId = {};
  (a.passages || []).forEach((p, i) => { nums[p.id] = i + 1; byId[p.id] = p; });
  const sentences = a.sentences && a.sentences.length ? a.sentences
                  : [{ text: fallback, quotes: [] }];
  // Inline html, with blank lines and block quotes as paragraph breaks.
  const out = []; let para = [], afterBlock = false;
  const flush = () => { const h = para.join('').trim(); if(h) out.push(`<p>${h}</p>`); para = []; };
  for(const s of sentences){
    let parts = [{ t: String(s.text || ''), q: null }];
    for(const q of (s.quotes || []).filter(q => q.verbatim && q.quote)){
      parts = parts.flatMap(part => {
        if(part.q) return [part];
        const i = part.t.indexOf(q.quote);
        if(i < 0) return [part];
        return [{ t: part.t.slice(0, i), q: null }, { t: q.quote, q },
                { t: part.t.slice(i + q.quote.length), q: null }];
      });
    }
    for(const part of parts){
      if(!part.q){
        let plain = part.t.replace(QUOTE_MARKS, '');
        // The punctuation that closed a block quote would open the next
        // paragraph ("。这些…"); the block already ends the sentence.
        if(afterBlock) plain = plain.replace(/^[\s.,;:!?\u3002\uFF0C\u3001\uFF1B\uFF1A\uFF01\uFF1F\u2019\u201D'"\u300D\u300F\u00BB)\uFF09]+/, '');
        if(plain) afterBlock = false;
        const bits = plain.split(/\n\s*\n/);
        bits.forEach((b, k) => { if(k) flush(); para.push(ital(esc(b))); });
        continue;
      }
      const n = nums[part.q.evidence_id], src = byId[part.q.evidence_id];
      if(part.t.length >= BLOCK_QUOTE_CHARS){
        // Drop the colon or dash that led into it; the block makes the break.
        if(para.length) para[para.length - 1] = para[para.length - 1].replace(/[\s:\uFF1A—–-]+$/, '');
        flush();
        const raw = src && (src.title || src.work_id || '');
        const title = cleanTitle(raw);
        const loc = [headingOf(raw), src && src.locator && !String(raw).includes(src.locator) ? locText(src.locator) : '']
          .filter(Boolean).join(', ');
        out.push(`<blockquote class="vblock"><p>${ital(esc(part.t))}</p>${src ? `<footer>${
          ital(esc(title))}${loc ? ', ' + ital(esc(loc)) : ''}${
          n ? ` · ${t('passage','第')} ${n}${lang === 'zh' ? ' 段' : ''}` : ''}</footer>` : ''}</blockquote>`);
        afterBlock = true;
      }else{
        afterBlock = false;
        para.push(`<q class="vq">${ital(esc(part.t))}</q>${n ? `<sup class="vref">${n}</sup>` : ''}`);
      }
    }
    if(!afterBlock) para.push(' ');
  }
  flush();
  return out.join('') || '<p></p>';
}

/* Sentence by sentence: each sentence (shortened), its label beneath. A
   quoted sentence shows the quoted words and the passage they matched.
   When nothing rests on a passage, every row would carry the same label,
   so there is no list: "What the agent did" already says it is inference
   with no quotation. */
function sentenceList(a, nums){
  const ss = a.sentences || [];
  const framed = x => x.support === 'framing' || x.support === 'uncited';
  if(!ss.length || !(a.passages || []).length || ss.every(framed)) return '';
  const cut = x => { x = String(x || '').trim(); return x.length > 120 ? x.slice(0, 117).replace(/\s+\S*$/, '') + '…' : x; };
  return `<p><span class="tag">${t('Sentence by sentence','逐句')}</span></p>
    <ol class="checks">${ss.map(x => {
      const q = (x.quotes || []).find(y => y.verbatim && y.quote);
      const text = q ? '\u201C' + cut(q.quote) + '\u201D' : cut(String(x.text || '').replace(QUOTE_MARKS, ''));
      return `<li><span class="s-text">${esc(text)}</span><span class="s-lab">${agentCheck(x, nums)}</span></li>`;
    }).join('')}</ol>`;
}

function agentCheck(s, nums){
  const refs = (s.evidence_ids || []).map(e => nums[e]).filter(Boolean);
  const at = refs.length ? t(` (passage ${refs.join(', ')})`, `（第 ${refs.join('、')} 段）`) : '';
  return ({
    quoted:      t('a quotation, matched word-for-word', '引文，逐字核对过') + at,
    supported:   t('a paraphrase the passage supports', '有段落支持的转述') + at,
    weak:        t('loosely tied to the passage', '与段落关联较弱') + at,
    unsupported: t('not supported by the passage', '段落不支持') + at,
    framing:     t("the agent's own framing, not from the text", '代理自己的衔接语，不出自文本'),
    uncited:     t("the agent's own framing, not from the text", '代理自己的衔接语，不出自文本'),
  })[s.support] || esc(s.support || '');
}

/* A passage the agent read. Its source opens the book: the work's own
   page when the threads feature it, else the thinker's page, where it is
   listed under Works. */
/* The agent's locator, read aloud: "paragraphs 181-181 (MVP rule)" is one
   paragraph, numbered by Still's own corpus rule rather than an edition's,
   so it says that in words. Nothing is dropped. */
/* The agent's titles and locators can carry its own bookkeeping
   ("Gutenberg #52881 / interval main / heading: BOOK FIRST / body [114408,116971]
   / segment 121", "profile interval main [56,166154)"). Readers see the work
   and a plain place in it; a "heading:" becomes that place. */
function cleanTitle(s){
  s = String(s || '');
  const cut = s.search(/,?\s*Gutenberg\s*#\d+|\s\/\s/);
  return (cut > 0 ? s.slice(0, cut) : s).trim();
}
function headingOf(s){
  const m = String(s || '').match(/heading:\s*([^/\[]+)/i);
  if(!m) return '';
  const h = m[1].trim();
  return h === h.toUpperCase() ? h.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : h;
}
function cleanLoc(l){
  l = String(l || '')
    .replace(/\bprofile\s+/ig, '')
    .replace(/\binterval\s+[\w.-]+\s*(\[[^\])]*[\])])?/ig, '')
    .replace(/\b(body|segment)\s*(\[[^\])]*[\])]|\d+)/ig, '')
    .replace(/\bheading:\s*[^/\[]+/ig, '')
    .replace(/[\s/,]+$|^[\s/,]+/g, '').replace(/\s*\/\s*/g, ' ').replace(/\s{2,}/g, ' ');
  return l;
}
/* _word_ in the source texts is the transcriber's italics. */
const ital = h => h.replace(/(^|[\s(“"'‘])_([^_\n]+?)_(?=[\s.,;:!?)”"'’]|$)/g, '$1<em>$2</em>');
function locText(l){
  l = cleanLoc(l).trim();
  l = l.replace(/\b(paragraph|page|line|section)s?\s+(\d+)\s*[-–]\s*\2\b/i, (m, w, a) => `${w.toLowerCase()} ${a}`)
       .replace(/\b(paragraph|page|line|section)s\s+(\d+)\s*[-–]\s*(\d+)/i, (m, w, a, b) => `${w.toLowerCase()}s ${a}–${b}`);
  return l.replace(/\s*\(MVP rule\)/i, t(" (Still's numbering)", '（Still 的编号）'));
}
function agentPassage(p, n, who){
  const raw = p.title || p.work_id || '';
  const title = cleanTitle(raw);
  const locs = [headingOf(raw), p.locator && !String(raw).includes(p.locator) ? locText(p.locator) : ''].filter(Boolean);
  const loc = locs.length ? ', ' + locs.join(', ') : '';
  const v = who && who.voiceId ? byId(C.voices, who.voiceId) : null;
  const k = normTitle(String(title).replace(/,?\s*trans\..*$/i, ''));
  const cw = v ? (v.workIds || []).map(id => byId(C.works, id)).filter(Boolean)
    .find(w => { const n2 = normTitle(w.title.en); return n2 && k && (k.includes(n2) || n2.includes(k)); }) : null;
  const target = cw ? `data-work="${esc(cw.id)}"` : who ? (who.voiceId ? `data-voice="${esc(who.voiceId)}"` : `data-phil="${esc(who.id)}"`) : '';
  return `<div class="said">
    <span class="tag">${p.cited ? t('From the text','出自文本') : t('Read, not cited','读过，未引用')}
      <span class="num">· ${n}</span></span>
    <q>${ital(esc(p.text))}</q>
    <span class="src">— ${target ? `<a href="#" class="linkish src-link" ${target}>${ital(esc(title))}</a>` : ital(esc(title))}${ital(esc(loc))}</span>
  </div>`;
}

const FOLD_CHEV = '<svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* Which replies have their passages open survives a re-render. */
const FOLD_OPEN = new Set();
document.addEventListener('toggle', ev => {
  const d = ev.target; if(!d.classList || !d.classList.contains('said-fold')) return;
  const k = d.closest('[data-k]') && d.closest('[data-k]').dataset.k; if(!k) return;
  d.open ? FOLD_OPEN.add(k) : FOLD_OPEN.delete(k);
}, true);
function agentRow(m, p, cont, last){
  const a = m.agent || {};
  const passages = a.passages || [];
  return `<article class="msg${cont}" data-k="${esc(msgKey(m))}">
    <div class="msg-body">
      <div class="msg-head">${linkAvatar(p)}<b>${esc(pn(p))}</b></div>
      <div class="bubble">${agentBubble(a, m.text)}</div>
      ${passages.length ? `<details class="said-fold"${FOLD_OPEN.has(msgKey(m)) ? ' open' : ''}>
        <summary><span>${t('Sources','来源')} · ${passages.length}</span>
          ${FOLD_CHEV}</summary>
        ${passages.map((x, i) => agentPassage(x, i + 1, p)).join('')}
      </details>` : ''}
      ${msgFoot(m, last)}
    </div>
  </article>`;
}

/* The derivation behind one agent reply, shown in a sheet on request. */
function agentDerivation(m){
  const a = m.agent || {};
  const passages = a.passages || [];
  const nums = {};
  passages.forEach((x, i) => { nums[x.id] = i + 1; });
  const how = a.mode === 'direct'
    ? t('A passage bears on this directly; the reply rests on it.',
        '有段落直接涉及这个问题，回应以它为依据。')
    : !passages.length
    ? t('No passage the agent holds bears on this. The model reasoned from principles the thinker held, with no quotation. That is an inference, not a view the thinker stated.',
        '代理所存的文本中没有段落涉及这个问题。模型从这位思想家持有的原则推理，没有任何引文。这是推论，不是这位思想家陈述过的观点。')
    : t('The texts do not address this. The reply reasons from principles they do state. That is an inference, not a view the thinker held.',
        '文本没有谈到这个问题。回应是从文本确实陈述过的原则推出的 — 这是推论，不是这位思想家持有的观点。');
  const by = a.provider === 'deterministic'
    ? t('No language model. The agent picks sentences from the passages and frames them in the first person.',
        '没有使用语言模型。代理从段落中挑选句子，并以第一人称加以衔接。')
    : !passages.length
    ? t(`A language model (${esc(a.model || a.provider || '?')}${a.provider_host ? ', hosted at ' + esc(a.provider_host) : ''}) wrote the reply. No passage was found, so it carries no quotation to check.`,
        `由语言模型（${esc(a.model || a.provider || '?')}${a.provider_host ? '，托管于 ' + esc(a.provider_host) : ''}）写成。没有找到相关段落，因此没有可核对的引文。`)
    : t(`A language model (${esc(a.model || a.provider || '?')}${a.provider_host ? ', hosted at ' + esc(a.provider_host) : ''}) wrote the prose from the passages below. The agent then checked every quotation against them and removed any it could not match.`,
        `由语言模型（${esc(a.model || a.provider || '?')}${a.provider_host ? '，托管于 ' + esc(a.provider_host) : ''}）根据下面的段落写成。代理随后把每一处引文与段落核对，删去无法对上的。`);
  return `<div class="derived">
    <p><span class="tag">${t('What the agent did','代理做了什么')}</span>${how}</p>
    <p><span class="tag warn">${t('Derived, not historical','推导所得，非史实')}</span>${t(
      'Software wrote this in the first person. The only words that are the thinker\'s are the ones in quotation marks, each matched word for word to the numbered passage.',
      '这段话由软件以第一人称写成。只有引号中的文字出自这位思想家，每一处都与编号段落逐字核对过。')}</p>
    <p><span class="tag">${t('Written by','写作方式')}</span>${by}</p>
    ${sentenceList(a, nums)}
  </div>`;
}

/* The instruction the whole feature rests on.
   Shaped by the Extrapolative Fidelity review: the task is mandatory-response
   philosophical extrapolation, so "he never discussed this" is not an
   acceptable answer. What is asked for is a controlled interpretive
   continuation — a position derived from commitments the texts actually
   carry — not a guess at what the man would really have thought.

   Three constraints come straight out of the review. Position before voice,
   because style that arrives first hides the reasoning (SHARP). An explicit
   bridge from commitment to modern object, because anachronism is not using
   the word "algorithm" — it is smuggling in modern facts as things the
   thinker already knew (Skinner, §8). And sharp disagreement, because a
   shared base model flattens every thinker toward the same balanced modern
   assistant (RoleCDE; Shi & Haupt's artificial consensus). */
function brief(cast){
  return [
    'You are generating a CONTROLLED INTERPRETIVE CONTINUATION, not a historical claim.',
    'The reader is told on every line that these words are generated.',
    '',
    'Speakers: ' + cast.map(p => p.name).join(', ') + '.',
    '',
    'Work in this order for each speaker. Do not skip to the voice.',
    'a. Find the commitment. Which principle, distinction or priority that this',
    '   thinker demonstrably held actually bears on the question?',
    'b. Build the bridge. Restate the modern object as the philosophical problem',
    '   that commitment can handle. Do NOT assume the thinker knows any modern',
    '   fact, institution or technology. Using the word "algorithm" is fine;',
    '   treating the thinker as already knowing how one works is not.',
    'c. Only then write the position, in their manner.',
    '',
    'Hard rules:',
    '1. NEVER produce a quotation. No quotation marks around anything attributed',
    '   to them, and never "as I wrote in". Real quotations are added by the app',
    '   from sourced texts; you do not supply them.',
    '2. You must take a substantive position. "He never addressed this" is a',
    '   failure, not caution. If the commitments underdetermine the answer, say',
    '   which way they lean and what would settle it.',
    '3. Do not converge. These people disagree about foundations; a reply that',
    '   any thoughtful modern person could have written is a failed reply.',
    '   Refuse the balanced, both-sides, safety-conscious register.',
    '4. Two to four sentences of position. Plain speech. No greetings, no stage',
    '   directions, no asterisks.',
    '',
    'Reply with JSON only: an array of',
    '{"name": <one of the speakers>,',
    ' "commitment": <the principle you are reasoning from, under 12 words>,',
    ' "bridge": <one sentence: how that principle reaches this modern object>,',
    ' "text": <the position, in their manner>}.',
    'Give EXACTLY ONE entry for each speaker listed, in the order listed.',
    'Everyone in the room speaks once. Later speakers should answer what the',
    'earlier ones just said, not repeat them.',
    lang === 'zh' ? 'Write every field in Simplified Chinese.' : 'Write every field in English.'
  ].join('\n');
}

function transcript(){
  const c = convo(); if(!c) return '';
  return c.msgs.filter(m => !m.context).slice(-12).map(m =>
    (m.mine ? 'Reader' : m.name) + ': ' + m.text).join('\n');
}

async function speak(extra){
  const c = convo(); if(!c) return;
  const cast = c.cast.map(philById).filter(Boolean);
  if(!cast.length || chat.busy || document.hidden) return;
  chat.stopped = false;
  try{ await speakRound(c, cast, extra); }
  finally{
    if(chat.stopped){
      chat.stopped = false;
      c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
        t('Stopped. No one else was asked.', '已停止，没有再问其他人。') });
      save(); render();
    }
  }
}
async function speakRound(c, cast, extra){
  // Order: the local agent when switched on and healthy, then the artifact
  // runtime's model, then the authored DEMO rounds.
  if(AGENT_URL){
    // Busy before the first await, so a second click during the health check
    // cannot start a second round: one click, one round.
    chat.busy = true; render();
    let used = false;
    try{
      const ok = await agentReady();
      if(ok && cast.some(p => AGENT_IDS[p.id])){
        used = true;
        await agentSpeak(c, cast);
      }else if(ok){
        used = true;
        notInLibrary(c, cast);
      }
    }finally{
      ROUND = null;
      chat.busy = false; chat.typing = null; save(); render();
    }
    if(used){ refreshAgentInfo(); return; }
  }
  const m = await model();
  chat.busy = true; render();
  if(!m){
    // No model here. Rather than a button that does nothing, play an
    // authored round and say in the transcript that that is what it is.
    await demoSpeak(c, cast);
    chat.busy = false; chat.typing = null; save(); render();
    return;
  }

  try{
    const out = await m.json([{ role:'user', content:
      brief(cast) + '\n\nConversation so far:\n' + (transcript() || '(nothing yet)') +
      '\n\n' + extra }]);
    const rows = Array.isArray(out) ? out : (out && out.replies) || [];
    chat.busy = false;
    for(const r of rows){
      if(chat.stopped) break;
      const p = cast.find(x => x.name === r.name) || cast[0];
      if(!p || !r.text) continue;
      // Everything arrived in one response, but delivering it in one go reads
      // as a wall of text rather than people answering. Each turn gets its own
      // typing pause, roughly scaled to how much there is to say.
      chat.typing = p.id; render();
      await new Promise(r2 => setTimeout(r2,
        Math.min(2200, 450 + String(r.text).length * 9)));
      chat.typing = null;
      // One real passage per philosopher, the first time they speak.
      let said = null;
      if(p.quotes.length && !c.said[p.id]){
        said = p.quotes[Math.floor(Math.random()*p.quotes.length)];
        c.said[p.id] = 1;
      }
      c.msgs.push({ id:p.id, name:p.name, text:String(r.text), said,
                    at: Date.now(),
                    commitment: r.commitment ? String(r.commitment) : null,
                    bridge: r.bridge ? String(r.bridge) : null });
      markFresh(c.msgs[c.msgs.length - 1]);
      c.at = Date.now(); save(); render();
    }
  }catch(e){
    c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text:
      t('The model did not answer. Try again.','模型没有回应，请重试。') });
  }
  chat.busy = false; chat.typing = null; save(); render();
}

let exploreFilter = 'all';

let exploreQuery = '';

/* Explore is the whole roster: the 151 people the chat can seat, Pro (the
   50 most read) first by rank, then Free. Then the books and schools that
   speak in the threads, then the few thread voices who are not in the
   roster. Pro is a label, not a lock: no price, no paywall. */
const tierLabel = tier => tier === 'pro' ? t('Pro','Pro') : t('Basic','基础');

/* --- The map: who taught, influenced, or shared a school with whom ------

   `f` scales the offsets round the box's centre (a zoom). */
function mapRender(f){
  const sc = document.querySelector('.map-scroll');
  const at = sc && { l: sc.scrollLeft, t: sc.scrollTop, w: sc.clientWidth, h: sc.clientHeight };
  render();
  const nx = document.querySelector('.map-scroll');
  if(!at || !nx) return;
  const k = f || 1;

  const ids = Object.keys(MAP.nodes).filter(id => philById(id));
  const born = id => { const b = MAP.nodes[id].born; return b != null ? b : (id === 'p-zhuangzi' ? -369 : 0); };
  ids.sort((a, b) => born(a) - born(b));
  // Time is compressed: centuries before 1500 take less room than after.
  const yr = y => y < 1500 ? (y + 600) / 2100 * 0.45 : 0.45 + (y - 1500) / 400 * 0.55;
  const W = 1180, X0 = 60, X1 = W - 60, lanes = [], pos = {};
  for(const id of ids){
    const x = X0 + yr(born(id)) * (X1 - X0);
    let lane = lanes.findIndex(l => x - l > 66); if(lane < 0){ lane = lanes.length; lanes.push(-1e9); }
    lanes[lane] = x; pos[id] = { x, lane };

function meAvatar(cls){
  const name = ME_NAME.trim() || t('Reader','读者');
  return ME_PHOTO ? `<img class="av ${cls} me-photo" src="${esc(ME_PHOTO)}" alt="">`

function setPhotoFrom(file){
  if(!file || !/^image\//.test(file.type)) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const n = 192, c = document.createElement('canvas'); c.width = c.height = n;
    const k = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, n, n);
    URL.revokeObjectURL(url);
    ME_PHOTO = c.toDataURL('image/jpeg', .85);
    try{ localStorage.setItem('still.photo', ME_PHOTO); }catch(e){}
    render();
  };
  img.src = url;
}

      <span>${esc(label()[lang] || label().en)}</span>
    </button>`).join('');
}

/* --- Render -------------------------------------------------------------- */
function viewHTML(e){
  if(e.phil)       return philView(e.phil);
  if(e.voice)      return voiceView(e.voice);
  if(e.work)       return workView(e.work);
  if(e.book)       return bookView(e.book);
  if(e.thread)     return threadView(e.thread, e.filter);
  if(e.tab === 'chat')    return chatView();
  if(e.tab === 'answers') return answersView();
  if(e.tab === 'explore') return exploreView();
  if(e.tab === 'me')      return meView();
  return homeView();
}
function render(){
  // Nothing re-draws the Answers page while its book is turning: rebuilding
  // it shut stopped the flip, and moving the turning book out and back in
  // cancelled the cover's turn (it snapped open) and restarted the riffle,
  // which the landing then cut off. The landing renders anyway.
  if(BOOK_FLIPPING && stack.length === 1 && here().tab === 'answers') return;
  const e = here();
  const view = document.getElementById('view');
  const html = viewHTML(e);
  // Moving between pages (see NAVIGATION): the page being left is kept as a
  // copy, under the new one for a push and over it for a pop.
  const ghost = NAV ? navSnapshot(view) : null;

  // Where the reader was in the conversation, before this render.
  const oldList = document.getElementById('msgs');
  const was = oldList ? { top: oldList.scrollTop,
    atBottom: oldList.scrollHeight - oldList.scrollTop - oldList.clientHeight < 48 } : null;
  const box = document.getElementById('say');
  const hadFocus = box && document.activeElement === box;
  if(box) chat.draft = box.value;

  view.innerHTML = html + accessSheet() + onboardSheet() + answerFirstDialog() + confirmDialog() + feedbackDialog() + reportDialog() + rateDialog();
  if(ghost) navAnimate(ghost, NAV);
  NAV = null;
  document.documentElement.classList.toggle('ob-open', OB.open);
  OB.moved = false;
  document.documentElement.classList.toggle('on-answers', !!view.querySelector('.page--answers'));
  StillFlip.measure(document.getElementById('book'));
  mountGoogle();
  setThemeColor(view.querySelector('.page--answers') ? '#5B8352' : '#FAFAFA');
  document.documentElement.classList.toggle('in-convo', !!view.querySelector('.chat-wrap.has-open'));

  // Scrolling, the way a messenger does it (founder: long replies landed
  // on their last line, and any re-draw yanked the reader to the bottom):
  // - a new conversation, or your own message: to the bottom;
  // - a new reply: to where it starts, so you read it from the top;
  // - anything else (a check, a thumbs-up, typing): stay where you were,
  //   unless you were already at the bottom.
  // Today's use opens over everything: lift it out of the chat's foot (which
  // sits under the tab bar and narrows a fixed sheet) to <body>.
  document.querySelectorAll('body > .uback.portal, body > .upanel.portal, body > .mback.portal, body > .mmenu.portal').forEach(e => e.remove());
  // The model sheet too, on a phone: inside the foot the tab bar covered it
  // and it was squeezed to the foot's width (founder).
  if(matchMedia('(max-width:639px)').matches){
    const mm = document.querySelector('.cmodel #mmenu'), mb = document.querySelector('.cmodel .mback:not(.uback)');
    if(mm){ if(mb){ mb.classList.add('portal'); document.body.append(mb); } mm.classList.add('portal'); document.body.append(mm); } }
  { const up = document.querySelector('.cmodel .upanel'), bk = document.querySelector('.cmodel .uback');
    if(up){ if(bk){ bk.classList.add('portal'); document.body.append(bk); } up.classList.add('portal'); document.body.append(up); } }
  const list = document.getElementById('msgs');
  const foot = document.querySelector('.cfoot');
  if(list && foot){
    // The float can grow after the list has scrolled (the model pill
    // arriving with the health check, the chip appearing). A reader at the
    // bottom stays at the bottom, so the last line clears the chip.
    const pad = () => {
      const want = (foot.offsetHeight + 12) + 'px';
      if(list.style.paddingBottom === want) return;
      const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 24;
      list.style.paddingBottom = want;
      if(atEnd) list.scrollTop = list.scrollHeight;
    };
    pad();
    if(window.ResizeObserver){ if(FOOT_RO) FOOT_RO.disconnect(); FOOT_RO = new ResizeObserver(pad); FOOT_RO.observe(foot); }
    const down = document.getElementById('tobottom');
    if(down){
      const away = () => { down.hidden = list.scrollHeight - list.scrollTop - list.clientHeight < 160; };
      list.addEventListener('scroll', away, { passive: true });
      down.addEventListener('click', () => list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' }));
      requestAnimationFrame(away);
    }
  }
  if(list){
    const c = convo(); const n = c ? c.msgs.length : 0;
    const fresh = !was || SCROLL_SEEN.id !== chat.open;
    const added = !fresh && n > SCROLL_SEEN.n ? c.msgs.slice(SCROLL_SEEN.n) : [];
    const place = () => {
      if(fresh || added.some(m => m.mine)) { list.scrollTop = list.scrollHeight; return; }
      const reply = added.find(m => m.id && !m.mine);
      const el = reply && list.querySelector(`[data-k="${CSS.escape(msgKey(reply))}"]`);
      if(el){
        const top = el.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop - 8;
        list.scrollTop = Math.min(top, list.scrollHeight - list.clientHeight);
        return;
      }
      if(was.atBottom) list.scrollTop = list.scrollHeight; else list.scrollTop = was.top;
    };
    place();
    // Images and wrapped text can change the height after this tick.
    requestAnimationFrame(place);
    SCROLL_SEEN = { id: chat.open, n };
  }
  const pq = document.getElementById('pq');
  if(pq){
    pq.value = chat.query;
    pq.focus();
    pq.setSelectionRange(chat.query.length, chat.query.length);
  }
  const nb = document.getElementById('say');
  if(nb){
    nb.value = chat.draft || '';
    grow(nb);
    if(hadFocus){ nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); }
  }
  // An open conversation has its own back in its header (phone), or sits
  // beside the list (desktop), so the bar adds none. On a desktop the bar
  // then holds nothing, and an empty bar is just a gap: it collapses.
  const wide = matchMedia('(min-width:900px)').matches;
  const noBack = stack.length <= 1 && !chat.picking;
  document.getElementById('back').hidden = noBack;
  document.getElementById('back').setAttribute('aria-label', t('Back','返回'));
  // "Request full access" on Home, while there is a gate to send it to and
  // no working code on this device.
  const accBtn = document.getElementById('bar-acc');
  const showAcc = e.tab === 'home' && stack.length <= 1 && !!accessUrl() && !AGENT_KEY;
  accBtn.hidden = !showAcc;
  accBtn.textContent = t('Request full access', '申请完整权限');
  // Settings: a gear at the bar's right on Me, signed in or not (founder).
  const setBtn = document.getElementById('bar-set');
  const showSet = e.tab === 'me' && stack.length <= 1;
  setBtn.hidden = !showSet; setBtn.setAttribute('aria-label', t('Settings','设置'));
  document.body.classList.toggle('bar-empty', noBack && wide && !showAcc && !showSet);
  revealFresh();
  navBar();
}

/* --- Events. One delegated listener; the whole page is re-rendered from
       state, so nothing has to be wired up per element. -------------------- */
document.addEventListener('click', ev => {
  const hit = sel => ev.target.closest(sel);
  let el;
  // A source title is an <a> so it wraps inline with its locator (a button
  // is always a block of its own); the app routes it, not the browser.
  if(hit('a.src-link, a.linkish[data-voice]')) ev.preventDefault();
  // Agon rows on a touch screen: swipe actions (see ROWSWIPE).
  if(Date.now() - SWIPE_FIRED < 350 || Date.now() - HOLD_FIRED < 600){
    if(hit('.crow')){ ev.preventDefault(); return; }
  }
  if((el = hit('[data-swipe-more]'))){
    const id = el.dataset.swipeMore; ROWSWIPE.open = null; CROW.menu = id; CROW.confirm = null; render();
    setTimeout(() => { const b = document.querySelector('.crow-menu button'); if(b) b.focus(); });
    return;
  }
  if((el = hit('[data-swipe-delete]'))){
    CONFIRM = { kind: 'convo', id: el.dataset.swipeDelete }; ROWSWIPE.open = null; render();
    setTimeout(() => { const b = document.querySelector('.af--confirm [data-confirm-cancel]'); if(b) b.focus(); }); return;
  }
  if(ROWSWIPE.open && !hit('.crow-acts')){
    ROWSWIPE.open = null;
    if(CROW.confirm){ CROW.confirm = null; render(); } else syncRowSwipe();
    if(hit('.crow')){ ev.preventDefault(); return; }
  }
  if((el = hit('[data-rp]'))){ RP_OPEN = !RP_OPEN; return render(); }
  if((el = hit('[data-ob-skip]'))) return finishOnboarding(null);
  if(hit('[data-photo-remove]')){ ME_PHOTO = ''; try{ localStorage.removeItem('still.photo'); }catch(e){} return render(); }
  if((el = hit('[data-ob-again]'))){ ME_SETTINGS = false; openOnboarding(true); return render(); }
  if((el = hit('[data-ob-topic]'))){
    const id = el.dataset.obTopic;
    OB.sel = OB.sel.includes(id) ? OB.sel.filter(x => x !== id) : OB.sel.concat(id);
    // Just this chip and the button: a full render would replay the sheet.
    el.setAttribute('aria-pressed', OB.sel.includes(id) ? 'true' : 'false');
    const go = document.querySelector('.ob-go'), n = OB.sel.length;
    if(go){ go.disabled = n < 3; go.textContent = n >= 3 ? t("Today's question",'今天的问题') : t(`Pick ${3 - n} more`, `再选 ${3 - n} 个`); }
    return;
  }
  if((el = hit('[data-ob-step]'))){
    const to = +el.dataset.obStep; if(to !== OB.step){ OB.step = to; OB.moved = true; render(); } return;
  }
  if((el = hit('[data-ob-next]'))){
    if(OB.step === 0){ OB.step = 1; OB.moved = true; render();
      setTimeout(() => { const h = document.getElementById('ob-title'); if(h){ h.setAttribute('tabindex','-1'); h.focus(); } }); return; }
    if(OB.sel.length >= 3) return finishOnboarding(OB.sel);
    return;
  }
  if((el = hit('[data-me-tab]'))){ ME_TAB = el.dataset.meTab; return render(); }
  if((el = hit('[data-me-settings]'))){ ME_SETTINGS = true; return render(); }
  if((el = hit('[data-me-close]'))){
    const n = document.getElementById('me-name');
    if(n){ ME_NAME = n.value.trim(); try{ localStorage.setItem('still.name', ME_NAME); }catch(e){} }
    ME_SETTINGS = false; return render();
  }
  if((el = hit('[data-me-topic]'))){
    const id = el.dataset.meTopic;
    PICKS = PICKS.includes(id) ? PICKS.filter(x => x !== id) : PICKS.concat(id);
    el.setAttribute('aria-pressed', PICKS.includes(id) ? 'true' : 'false');
    saveTopics(); return;
  }
  if((el = hit('[data-acc-open]'))){ MENU.open = false; MENU.sub = false; chat.usageOpen = false; ACCESS.sheet = el.dataset.accOpen === 'chat' ? 'chat' : 'home'; ACCESS.err = ''; ACCESS.step = 0; return render(); }
  if((el = hit('[data-acc-back]'))){ ACCESS.err = ''; ACCESS.step = Math.max(0, (ACCESS.step || 0) - 1); return render(); }
  if((el = hit('[data-acc-close]'))){ ACCESS.sheet = false; ACCESS.codeOpen = false; return render(); }
  if((el = hit('[data-af-close]'))){ ANSWER_FIRST = false; return render(); }
  if((el = hit('[data-lede]'))){ LEDE_OPEN = !LEDE_OPEN; return render(); }
  // From Today's use: close it, then the same request flow or code sheet.
  if((el = hit('[data-up-acc]'))){
    chat.usageOpen = false; ACCESS.sheet = 'chat'; ACCESS.err = ''; ACCESS.step = 0; return render(); }
  if((el = hit('[data-up-key-edit]'))){
    chat.usageOpen = false; ACCESS.sheet = 'code'; AGENT_KEY_BAD = false; render();
    // Focus inside the tap itself: iOS raises the keyboard only for a focus
    // made during the user's gesture, never one from a timer.
    const k = document.getElementById('agent-key');
    if(k){ k.value = AGENT_KEY; const sv = k.form && k.form.querySelector('.key-save'); if(sv) sv.disabled = false;
      k.focus(); k.select(); }
    return;
  }
  if((el = hit('[data-acc-code]'))){
    // From the model picker or Today's use: close those first, or they
    // stayed on top of the code sheet and hid the field (founder).
    MENU.open = false; MENU.sub = false; chat.usageOpen = false;
    ACCESS.sheet = 'code'; AGENT_KEY_BAD = false; render();
    { const k = document.getElementById('agent-key'); if(k) k.focus(); }   // in the tap, for iOS
    return;
  }

  if((el = hit('[data-tab]')))    return tab(el.dataset.tab);
  if((el = hit('#back')))         return back();
  if((el = hit('[data-lang]')))   { lang = el.dataset.lang; save(); return render(); }

  if((el = hit('[data-vote]'))){
    const card = el.closest('[data-open]') || el.closest('.q');
    const q = here().thread ? byId(C.questions, here().thread)
                            : byId(C.questions, card && card.dataset.open);
    if(!q) return;
    // Tapping the answer you already chose takes it back (founder, B22):
    // the card returns to unanswered and nothing opens.
    if(state.votes[q.id] === el.dataset.vote){
      delete state.votes[q.id]; save();
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
      return render();
    }
    state.votes[q.id] = el.dataset.vote; save();
    // In the feed, answering is what unlocks the thread, so it opens straight
    // away rather than making the reader tap twice. Inside the thread it just
    // updates in place.
    if(here().thread) render();
    else { render(); setTimeout(() => go({tab:stack[0].tab, thread:q.id}), 320); }
    return;
  }

  if((el = hit('[data-like]'))){
    const k = el.dataset.like;
    if(state.likes[k]) delete state.likes[k]; else state.likes[k] = 1;
    save(); return render();
  }

  if((el = hit('[data-filter]'))){
    here().filter = el.dataset.filter; return render();
  }
  if((el = hit('[data-etype]'))){ exploreFilter = el.dataset.etype; return render(); }
  if((el = hit('[data-chat-with]'))) return startChat(el.dataset.chatWith);
  if((el = hit('[data-voice]'))) return go({tab:stack[0].tab, voice:el.dataset.voice});
  if((el = hit('[data-work]')))  return go({tab:stack[0].tab, work:el.dataset.work});

  /* The turn runs on the element that is already on screen: re-rendering
     with `.open` already set would draw the book open with nothing to
     transition from. A new passage goes under the shut cover first, the
     board swings, and only then is the page re-rendered to match. */
  if((el = hit('[data-interp]'))){ INTERP_OPEN = !INTERP_OPEN; return render(); }
  if((el = hit('[data-chat-from-book]'))){
    const r = drawn, P = passageOf(r), v = P && P.voice, p = P && P.phil;
    if(!r) return;
    // The passage opens the chat as context, shown as a quote card; the
    // first question about it is sent for the reader (below).
    // A text, a school or a voice with no persona: the passage still opens
    // the chat, and the reader picks who to talk to about it.
    const c = { id: 'c' + Date.now(), cast: p ? [p.id] : [], said: {}, at: Date.now(),
      msgs: [{ context: true, at: Date.now(), quote: P.quote, source: P.source, voiceId: v ? v.id : null,
        // B11: what the agent needs to answer about this passage, sent with
        // every question in this chat (/v1/ask "context").
        ask: askContext(r, P) }] };
    chat.convos.push(c); chat.open = c.id; chat.pending = []; chat.picking = !p;
    chat.query = ''; chat.filter = 'all';
    save(); tab('chat');
    // Founder: with someone to ask, the first message is sent for the
    // reader — "What do you mean by …?" — so the thinker answers at once.
    if(p){ const q = L(P.quote) || P.quote.en || '';
      sendText(t(`What do you mean by “${q}”?`, `你说“${q}”是什么意思？`)); }
    return;
  }
  if((el = hit('#book'))){ toggleBook(); return; }

  if((el = hit('[data-new]'))){
    chat.open = null; chat.pending = []; chat.picking = true;
    chat.query = ''; chat.filter = 'all';
    chat.newMode = 'one'; chat.askQ = ''; chat.suggest = null; chat.carried = null;
    return render();
  }
  if((el = hit('[data-phil]'))){
    return go({tab: stack[0].tab, phil: el.dataset.phil});
  }
  if((el = hit('[data-book]'))) return go({tab: stack[0].tab, book: el.dataset.book});
  if((el = hit('[data-drop-convo]'))){
    const id = el.dataset.dropConvo;
    chat.convos = chat.convos.filter(c => c.id !== id);
    if(chat.open === id) chat.open = null;
    CROW.menu = CROW.confirm = null; ROWSWIPE.open = null;
    save(); return render();
  }
  if((el = hit('[data-crow-menu]'))){
    const id = el.dataset.crowMenu;
    CROW.menu = CROW.menu === id ? null : id; CROW.confirm = null; render();
    setTimeout(() => { const b = document.querySelector('.crow-menu button'); if(b) b.focus(); });

  }
  if((el = hit('[data-crow-pin]'))){

  }
  if((el = hit('[data-crow-rename]'))){

  }
  if((el = hit('[data-crow-delete]'))){

    setTimeout(() => { const b = document.querySelector('.af--confirm [data-confirm-cancel]'); if(b) b.focus(); }); return;
  }
  if(CROW.menu && !hit('.crow-menu')){ CROW.menu = CROW.confirm = null; render(); }
  if((el = hit('[data-open-convo]'))){
    const narrow = innerWidth < 900;   // side by side on a laptop: nothing slides
    chat.open = el.dataset.openConvo; chat.draft = '';
    if(narrow){ NAV = 'push'; CONVO_PUSHED = true; try{ history.pushState({ still: 'convo' }, ''); }catch(e){} }

  if((el = hit('[data-close-convo]'))){ closeConvo(); return; }

    render(); const b = document.querySelector('.fb-sheet [data-fb-rate].on'); if(b) b.focus(); return; }
  if((el = hit('[data-fb-cancel]'))){ if(FEEDBACK && !FEEDBACK.sending){ FEEDBACK = null; render(); } return; }
  if((el = hit('[data-fb-send]'))){ sendFeedback(); return; }

  if((el = hit('[data-usage-close]'))){ closeUsage(); return; }
  if((el = hit('[data-books-view]'))){
    BOOKS_VIEW = el.dataset.booksView;
    try{ localStorage.setItem('still.booksView', BOOKS_VIEW); }catch(e){}
    return render();
  }
  if((el = hit('[data-forget-key]'))){ setAgentKey(''); return render(); }
  if((el = hit('[data-emode]'))){ EXPLORE_MODE = el.dataset.emode; MAP_SEL = null; render(); window.scrollTo(0,0); return; }
  if((el = hit('[data-efd]'))){ EF_OPEN = EF_OPEN === el.dataset.efd ? null : el.dataset.efd; return render(); }
  if((el = hit('[data-efd-close]'))){ EF_OPEN = null; return render(); }
  if((el = hit('[data-ef]'))){ const [k, v] = el.dataset.ef.split(':'); EF[k] = v; EF_OPEN = null; return render(); }
  if((el = hit('[data-eview]'))){ EXPLORE_VIEW = el.dataset.eview;

  if((el = hit('[data-tierinfo]'))){

  if((el = hit('[data-usage]'))){ if(chat.usageOpen) closeUsage(); else { chat.usageOpen = true; render(); refreshMe(); } return; }

  if((el = hit('[data-talk]'))){

  if((el = hit('[data-rate]'))){ reported = null; openRate(el.dataset.rate); return; }

function grow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(140, el.scrollHeight) + 'px';
  // A scrollbar only once the text outgrows the box.
  el.style.overflowY = el.scrollHeight > 140 ? 'auto' : 'hidden';
}

function send(){
  const c = convo(); if(!c) return;
  MIC.error = '';
  const box = document.getElementById('say');

  if(!text || chat.busy) return;

  sendText(text);
}
/* B46: a new chat from the sheet, with the question (if any) as its first
   line, sent for the reader once the room is open. */
function startNewChat(cast, question){
  const c = { id: 'c' + Date.now(), cast: cast.slice(), msgs: [], said: {}, at: Date.now() };
  chat.convos.push(c); chat.open = c.id; chat.pending = [];
  chat.picking = false; chat.suggest = null; chat.carried = null; chat.askQ = '';
  // On a phone the new conversation slides in like any opened one.
  if(innerWidth < 900){ NAV = 'push'; CONVO_PUSHED = true; try{ history.pushState({ still: 'convo' }, ''); }catch(e){} }
  save(); render();

/* Ask: POST /v1/suggest {question, lang, limit: 3}. Read loosely while the
   endpoint settles (the app's GateClient.suggest reads the same): a list
   under thinkers / suggestions / results (or the body), each item's
   thinker / id / agentId as an agent or roster id, why / reason as a string
   or {en, zh}. Busy, failed or nobody on the roster: pick instead, and the
   question still opens the chat. */
async function findThinkers(){
  const q = chat.askQ.trim(); if(!q || chat.suggest === 'finding') return;
  chat.suggest = 'finding'; render();
  let found = [];
  try{
    if(!AGENT_URL) throw new Error('no agent');
    const out = await agentFetch('/v1/suggest', { question: q, lang: questionLang(q), limit: 3 }, 30000);
    const items = Array.isArray(out) ? out : (out && (out.thinkers || out.suggestions || out.results)) || [];
    const roster = {}; Object.entries(AGENT_IDS).forEach(([r, a]) => { roster[a] = r; });
    const seen = new Set();
    found = items.map(x => {
      const raw = x && (x.thinker || x.id || x.agentId); if(typeof raw !== 'string') return null;
      const id = roster[raw] || (philById(raw) ? raw : null);
      if(!id || seen.has(id)) return null; seen.add(id);
      const w = x.why || x.reason;
      const why = typeof w === 'string' ? { en: w, zh: w } : (w && typeof w === 'object') ? { en: w.en || w.zh || '', zh: w.zh || w.en || '' } : null;
      return { id, why };
    }).filter(Boolean).slice(0, 3);
  }catch(e){ found = []; }
  if(!chat.picking) return;               // closed while waiting
  if(found.length){ chat.suggest = found; }
  else { chat.suggest = null; chat.carried = q; chat.pending = []; chat.newMode = 'several'; }
  render();
}

function sendText(text){
  const c = convo(); if(!c || !text || chat.busy) return;
  if(accessBlocked()) return render();
  if(!SENT_ONCE){ SENT_ONCE = true; try{ localStorage.setItem('still.sentOnce', '1'); }catch(e){} }
  c.msgs.push({ mine:true, text, at: Date.now() });
  c.at = Date.now();
  save(); render();
  speak('The reader just said: ' + text + '\nAnswer them.');
}

/* The two vertical lines on a desktop, the sidebar's and the conversation
   list's, can be dragged (or moved with the arrow keys). Remembered on
   this device; double-click puts one back. */
const PANES = { nav: [248, 180, 360], list: [320, 240, 520] };
function setPane(which, px){
  const [def, lo, hi] = PANES[which];
  const v = Math.round(Math.min(hi, Math.max(lo, px == null ? def : px)));
  document.documentElement.style.setProperty(`--${which}-w`, v + 'px');
  try{ localStorage.setItem(`still.${which}W`, v); }catch(e){}
  return v;
}
for(const k of Object.keys(PANES)){
  try{ const v = +localStorage.getItem(`still.${k}W`); if(v) setPane(k, v); }catch(e){}
}
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest && ev.target.closest('[data-resize]'); if(!h) return;
  ev.preventDefault();
  const which = h.dataset.resize;
  const left = (which === 'nav' ? document.querySelector('.nav') : document.querySelector('.convo-list'))
    .getBoundingClientRect().left;
  document.body.classList.add('resizing');
  const move = e => setPane(which, e.clientX - left);
  const up = () => { document.body.classList.remove('resizing');
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
  addEventListener('pointercancel', up, { once: true });
});
document.addEventListener('dblclick', ev => {
  const h = ev.target.closest && ev.target.closest('[data-resize]'); if(h) setPane(h.dataset.resize, null);
});
document.addEventListener('keydown', ev => {
  const h = ev.target.closest && ev.target.closest('[data-resize]'); if(!h) return;
  if(ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
  ev.preventDefault();
  const which = h.dataset.resize;
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue(`--${which}-w`)) || PANES[which][0];
  setPane(which, cur + (ev.key === 'ArrowRight' ? 16 : -16));
});

/* Phone keyboard: while a text field in the chat has focus, the tab bar
   steps aside (see body.kb). */
document.addEventListener('focusin', ev => {
  // The message box only. The access-code field lives in a sheet: resizing
  // the chat and scrolling back to the top while iOS raised the keyboard for
  // it left the field under the keyboard with no keys (founder: 'access code
  // cannot input'). Sheets are lifted above the keyboard instead (below).
  if(ev.target.matches && ev.target.matches('#say')) document.body.classList.add('kb');
});
document.addEventListener('focusout', ev => {
  if(ev.target.matches && ev.target.matches('#say'))
    setTimeout(() => { if(!document.activeElement || !document.activeElement.matches('#say'))
      document.body.classList.remove('kb'); }, 50);
});
/* Keep the conversation's top (header, first lines) on screen while the
   iPhone keyboard is up: size the chat to the visible area and undo the
   page scroll Safari adds when the field takes focus. */
if(window.visualViewport){
  const vv = window.visualViewport;
  const fit = () => {
    if(!document.body.classList.contains('kb')){ document.documentElement.style.removeProperty('--vvh'); return; }
    document.documentElement.style.setProperty('--vvh', Math.round(vv.height) + 'px');
    if(window.scrollY || vv.offsetTop) window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  document.addEventListener('focusin', () => setTimeout(fit, 60));
  document.addEventListener('focusout', () => setTimeout(fit, 120));
  // Typing in a sheet on a phone: the sheet leaves the bottom edge (where
  // the keyboard goes) and sits at the top of what is visible, sized to it.
  // Anchored to the visual viewport's own top, so it is right whether iOS
  // shrinks the viewport or pans it (lifting by the keyboard's height went
  // wrong when it panned: founder, 'access code panel still not fixed').
  const lift = () => {
    const f = document.activeElement;
    const on = f && f.matches && f.matches('input,textarea') && f.closest('.modal')
      && matchMedia('(max-width:639px)').matches;
    const de = document.documentElement;
    de.classList.toggle('modal-typing', !!on);
    if(!on){ de.style.removeProperty('--vv-top'); de.style.removeProperty('--vv-h'); return; }
    de.style.setProperty('--vv-top', Math.round(vv.offsetTop) + 'px');
    de.style.setProperty('--vv-h', Math.round(vv.height) + 'px');
  };
  vv.addEventListener('resize', lift); vv.addEventListener('scroll', lift);
  // Never in the same moment as the focus: a tap focuses on press, and moving
  // the sheet before its click lands put the click on the backdrop, closing it.
  document.addEventListener('focusin', () => { setTimeout(lift, 120); setTimeout(lift, 400); });
  document.addEventListener('focusout', () => setTimeout(lift, 120));
}

/* Bottom sheets close with a swipe down from their top edge, as well as
   their close button or the backdrop. */
let SWIPE = null;
document.addEventListener('touchstart', ev => {
  const sheet = ev.target.closest && ev.target.closest('.modal,.mmenu');
  if(!sheet || innerWidth >= 640 || sheet.scrollTop > 0) return;
  const top = sheet.getBoundingClientRect().top;
  if(ev.touches[0].clientY - top > 64) return;   // only from the grab area
  SWIPE = { sheet, y: ev.touches[0].clientY, dy: 0 };
}, { passive: true });
document.addEventListener('touchmove', ev => {
  if(!SWIPE) return;
  SWIPE.dy = Math.max(0, ev.touches[0].clientY - SWIPE.y);
  SWIPE.sheet.style.transform = `translateY(${SWIPE.dy}px)`;
}, { passive: true });
document.addEventListener('touchend', () => {
  if(!SWIPE) return;
  const { sheet, dy } = SWIPE; SWIPE = null;
  if(dy < 80){ sheet.style.transform = ''; return; }
  if(MENU.open) closeMenu(true);
  else if(chat.usageOpen) closeUsage();
  else if(DERIVE) closeDerive();
  else if(chat.howOpen){ chat.howOpen = false; render(); }
  else if(chat.picking){ chat.picking = false; chat.pending = []; render(); }
  else if(TIER_POP){ TIER_POP = false; render(); }
  else sheet.style.transform = '';
});

/* --- Preview ---------------------------------------------------------------
   The editor (Editor/) embeds this page as ./?preview and posts it
   { type:'still-preview', content, open, view, lang }: a content.json built
   by the editor with the same rules as Content/build.py, holding the
   published questions plus the one under review, whatever its status. The
   page opens on that question's thread (view 'thread') or the feed (view
   'feed'); a later message with the same question and view redraws in place,
   so an edit shows where the reader is. { type:'still-preview-focus',
   response } scrolls to one reply. Messages are taken only from the parent
   frame, and only from this origin, qingyimakes.github.io or localhost.
   Without ?preview, or outside a frame, none of this runs. */
let PV = null;
const PREVIEW_FROM = /^(https:\/\/qingyimakes\.github\.io|https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?)$/;
function previewContent(){
  return new Promise(resolve => {
    let first = true;
    addEventListener('message', ev => {
      if(ev.source !== window.parent) return;
      if(ev.origin !== location.origin && !PREVIEW_FROM.test(ev.origin)) return;
      const m = ev.data || {};
      if(m.type === 'still-preview-focus') return previewFocus(m.response);
      if(m.type !== 'still-preview' || !m.content) return;
      if(m.lang === 'en' || m.lang === 'zh') lang = m.lang;
      if(first){ first = false; PV = m; resolve(m.content); return; }
      const moved = m.open !== PV.open || m.view !== PV.view;
      PV = m; C = m.content;
      if(moved) previewStart();
      else { if(here().thread && !byId(C.questions, here().thread)) stack = [{tab:'home'}]; render(); }
    });
    window.parent.postMessage({ type:'still-preview-ready' }, '*');
  });
}
function previewStart(){
  reported = null; LEDE_OPEN = false;
  stack = PV.view === 'feed' || !byId(C.questions, PV.open)
    ? [{tab:'home'}] : [{tab:'home'}, {tab:'home', thread:PV.open}];
  render(); window.scrollTo(0,0);
}
function previewFocus(id){
  const b = id && document.querySelector(`[data-like="response:${CSS.escape(id)}"]`);
  const row = b && b.closest('article');
  // Clear of the bar that floats over the top of the page.
  if(row) window.scrollTo({ top: row.getBoundingClientRect().top + scrollY - 72,
                            behavior: navReduced() ? 'auto' : 'smooth' });
}

/* --- Boot ---------------------------------------------------------------- */
if(!PREVIEW) load();
Promise.all([
  PREVIEW ? previewContent() : fetch('assets/content.json').then(r => r.json()),
  fetch('assets/philosophers.json').then(r => r.json()).catch(() => ({philosophers:[]})),
  fetch('assets/library.json').then(r => r.json()).catch(() => ({thinkers:{}})),
  fetch('assets/map.json').then(r => r.json()).catch(() => null),
  fetch('assets/answers.json').then(r => r.json()).catch(() => null)
]).then(([data, roster, library, map, answers]) => {
  MAP = map;
  ANSWERS = (answers && answers.entries || []).map(e => ({ ...e, pool: true }));
  addLibraryThinkers(roster.philosophers || []);
  C = data; PHIL = roster.philosophers || []; LIB = library.thinkers || {};
  FEATURED_ZH = library.featuredZh || {};
  FEATURED_ORIG = library.featuredOrig || {};
  FEATURED_WIKI = library.featuredWiki || {};
  applyTiers();
  seedExamples();
  if(PREVIEW) return previewStart();
  // A first visit lands straight on Home: the welcome waits for a sign-up
  // (openOnboarding, founder, B44).
  render(); model();
  refreshEditor();
  // ./?chat=<philosopher id> opens a chat with them (map.html links here).
  // The parameter is dropped so a reload does not start a second chat.
  const want = new URLSearchParams(location.search).get('chat');
  if(want){
    const rest = location.search.slice(1).split('&').filter(x => x && !/^chat=/.test(x)).join('&');
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
    startChat(want);
  }
})
  .catch(() => {
    document.getElementById('view').innerHTML =
      `<p class="empty">Could not load the content file.</p>`;
  });

<!-- Agentation: a click-to-comment toolbar for giving UI feedback on this page
     (agentation.dev). It loads only when the page is opened on this computer
     (localhost), never on the published site; add ?feedback=0 to hide it.
     Annotations stay in this browser until you copy them out. -->
<script type="module">
const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const q = new URLSearchParams(location.search);
if (local && q.get('feedback') !== '0' && !q.has('preview')) {
  const [{ createElement }, { createRoot }, { Agentation }] = await Promise.all([
    import('https://esm.sh/react@18.3.1'),
    import('https://esm.sh/react-dom@18.3.1/client'),
    import('https://esm.sh/agentation@3.1.2?deps=react@18.3.1,react-dom@18.3.1'),
  ]);
  const host = document.createElement('div');
  host.id = 'agentation';
  document.body.appendChild(host);
  createRoot(host).render(createElement(Agentation));
}
</script>
