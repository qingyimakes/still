/* --- Chat ---------------------------------------------------------------
   A conventional messenger: conversation header, bubbles with tails, a pill
   composer. The one thing it keeps from the rest of the app is the honesty:
   a SIMULATED chip by the name, the derivation behind a disclosure, and the
   real sourced passage as an attachment under the bubble. A chat that hid
   those would be a different product.
------------------------------------------------------------------------- */
.page--chat{padding:0}
.chat-wrap{height:calc(100dvh - 52px - 66px - var(--nav-lift))}

/* Phone: the list IS the tab, and opening a conversation replaces it.
   Desktop: both at once, which is what every desktop messenger does. */
.chat-wrap{display:block}
.chat-wrap .convo-list{display:flex;flex-direction:column;height:100%;
                       min-height:0;overflow-y:auto;overscroll-behavior:contain}
.chat-wrap .convo-pane{display:none}
.chat-wrap.has-open .convo-list{display:none}
/* The chip and the message box float over the conversation with nothing
   behind them (founder): messages scroll underneath, and the list's bottom
   padding (set from the float's height) lets the last line clear it. */
.convo-pane{position:relative}
.cfoot{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
/* Phone and tablet: the tab bar sits under the message box, so the box
   keeps 4px above it (founder), not the safe-area inset the screen edge
   would need. */
@media (max-width:899px){
  .cfoot .composer{padding-bottom:var(--sp-xs)}
}
.cfoot > *{pointer-events:auto}
/* Scroll to the latest: centred, floating just above the chat's foot, shown
   only once the reader has scrolled up (founder, B18). */
.tobottom{position:absolute;left:50%;top:calc(-40px - var(--sp-s));transform:translateX(-50%);
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--hairline-strong);color:var(--ink);cursor:pointer;
  background:var(--bg);box-shadow:0 2px 10px rgba(36,50,53,.10)}
.tobottom[hidden]{display:none}
.chat-acts{align-items:center}
.chat-acts .tobottom{position:static;transform:none;width:36px;height:36px}
.cfoot .composer{background:transparent}
/* B25: the chip and the ↓ share one centred line, styled like Claude's
   floating pill: page-coloured, a hairline edge and a soft shadow. */
.cfoot .chat-acts{justify-content:center}
.cfoot .chat-acts .ghost{background:var(--bg);border:1px solid var(--hairline-strong);
  box-shadow:0 2px 10px rgba(36,50,53,.10)}
.chat-wrap.has-open .convo-pane{display:flex;flex-direction:column;height:100%;
                                min-height:0}

.list-head{display:flex;align-items:center;gap:12px;padding:4px 16px 12px}
.list-head h1{flex:1;font-family:var(--serif);font-size:34px;margin:0;font-weight:400}
.add{flex:none;width:36px;height:36px;border-radius:50%;background:var(--surface);
     border:1px solid var(--hairline-strong);color:var(--ink);font-size:20px;
     padding:0;display:grid;place-items:center}
.list-empty{font-size:14.5px;line-height:1.5;color:var(--ink-tertiary);padding:8px 16px}

.crow{position:relative;width:100%;border-bottom:1px solid var(--hairline)}
/* The row's face. It slides left over the swipe actions on a touch screen. */
.crow-slide{position:relative;z-index:1;display:flex;align-items:center;background:var(--bg);
            transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.crow.swiped .crow-slide{transform:translateX(-168px)}
.crow-acts{position:absolute;z-index:0;top:0;right:0;bottom:0;width:168px;display:none}
.crow-acts button{flex:1;display:grid;place-items:center;padding:0 var(--sp-s);
                  font-size:14px;font-weight:600;color:#fff;text-align:center;line-height:1.2}
.crow-acts .ca-more{background:var(--ink-secondary)}
.crow-acts .ca-del{background:var(--danger)}
@media (pointer:coarse){ .crow-acts{display:flex} }
.crow:not(.swiped):not(.dragging) .crow-acts{visibility:hidden}
@media (prefers-reduced-motion:reduce){ .crow-slide{transition:none} }
.crow-open{flex:1;min-width:0;display:flex;gap:12px;align-items:center;
           padding:12px 16px;text-align:left}
/* The trailing column is one column: the time, and on hover the "…" in the
   same place, centred on the title's line — never one high and one low. */
.crow-more{position:absolute;right:10px;top:var(--crow-line,21px);transform:translateY(-50%);width:28px;height:28px;
           border-radius:50%;display:grid;place-items:center;background:var(--bg);
           color:var(--ink-secondary);opacity:0;transition:opacity .15s}
.crow-more svg{width:16px;height:16px;fill:currentColor}
.crow:hover .crow-more,.crow:focus-within .crow-more,.crow.menu-open .crow-more{opacity:1}
.crow-more:hover,.crow.menu-open .crow-more{background:var(--chip);color:var(--ink)}
.crow:hover .crow-top span,.crow:focus-within .crow-top span,.crow.menu-open .crow-top span{visibility:hidden}
/* Touch: no "…" drawn — swipe or long-press instead. It stays in the page,
   visually hidden, for VoiceOver and keyboards. */
@media (pointer:coarse){
  .crow-more{opacity:1;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);right:16px}
  .crow:focus-within .crow-top span,.crow:hover .crow-top span{visibility:visible}
  .crow.menu-open .crow-top span{visibility:hidden}
}
.crow-menu{position:absolute;z-index:30;right:10px;top:calc(50% + 18px);min-width:160px;
           padding:var(--sp-xs);background:var(--surface);border:1px solid var(--hairline);
           border-radius:var(--r-inner);box-shadow:0 12px 40px rgba(36,50,53,.16)}
.crow-menu button{display:block;width:100%;padding:8px 12px;border-radius:10px;font-size:14px;
                  text-align:left;color:var(--ink)}
.crow-menu button:hover,.crow-menu button:focus-visible{background:var(--chip);outline:0}
.crow-menu .danger{color:var(--danger)}
.crow-rename{flex:1;padding:12px 16px}
.crow-rename input{width:100%;font:inherit;font-size:15px;padding:8px 12px;color:var(--ink);
                   border:1px solid var(--ink);border-radius:10px;background:var(--surface)}
.crow-top .pin svg{width:12px;height:12px;margin-right:4px;vertical-align:-1px;
                   color:var(--ink-secondary)}
/* The draggable lines (desktop only). */
.vresize{display:none}
@media (min-width:900px){
  .vresize{display:block;position:absolute;top:0;right:-6px;width:12px;height:100%;
           cursor:col-resize;z-index:31}
  .vresize:hover,.vresize:focus-visible,body.resizing .vresize{background:linear-gradient(90deg,
           transparent 5px,var(--ink-tertiary) 5px,var(--ink-tertiary) 7px,transparent 7px);outline:0}
  .convo-list{position:relative;overflow-x:hidden}
  .convo-list > .vresize{right:0;width:10px}
}
body.resizing{cursor:col-resize;user-select:none}
.crow.on .crow-slide{background:linear-gradient(var(--chip-soft),var(--chip-soft)),var(--bg)}
.crow .faces{flex:none;display:flex;align-items:center}
.crow .av{width:44px;height:44px;font-size:17px;flex:none}
/* Overlap only once there is more than one face, so a single portrait is not
   needlessly shrunk. */
.crow .faces.many .av{width:34px;height:34px;font-size:13px;
                      border:2px solid var(--bg);margin-left:-13px}
.crow .faces.many .av:first-child{margin-left:0}
.crow .faces .more{font-size:11.5px;font-weight:600;color:var(--ink-secondary);
                   margin-left:4px}
.crow-body{flex:1;min-width:0}
.crow-top{display:flex;align-items:baseline;gap:8px}
.crow-top b{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}
.crow-top span{flex:none;font-size:12.5px;color:var(--ink-secondary)}
.extag{display:inline-block;font-size:10.5px;font-weight:600;
       padding:2px 5px;margin-right:6px;border-radius:var(--r-pill);
       background:var(--chip);color:var(--ink-secondary);vertical-align:1px}
.crow-body p{margin:2px 0 0;font-size:13px;color:var(--ink-secondary);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty-pane{align-items:center;justify-content:center;gap:12px;padding:32px;
            text-align:center}
.empty-pane h3{font-family:var(--serif);font-size:24px;margin:0;font-weight:400}
.empty-pane p{font-size:14.5px;line-height:1.5;color:var(--ink-tertiary);margin:0;
              max-width:34ch}
.cback{flex:none;width:36px;height:36px;display:grid;place-items:center;
       border-radius:50%;color:var(--ink);background:rgba(255,255,255,.92);
       box-shadow:0 1px 6px rgba(36,50,53,.10)}
.cback svg{width:20px;height:20px}

/* Conversation header */
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;
       border-bottom:1px solid var(--hairline)}
.faces{display:flex;flex:none}
.faces .av{width:34px;height:34px;font-size:14px;border:2px solid var(--bg);
           margin-left:-10px}
.faces .av:first-child{margin-left:0}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis}
.chead .who span{font-size:12.5px;color:var(--ink-secondary)}
.chead .add{flex:none;width:34px;height:34px;border-radius:50%;background:var(--chip);
            color:var(--ink);display:grid;place-items:center;padding:0}
.add svg{width:15px;height:15px}
.chead .add svg.add-person{width:18px;height:18px}   /* drawn at 24 */

/* Transcript */
/* The transcript is one centred column, the composer's width, so a 65ch
   bubble does not hug the left edge of a wide screen. */
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
      display:flex;flex-direction:column;gap:2px;
      padding:12px max(12px, calc((100% - var(--column)) / 2)) 16px}
.daysep{align-self:center;font-size:11.5px;color:var(--ink-tertiary);
        background:var(--chip);border-radius:var(--r-pill);padding:4px 12px;
        margin:4px 0 10px}

.msg{display:flex;gap:8px;align-items:flex-start;max-width:84%;margin-top:var(--sp-xl)}
.msg.cont{margin-top:var(--sp-s)}
.msg.mine{flex-direction:row-reverse;align-self:flex-end}
.msg:not(.mine){align-self:flex-start}
.msg .av{width:28px;height:28px;font-size:12px;flex:none}
.avlink{flex:none;display:block;border-radius:50%}
.avlink:hover .av{outline:2px solid var(--hairline-strong);outline-offset:1px}
.msg.cont .av{visibility:hidden}
/* One reading measure for the bubble, its chips, the derivation and the
   passage, so the column reads as one; shorter replies shrink to fit. */
.msg-body{min-width:0;display:flex;flex-direction:column;gap:var(--sp-xs);max-width:var(--measure)}
.msg.mine .msg-body{align-items:flex-end}
.msg.mine{align-items:flex-end}

/* The name line: the avatar centred on it, the reply indented under the
   name, not under the avatar. */
.msg-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-s);padding:0 0 var(--sp-xxs)}
.msg-head b{font-size:13px;font-weight:600;color:var(--ink-secondary)}
.msg:not(.mine) .msg-body > :not(.msg-head){margin-left:36px}
.msg.cont .msg-head{display:none}

.bubble{font-size:16px;line-height:1.5;padding:9px 13px;
        background:var(--surface);border:1px solid var(--hairline);
        border-radius:18px 18px 18px 5px;word-wrap:break-word}
.msg.cont .bubble{border-radius:18px 18px 18px 18px}
.msg.mine .bubble{background:var(--ink);color:var(--on-ink);border-color:var(--ink);
                  border-radius:18px 18px 5px 18px}
.msg.mine.cont .bubble{border-radius:18px}
.stamp{font-size:10.5px;color:var(--ink-tertiary);padding:0 5px}
/* A thinker's reply is text on the page, not a bubble; the reader's own
   message keeps its dark bubble, so who said what still reads at a glance. */
.msg:not(.mine) .bubble{background:none;border:0;border-radius:0;padding:0;
                         font-size:var(--body-size);line-height:var(--leading-read);
                         color:var(--ink)}
.bubble p{margin:0}
/* Long-press on what anyone wrote starts a range selection with handles and
   the system menu (Copy, Look Up, Translate, Share), as in Claude's app.
   Said outright so no rule inherited from a control can switch it off. The
   controls beside the text are the opposite: a long press on an icon should
   not select its label or pop the link callout. */
.msgs .bubble,.msgs .vblock,.msgs .said q,.msgs .said .src,.msgs .sysline{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.msgs button,.msgs summary,.msg-acts,.cfoot .chat-acts,.cfoot .inbox-row{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bubble p + p,.bubble p + blockquote,.bubble blockquote + p{margin-top:.75em}
.msg:not(.mine){max-width:100%}
.msg-body .bubble,.msg-body .derived,.msg-body .said,.msg-body .said-more{max-width:var(--measure)}
.sysline{align-self:center;max-width:var(--measure);margin:10px 0 2px;text-align:center;
         font-size:12.5px;line-height:1.45;color:var(--ink-tertiary)}
.sysline span{color:var(--ink-secondary)}
.sys-sugg{align-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-xs);margin:var(--sp-xs) 0 2px}
.msg-foot{display:flex;flex-wrap:wrap;margin:0;padding:var(--sp-xxs) 0 0;
          font-size:11.5px;line-height:1.4;color:var(--ink-secondary)}
.msg-foot span + span::before{content:"\00B7";padding:0 5px}

/* Attachments under a bubble */
.derived{font-size:13.5px;line-height:1.45;padding:0;max-width:100%}
.derived summary{font-size:12.5px;font-weight:500;color:var(--ink-secondary);
                 cursor:pointer;list-style:none}
.derived summary::-webkit-details-marker{display:none}
.derived summary::before{content:"\25B8  "}
.derived[open] summary::before{content:"\25BE  "}
.derived p{margin:8px 0 0;color:var(--text-body-soft)}
.derived .tag{display:block;font-size:12px;font-weight:600;
              color:var(--ink-secondary);margin-bottom:1px}
.derived .tag.warn{color:var(--danger)}
/* A passage the thinker wrote: set apart by a thin rule, in the serif,
   not by a tint. */
.said{background:none;border-left:2px solid var(--hairline-strong);border-radius:0;
      padding:2px 0 2px 14px;margin:var(--sp-xs) 0;
      display:flex;flex-direction:column;gap:4px;max-width:100%}
.said .tag{font-size:12px;font-weight:600;color:var(--ink-secondary)}
.said q{font-family:var(--serif);font-size:var(--body-size);line-height:var(--leading-read);
        color:var(--ink);quotes:"\201C" "\201D"}
.said .src{font-size:13.5px;font-weight:400;line-height:1.5;color:var(--ink-secondary);
           margin-top:2px;text-wrap:pretty}
.said .src .linkish{display:inline;text-align:left;font-weight:500;text-underline-offset:3px;
  text-decoration-color:var(--hairline-strong)}
/* The local thinker agent (?agent=1, localhost only). Its replies keep the
   SIMULATED tag; AGENT says where the words came from. Inside its bubble the
   only quotation marks left are the ones its verifier matched word-for-word
   to a passage, and those carry the passage's number. */
/* The model menu sits in the composer beside Send: one thumb-sized control,
   the full names inside it, and a small line under the composer for what is
   left today. */
.model-sel{font:inherit;color:var(--ink)}

/* "Claude limit reached": a small centred alert, not the bottom sheet. */
.alert{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);
       width:min(360px,calc(100vw - 32px));background:var(--bg);border-radius:20px;
       box-shadow:0 20px 60px rgba(36,50,53,.26);padding:20px 20px 16px}
.alert h2{margin:0 0 8px;font-size:17px;font-weight:600;color:var(--ink)}
.alert p{margin:0 0 6px;font-size:14.5px;line-height:1.45;color:var(--text-body-soft)}
.alert .wide{margin-top:14px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Only verifier-matched words get quotation formatting: curly marks
   inline, or a ruled block with its source when long. */
.bubble q.vq{font-family:var(--serif);quotes:"\201C" "\201D"}
.vblock{margin:0;border-left:2px solid var(--ink);padding:2px 0 2px 14px}
.vblock p{margin:0;font-family:var(--serif);font-size:var(--body-size);
          line-height:var(--leading-read);color:var(--ink)}
.vblock footer{margin-top:var(--sp-xs);font-family:var(--sans);font-size:12px;
               line-height:1.4;color:var(--ink-secondary)}
.bubble sup.vref,.said .num{font-size:9px;font-weight:700;color:var(--ink-secondary)}
.derived ol.checks{margin:8px 0 0;padding-left:18px;color:var(--text-body-soft)}
.derived ol.checks li{margin:var(--sp-s) 0 0}
.derived .s-text{display:block;color:var(--ink)}
.derived .s-lab{display:block;font-size:12px;color:var(--ink-secondary);margin-top:2px}
.src-link{font:inherit;color:inherit;text-align:left}
.said-more{max-width:100%}
/* B17: the passages a reply rests on fold to one line — label · count ·
   source, then a chevron — closed by default, like the app. */
.said-fold{max-width:var(--measure);margin-top:var(--sp-s)}
.said-fold summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;
  font-size:12.5px;font-weight:500;color:var(--ink-secondary);padding:4px 0}
.said-fold summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.said-fold summary::-webkit-details-marker{display:none}
.said-fold .chev{flex:none;transition:transform .15s ease}
.said-fold[open] .chev{transform:rotate(180deg)}
.said-fold .said{margin-top:6px}
.note-fold .detail{margin-top:6px}
.said-more summary{font-size:12.5px;font-weight:500;color:var(--ink-secondary);cursor:pointer;
                   list-style:none;padding:2px 0}
.said-more summary::-webkit-details-marker{display:none}
.said-more .said{margin-top:6px}

.w,.wb{opacity:0;animation:win .18s ease-out forwards}
.after{opacity:0;animation:win .25s ease-out forwards}
@keyframes win{to{opacity:1}}
/* The thinking line: a soft shimmer across the words. */
.loading{margin:0;font-size:14.5px;line-height:1.5}
.loading .stage{background:linear-gradient(90deg,var(--ink-tertiary) 0%,var(--ink-tertiary) 40%,
                 var(--hairline-strong) 50%,var(--ink-tertiary) 60%,var(--ink-tertiary) 100%);
                background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
                color:transparent;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){
  .loading .stage{animation:none;color:var(--ink-tertiary);background:none}
  .w,.after{animation:none;opacity:1}
}
.typing{display:flex;gap:4px;align-items:center;padding:11px 14px;
        background:var(--surface);border:1px solid var(--hairline);
        border-radius:18px 18px 18px 5px;width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-secondary);
          animation:blip 1.2s infinite ease-in-out;display:block}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}
                30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){ .typing i{animation:none;opacity:.5} }

/* Composer */
/* One rounded box: the text field, then the mic and Send. Below it, small and
   right-aligned, the model and today's use. Same width as the transcript. */
.composer{flex:none;display:flex;flex-direction:column;gap:4px;
          padding:8px 12px max(10px, env(safe-area-inset-bottom,0px));
          background:var(--bg);width:100%;max-width:var(--column);margin:0 auto}
/* One tall rounded box: the text on top, a row of controls inside it
   underneath — model on the left, mic and send on the right. */
.inbox{display:flex;flex-direction:column;gap:var(--sp-xxs);background:var(--surface);
       border:1px solid var(--hairline-strong);border-radius:24px;
       box-shadow:0 2px 12px rgba(36,50,53,.06);padding:var(--sp-s) var(--sp-s) var(--sp-s) var(--sp-l)}
.inbox-row{display:flex;align-items:center;gap:var(--sp-xs);margin-left:calc(-1 * var(--sp-s))}
.cmodel{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-xs)}
.cmodel .mchip{min-height:36px;padding:0 var(--sp-m);background:var(--chip);color:var(--ink);font-size:14px}
.cmodel .mmenu{right:auto;left:0}
.inbox:focus-within{border-color:var(--ink-secondary)}
.composer textarea{width:100%;min-height:36px;max-height:140px;resize:none;font:inherit;
                   font-size:16px;line-height:1.4;color:var(--ink);background:transparent;
                   border:0;padding:6px 0;outline:none;overflow-y:hidden}
.composer .send,.composer .mic{flex:none;width:36px;height:36px;border-radius:50%;
                display:grid;place-items:center}
.composer .send{background:var(--ink);color:var(--on-ink)}
.composer .send svg{width:18px;height:18px}
.composer .send[disabled]{opacity:.3}
.composer .send.stop i{display:block;width:12px;height:12px;border-radius:3px;background:var(--on-ink)}
.composer .mic{color:var(--ink-secondary);background:transparent}
.composer .mic svg{width:19px;height:19px}
.composer .mic.on{color:var(--danger);background:rgba(236,105,64,.12)}
.composer .mic[disabled]{opacity:.3}
@media (prefers-reduced-motion:no-preference){
  .composer .mic.on{animation:listen 1.4s ease-in-out infinite}
  @keyframes listen{50%{box-shadow:0 0 0 5px rgba(236,105,64,.12)}}
}
.cmeta{display:flex;justify-content:flex-start;align-items:center;gap:10px;
       font-size:12px;color:var(--ink-secondary);min-height:22px;padding:0 4px}
.mic-note{margin-right:auto;font-size:11.5px;color:var(--ink-tertiary)}
.mic-time{color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums}
.mic-err{color:var(--danger)}
.composer .mic.busy .spin{width:16px;height:16px;border-radius:50%;
  border:2px solid var(--hairline-strong);border-top-color:var(--ink-secondary);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cmeta{position:relative}
.keyform{flex:none;width:100%;max-width:var(--column);margin:0 auto;padding:var(--sp-s) 12px}
.keyform label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--sp-xs)}
.keyform div{display:flex;gap:var(--sp-s)}
.keyform input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 12px;color:var(--ink);
               background:var(--surface);border:1px solid var(--hairline-strong);border-radius:10px}
.keyform p{margin:var(--sp-xs) 0 0;font-size:12px;color:var(--ink-secondary)}
.keyform .key-bad{margin:0 0 var(--sp-xs);font-size:13px;color:var(--danger)}
.convo-list .keyform{padding:var(--sp-s) 20px var(--sp-m)}
/* Research preview: a quiet pill on generated surfaces only. */
.rp-pill{flex:none;font-size:12px;font-weight:500;padding:var(--sp-xxs) var(--sp-s);
  border-radius:var(--r-pill);background:var(--chip);color:var(--ink-secondary);white-space:nowrap}
.rp-pill[aria-expanded="true"]{color:var(--ink)}
.list-head:has(.rp-pill) h1{flex:none}
.list-head .rp-pill{margin-right:auto}
.rp-line{margin:var(--sp-s) 0 0;font-size:13px;line-height:1.5;color:var(--ink-secondary)}
.rp-bar{padding:0 var(--sp-l) var(--sp-s)}
.rp-bar .rp-line{margin:0}
/* The request-access card: in place of the reply box once the free
   message is used. Phone first; fields are full width. */
.acc-card{flex:none;width:100%;max-width:var(--column);margin:0 auto var(--sp-s);
  padding:var(--sp-l);background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-card);max-height:70dvh;overflow-y:auto}
.acc-card h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:var(--sp-m) 0 var(--sp-xs);color:var(--ink)}
.acc-lede{margin:0 0 var(--sp-l);font-size:14.5px;line-height:1.5;color:var(--text-body-soft)}
.acc-form{display:flex;flex-direction:column;gap:var(--sp-l)}
.acc-f{display:flex;flex-direction:column;gap:var(--sp-xs);margin:0;padding:0;border:0;min-width:0}
.acc-f > span,.acc-f legend{font-size:13px;font-weight:600;color:var(--ink);padding:0;margin-bottom:var(--sp-xs)}
.acc-f i{font-style:normal;font-weight:400;color:var(--ink-tertiary)}
.acc-f input[type=email],.acc-f input[type=text]{font:inherit;font-size:16px;padding:10px 12px;color:var(--ink);
  background:var(--bg);border:1px solid var(--hairline-strong);border-radius:var(--r-inner);min-height:44px}
.acc-opts{display:flex;flex-wrap:wrap;gap:var(--sp-s)}
.acc-opts .fpill{position:relative;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.acc-opts input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.acc-opts .fpill:has(input:checked){background:var(--ink);color:var(--accent)}
.acc-opts .fpill:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.acc-check{display:flex;gap:var(--sp-s);align-items:flex-start;font-size:14px;line-height:1.45;color:var(--text-body)}
.acc-check input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink)}
/* Drawn, not native: iOS draws a checkbox as a large hollow circle, which
   read as broken beside the form's square fields. */
.acc-check input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;
  border:1.5px solid var(--ink-tertiary);border-radius:6px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.acc-check input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--on-ink);border-width:0 2px 2px 0;
  transform:translateY(-1px) rotate(45deg);opacity:0}
.acc-check input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
.acc-check input[type=checkbox]:checked::after{opacity:1}
.acc-check input[type=checkbox]:focus-visible{outline:2px solid var(--ink-secondary);outline-offset:2px}
.acc-go{min-height:44px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);
  font-size:15px;font-weight:500;text-align:center}
.acc-go:disabled{opacity:.6}
.acc-note{margin:calc(-1 * var(--sp-s)) 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-secondary);text-align:center}
.acc-done{font-family:var(--serif);font-size:20px;margin:var(--sp-m) 0;color:var(--ink)}
.acc-code{display:inline-block;margin-top:var(--sp-m);font-size:13px}
.acc-sub{margin-top:calc(-1 * var(--sp-s));padding-left:28px}
.acc-f input[type=url]{font:inherit;font-size:16px;padding:10px 12px;color:var(--ink);
  background:var(--bg);border:1px solid var(--hairline-strong);border-radius:var(--r-inner);min-height:44px}
.acc-card .keyform,.acc-sheet .keyform{padding:var(--sp-m) 0 0}
/* The code sheet, as the app draws it: Cancel | Access code | (balance),
   a full-width field, the note, then Save on the left. */
.code-head{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-left:var(--sp-l)!important;padding-right:var(--sp-l)!important}
.code-head b{flex:none;text-align:center;font-weight:600}
.code-head .ghost{justify-self:start}
.acc-sheet--code .keyform{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-s);padding-top:var(--sp-xs)}
.acc-sheet--code .keyform input{margin:0;width:100%;flex:none;font-size:16px;padding:12px 16px}
/* One ring on focus, not the page's outline around the field's own border. */
.keyform input:focus,.keyform input:focus-visible{outline:0;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.acc-sheet--code .keyform p{margin:0}
.key-save{min-height:40px;padding:0 var(--sp-xl);border-radius:var(--r-pill);background:var(--ink);
  color:var(--on-ink);font-size:15px;font-weight:500}
.key-save:disabled{opacity:.35}
/* The request stepper, as the app's: counter, one question, Continue
   (Skip on an unanswered optional step), Back. */
.acc-sheet--steps .acc-sheet-body{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-m)}
.acc-sheet--steps .acc-lede{margin:0}
.acc-sheet--steps .acc-form{align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-m)}
.acc-have{font-size:14.5px}
.acc-step{margin:0;font-size:13px;color:var(--ink-secondary)}
.acc-f small{display:block;margin-top:var(--sp-xs);font-size:13px;line-height:1.4;color:var(--ink-secondary)}
.acc-next{width:100%}
.acc-back{align-self:flex-start;min-height:32px;font-size:14.5px;color:var(--ink-secondary)}
.bar .bar-set{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.bar .bar-set[hidden]{display:none}
.bar .bar-acc{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12.5px;
  padding:var(--sp-xs) var(--sp-m);min-height:32px;color:var(--ink);background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 2px 10px rgba(36,50,53,.12),0 0 0 1px var(--hairline)}
.acc-sheet-body{padding:0 var(--sp-l) var(--sp-l);overflow-y:auto}
/* One centred column, the card's padding on every side, one gap between
   every block. */
.acc-in{align-self:center;width:100%;max-width:var(--measure);margin:var(--sp-l) 0 var(--sp-s);padding:var(--sp-l);
  display:flex;flex-direction:column;align-items:stretch;gap:var(--sp-m);text-align:center;
  border-radius:var(--r-inner)}
.acc-in-title{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.25;color:var(--ink)}
.acc-in-line{margin:0;font-size:15px;line-height:1.45;color:var(--ink-secondary)}
.acc-in-go{width:100%;min-height:44px}
.acc-in-code{align-self:center;min-height:44px;padding:0 var(--sp-m);font-size:14.5px;font-weight:500;color:var(--ink)}
.acc-in .keyform{text-align:left}
.acc-in-note{margin:0;padding-top:var(--sp-m);border-top:1px solid var(--hairline);
  font-size:12.5px;line-height:1.5;color:var(--ink-tertiary)}
.acc-mini{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-s) var(--sp-m);
  width:100%;max-width:var(--column);margin:0 auto;padding:var(--sp-s) 12px var(--sp-m)}
.acc-mini p{margin:0;flex:1 1 100%;font-size:14px;color:var(--ink-secondary)}
.acc-mini-go{width:auto;min-height:44px;padding:0 var(--sp-xl)}
.acc-mini .acc-code{font-size:14px}
.acc-sheet-body .acc-lede{margin-top:var(--sp-m)}
/* The picker's .modal input rule (margins, size) is not for this form. */
.acc-sheet .acc-f input{margin:0;width:100%;font-size:16px}
.acc-sheet .acc-check input{margin:0;min-height:0;width:22px;padding:0}
.acc-sheet .acc-opts input{margin:0;min-height:0}
.linkish{font-size:inherit;color:var(--ink-secondary);text-decoration:underline;text-underline-offset:2px}
/* Under each reply: how it was derived, then thumbs and share. */
.msg-acts{display:flex;align-items:center;gap:var(--sp-xxs);margin-top:var(--sp-xxs)}
.derive-link{font-size:12.5px;color:var(--ink-secondary);padding:4px 8px 4px 0;
             margin-right:auto;text-decoration:underline dotted;text-underline-offset:2px}
.derive-link:hover{color:var(--ink)}
.sim-tag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:30px;
         padding:0 var(--sp-xs) 0 var(--sp-s);font-size:12.5px;color:var(--ink-secondary)}
.sim-tag svg{width:14px;height:14px}
button.sim-tag:hover{color:var(--ink)}
.der-labels{display:flex;flex-wrap:wrap;margin:0 0 var(--sp-xl) !important;font-size:12.5px;color:var(--ink-secondary)}
.der-labels span + span::before{content:"\00B7";padding:0 5px}
.act{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
     color:var(--ink-tertiary)}
.act:hover{background:var(--chip);color:var(--ink)}
.act.on{color:var(--ink);background:var(--chip)}
.act svg{width:16px;height:16px}
.act.down svg{transform:rotate(180deg)}
.act-note{font-size:12px;color:var(--ink-secondary);margin-left:var(--sp-xs)}
.act-group{display:flex;align-items:center;gap:inherit}
/* Feedback on a reply: a sheet on a phone, a centred card above. */
.fb-body{padding:0 20px;display:flex;flex-direction:column;gap:var(--sp-m);overflow-y:auto}
.fb-rates{display:flex;gap:var(--sp-s)}
.fb-rates .act{width:44px;height:44px;border:1px solid var(--hairline-strong)}
.fb-rates .act.on{border-color:var(--ink)}
.fb-rates .act svg{width:20px;height:20px}
.fb-body textarea{font:inherit;font-size:16px;line-height:1.45;color:var(--ink);resize:vertical;
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:14px;padding:10px 14px}
.fb-note{margin:0;font-size:13px;line-height:1.5;color:var(--ink-secondary)}
.fb-err{margin:0;font-size:13.5px;color:var(--danger)}
.modal footer.fb-row{display:flex;gap:var(--sp-s);padding:var(--sp-l) 20px var(--sp-xl)}
.fb-row button{flex:1;min-height:44px;padding:0 var(--sp-l);border-radius:var(--r-pill);
               font-size:16px;font-weight:500;text-align:center}
.fb-cancel{background:var(--chip);color:var(--ink)}
.fb-send{background:var(--ink);color:var(--on-ink)}
.fb-send[disabled]{opacity:.5}
/* Today's use: same panel as the model menu. */
.upanel{width:320px;padding:var(--sp-m) var(--sp-l) var(--sp-l)}
.up-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-s);
         margin-bottom:var(--sp-s);font-size:12.5px;color:var(--ink-secondary)}
.up-head b{font-size:14px;font-weight:600;color:var(--ink)}
.up-row + .up-row{margin-top:var(--sp-m)}
.up-line{display:flex;justify-content:space-between;gap:var(--sp-s);font-size:13.5px;
         color:var(--ink);margin-bottom:6px}
.up-line span + span{color:var(--ink-secondary);font-size:12.5px}
.up-bar{height:5px;border-radius:var(--r-pill);background:var(--hairline)}
.up-bar i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.up-bar.low i{background:var(--danger)}
.up-none{margin:var(--sp-s) 0 0;font-size:13px;line-height:1.45;color:var(--ink-secondary)}
/* Header like Claude's usage sheet: close on the left, title centred. */
.up-top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:var(--sp-m)}
.up-top b{text-align:center;font-size:15px;font-weight:600;color:var(--ink)}
.up-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
      background:var(--chip);color:var(--ink);cursor:pointer}
.up-row{padding:var(--sp-m) var(--sp-l);border-radius:var(--r-inner);background:var(--chip-soft, var(--chip))}
.up-row + .up-row{margin-top:var(--sp-s)}
/* The access step under the use. */
.up-acc{margin-top:var(--sp-m)}
.up-acc .acc-go{width:100%}
.up-code{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-s)}
.up-code .up-line{flex:1;min-width:0;margin:0;justify-content:flex-start}
.up-mask{letter-spacing:.08em;font-variant-numeric:tabular-nums}
.up-code .linkish{flex:none;font-size:13.5px;min-height:36px}
/* Moved to <body> when open (see render), so the tab bar never covers it and
   a phone gets the full width. */
.uback.portal{z-index:60}
.upanel.portal{z-index:61}
@media (min-width:640px){
  .upanel.portal{position:fixed;left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:360px}
}
@media (max-width:639px){
  .modal.sheet{max-height:62dvh}
  /* Access: a half-height sheet that scrolls inside, and grows once a field
     has focus so the keyboard does not leave a sliver to type into. */
  .modal.acc-sheet{max-height:56dvh;transition:max-height .25s ease}
  .modal.acc-sheet:focus-within{max-height:calc(var(--vv-h, 100dvh) - var(--sp-xxl))}
  /* While one of its fields is being typed in: a card at the top of the
     visible area, clear of the keyboard. */
  html.modal-typing .modal{top:calc(var(--vv-top, 0px) + var(--sp-s));bottom:auto;left:var(--sp-s);right:var(--sp-s);
    border-radius:20px;max-height:calc(var(--vv-h, 100dvh) - var(--sp-l))}
  html.modal-typing .modal::before{display:none}
  /* A card, not a sheet: no home-bar room under it, so no empty band. */
  html.modal-typing .modal{padding-bottom:0}
  html.modal-typing .modal .acc-sheet-body{padding-bottom:var(--sp-l)}
  .mmenu.upanel{padding:var(--sp-l) var(--sp-xl) calc(var(--sp-xxl) + env(safe-area-inset-bottom,0px))}
}
/* The conversation's first line, in the meta style; it scrolls away. */
.intro{align-self:center;max-width:var(--measure);margin:var(--sp-s) 0 var(--sp-m);
       text-align:center;font-size:12.5px;line-height:1.45;color:var(--ink-tertiary)}
.who-row{display:flex;align-items:center;gap:var(--sp-s);min-width:0}
.who-row b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.how{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chip);
     color:var(--ink-secondary);font-size:12.5px;font-weight:700;line-height:22px;
     text-align:center}
.how:hover{color:var(--ink)}
.simlink{display:inline-flex;align-items:center;gap:3px;font-size:inherit;color:inherit;
         text-decoration:underline dotted;text-underline-offset:2px}
.simlink:hover{color:var(--ink)}
.simlink svg{width:11px;height:11px}
.how-body{overflow-y:auto;padding:0 20px var(--sp-xxl);font-size:14px;
          line-height:1.55;color:var(--text-body)}
/* 14px, with air between sections (founder: not jammed, not big). The
   derivation sheet below uses exactly the same scale. */
.how-body h3{margin:var(--sp-xl) 0 var(--sp-xs);font-size:14px;font-weight:600;
             line-height:1.3;color:var(--ink)}
.how-body h3:first-child{margin-top:0}
.how-lede{color:var(--ink)}
.how-body p,.how-body ol{margin:0}
.how-body ol{padding-left:20px}
.how-body li + li{margin-top:var(--sp-s)}
.how-body dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:var(--sp-m) var(--sp-l)}
.how-body dt{font-weight:600;color:var(--ink);font-size:14px;line-height:1.55}
/* The derivation sheet: the same reading size and spacing, each label a
   heading over its paragraph rather than a line jammed against the last. */
.how-body .derived{font-size:inherit;line-height:inherit}
.how-body .derived > *{margin:var(--sp-xl) 0 0}
.how-body .derived > :first-child{margin-top:0}
.how-body .derived > p{color:var(--text-body)}
.how-body .derived .tag{font-size:14px;line-height:1.3;color:var(--ink);margin-bottom:var(--sp-xs)}
.how-body .derived .tag.warn{color:var(--danger)}
.how-body .derived ol.checks li{margin-top:var(--sp-m)}
.how-body .derived .s-lab{font-size:12.5px}
.how-body dd{margin:0}
.how-hosts{margin-top:var(--sp-l) !important;font-size:12px;color:var(--ink-tertiary)}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
       color:var(--ink-secondary);padding:4px 10px;border-radius:var(--r-pill)}
.mchip:hover,.mchip[aria-expanded="true"]{background:var(--chip);color:var(--ink)}
.cmodel .mchip--wait{cursor:default}
.mchip svg{width:9px;height:6px}
.mback{position:fixed;inset:0;z-index:43}
.mmenu{position:absolute;z-index:44;right:0;bottom:calc(100% + var(--sp-s));width:300px;
       max-height:min(420px,60dvh);overflow-y:auto;padding:var(--sp-xs);
       background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-inner);
       box-shadow:0 12px 40px rgba(36,50,53,.16),0 2px 6px rgba(36,50,53,.06)}
.mi{display:flex;align-items:center;gap:var(--sp-s);width:100%;min-height:40px;
    padding:var(--sp-s) var(--sp-s) var(--sp-s) var(--sp-m);border-radius:10px;
    font-size:14.5px;color:var(--ink);text-align:left}
.mi:hover,.mi:focus-visible{background:var(--chip);outline:0}
.mi .nm{flex:1;min-width:0}
.mi .side{font-size:12.5px;color:var(--ink-secondary);text-align:right;white-space:nowrap}
.mi .chk{flex:none;width:16px;text-align:center;font-size:13px;color:var(--ink)}
.mi.off{cursor:default}
.mi.off .nm,.mi.off .side{color:var(--ink-tertiary);opacity:.7}
.mi.back .nm{font-weight:500}
.msep{height:1px;background:var(--hairline);margin:var(--sp-xs) var(--sp-s)}
.mlock{margin:0;padding:var(--sp-s) var(--sp-m);font-size:13px;line-height:1.45;color:var(--ink-secondary)}
.mi .nm small{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--ink-secondary)}
.mhead{display:none}
.mgroup-more{border-top:1px solid var(--hairline);margin-top:var(--sp-xs);padding-top:var(--sp-xs)}
.mback.portal{z-index:60}
.mmenu.portal{z-index:61}
@media (max-width:639px){
  /* A phone: a sheet from the bottom, thumb-sized rows, not a tiny popover. */
  .mback{background:rgba(36,50,53,.32)}
  .mmenu{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:80dvh;
         border-radius:22px 22px 0 0;border:0;background:var(--bg);
         padding:var(--sp-xs) var(--sp-l) calc(var(--sp-xxl) + env(safe-area-inset-bottom,0px))}
  .mhead{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin:var(--sp-s) 0 var(--sp-l)}
  .mhead b{text-align:center;font-size:16px;font-weight:600;color:var(--ink)}
  .mgroup{background:var(--surface);border-radius:var(--r-inner);overflow:hidden}
  .mgroup .mi{border-radius:0;min-height:60px;padding:var(--sp-m) var(--sp-l)}
  .mgroup .mi + .mi{border-top:1px solid var(--hairline)}
  .mgroup-more{border-top:0;margin-top:var(--sp-m);padding-top:0}
  .mmenu .mlock{padding:var(--sp-m) var(--sp-xs) 0}
  .mmenu .mi.back{margin-bottom:var(--sp-s)}
  .mi{font-size:16px}
  .mi .nm small{font-size:13.5px}
  .mi .chk{font-size:16px}
}
.ring{width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.ring svg{width:18px;height:18px}
.usage-pop{margin:0;padding:6px 10px;font-size:12px;line-height:1.4;color:var(--ink-secondary);
           background:var(--chip-soft);border-radius:var(--r-chip);text-align:right}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Before the first message: questions to start on, taken from the threads
   these people already answer in, then the newest questions. */
.suggest{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
         /* The transcript's own side padding, so the left edge is the
            messages' left edge at every width. */
         padding:0 max(12px, calc((100% - var(--column)) / 2)) 10px;width:100%}
.suggest .lbl{font-size:12.5px;font-weight:500;color:var(--ink-secondary);padding:0 2px}
.suggest .ghost{text-align:left;line-height:1.35}
/* Compact above the message box (founder): a slimmer chip, still a
   comfortable tap. */
.chat-acts .ghost{min-height:36px;padding:7px 14px}
.chat-acts{flex:none;display:flex;gap:8px;padding:0 12px 4px;flex-wrap:wrap;
           width:100%;max-width:var(--column);margin:0 auto}
.convo-pane > .notice{width:calc(100% - 24px);max-width:calc(var(--column) - 24px);
                      margin-left:auto;margin-right:auto}
.ghost{font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:var(--r-pill);
       background:var(--chip);color:var(--ink)}

/* The picker dialog. A sheet from the bottom on a phone, a centred card on a
   desktop — the two places people expect a chooser to come from. */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(36,50,53,.32);
          backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{position:fixed;z-index:41;left:0;right:0;bottom:0;
       display:flex;flex-direction:column;max-height:86dvh;
       background:var(--bg);border-radius:22px 22px 0 0;
       box-shadow:0 -8px 40px rgba(36,50,53,.22);
       padding-bottom:env(safe-area-inset-bottom,0px)}
.modal header{flex:none;display:flex;align-items:center;gap:12px;
              padding:18px 20px 12px}
.modal header b{flex:1;font-size:17px}
.modal header .x{flex:none;width:30px;height:30px;border-radius:50%;
                 background:var(--chip);color:var(--ink);font-size:17px;
                 line-height:30px;text-align:center}
.modal input{flex:none;margin:0 20px;font:inherit;font-size:16.5px;color:var(--ink);
             background:var(--surface);border:1px solid var(--hairline-strong);
             border-radius:var(--r-pill);padding:11px 16px}
.filters{flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:12px 20px 4px;
         scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.filters::-webkit-scrollbar{display:none}
.fpill{flex:none;font-size:13.5px;font-weight:500;padding:7px 14px;
       border-radius:var(--r-pill);background:var(--chip);color:var(--ink)}
.fpill.on{background:var(--ink);color:var(--accent)}
.selected{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 2px}
.selchip{font-size:13px;font-weight:500;padding:5px 8px 5px 11px;
         border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);
         display:flex;align-items:center;gap:6px}
.selchip span{opacity:.6;font-size:14px}
.plist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 0}
.modal footer{flex:none;padding:12px 20px 16px}
/* Phone: the picker takes the whole screen, top edge to the top, so the
   list still has room with the keyboard up. */
@media (max-width:639px){
  .modal.pick{top:0;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top,0px);box-shadow:none}
}
.modal footer .wide{margin:0}
/* The new-chat sheet's three ways in (B46). */
.pick-seg{flex:none;margin:0 20px 12px}
.askpane{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.askpane textarea{font:inherit;font-size:16.5px;line-height:1.4;color:var(--ink);resize:vertical;
  background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-inner,16px);padding:12px 14px}
.askpane .ghost{align-self:flex-start}
.askpane .ghost[disabled]{opacity:.4}
.srow{display:flex;align-items:flex-start;gap:12px;padding:9px 4px;border-bottom:1px solid var(--hairline)}
.srow .meta{flex:1;min-width:0}
.srow b{font-size:16px;font-weight:500;display:block}
.srow .meta > span{font-size:13.5px;line-height:1.4;color:var(--ink-secondary)}
.srow .sdrop{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);
  color:var(--ink-secondary);font-size:16px;line-height:28px;text-align:center}
.modal footer .wide[disabled]{opacity:.35}

.prow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;
      border-bottom:1px solid var(--hairline);text-align:left}
.prow .meta{flex:1;min-width:0}
.prow b{font-size:16px;font-weight:500;display:block}
.prow .meta > span{font-size:12.5px;color:var(--ink-secondary)}
.prow .tick{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);
            color:var(--ink-secondary);font-size:15px;line-height:28px;
            text-align:center}
.prow.on .tick{background:var(--ink);color:var(--on-ink)}

@media (min-width:640px){
  .modal{left:50%;bottom:auto;top:50%;right:auto;transform:translate(-50%,-50%);
         width:min(460px,calc(100vw - 40px));border-radius:20px;max-height:min(680px,82dvh);
         box-shadow:0 20px 60px rgba(36,50,53,.26)}
}
.tier{font-size:11px;font-weight:600;padding:2px 5px;
      border-radius:var(--r-pill);background:var(--chip);color:var(--ink-secondary)}
.tier.pro{background:var(--ink);color:var(--accent)}
.notice{font-size:13.5px;line-height:1.5;color:var(--ink-tertiary);background:var(--chip);
        border-radius:14px;padding:10px 12px;margin:8px 12px;flex:none}

@media (min-width:900px){
  /* Three columns overall: the app's nav rail, this list, and the thread. */
  .page.page--chat{max-width:none;margin:0;padding:0}
  .chat-wrap{height:calc(100dvh - 60px);
             display:grid;grid-template-columns:var(--list-w,320px) minmax(0,1fr);
             grid-template-rows:minmax(0,1fr)}
  .chat-wrap .convo-list,
  .chat-wrap.has-open .convo-list{display:flex;min-height:0;
                                  border-right:1px solid var(--hairline)}
  .chat-wrap .convo-pane,
  .chat-wrap.has-open .convo-pane{display:flex;flex-direction:column;
                                  height:100%;min-height:0}
  .cback{display:none}
  .list-head h1{font-size:26px}
}

.report-note{font-size:13px;line-height:1.45;color:var(--danger);
             background:rgba(236,105,64,.10);border-radius:var(--r-chip);
             padding:10px 12px;margin-top:12px;
             /* Brought into view when it opens (see [data-report]): clear of the
                top bar and of the tab bar floating over the bottom. */
             scroll-margin:72px 0 calc(96px + var(--nav-lift))}
.me-privacy{margin-top:var(--sp-m);display:flex;gap:var(--sp-l)}
.agree{margin:var(--sp-xs) 0 0;font-size:12px;line-height:1.45;color:var(--ink-tertiary);text-align:center}
.agree a{color:inherit;text-underline-offset:2px}
.keyform .agree{text-align:left;align-self:stretch}
.cfoot .agree{padding:0 var(--sp-xs)}
.me-privacy a{font-size:14px;color:var(--ink);text-underline-offset:2px}
.report-note--ok{color:var(--ink-secondary);background:var(--chip-soft)}
.icon-btn.on[data-report]{color:var(--ink)}
.rep-add{display:flex;align-items:baseline;gap:var(--sp-xs);font-size:14.5px;color:var(--ink);cursor:pointer;
        text-decoration:underline;text-underline-offset:2px}
.rep-add small{font-size:13px;color:var(--ink-secondary);text-decoration:none}
.rep-add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

<script>
/* ---------------------------------------------------------------------------
   Still, on the web.

   A port of the iOS app, reading the same PastLives/Resources/content.json the
   app ships in its bundle. Everything on this page comes out of that file:
   the questions, the replies, the quotations and their sources. Nothing is
   generated here, which is the whole point of the project — a quote is only a
   quote if it has a source you can follow.

   State (votes, likes, language) lives in this browser only, the same way the
   app keeps it on the phone and never sends it anywhere.
--------------------------------------------------------------------------- */

const IMG = 'assets/img/';
/* ?preview, inside an iframe: the editor's preview (see "Preview" by Boot).
   The content comes from the editor instead of assets/content.json, and
   nothing is read from or written to this browser's storage. */
const PREVIEW = new URLSearchParams(location.search).has('preview') && window.parent !== window;
let C = null;                 // content.json
let lang = 'en';
let state = { votes:{}, likes:{} };
let stack = [{ tab:'home' }]; // view stack; last entry is what is showing
let reported = null;          // which item's report note is showing
let PHIL = [];                // the ranked roster, from assets/philosophers.json
let SAMPLE = undefined;       // the model, once asked for: null means no model here
/* What the reader wants to think about: picked once in the welcome,
   changeable in Me. It orders Home and hides nothing. Ids match the
   content's question.topics. */
const TOPICS = [
  ['power',   'Power & leadership',     '权力与领导'],
  ['money',   'Money & success',        '金钱与成功'],
  ['work',    'Work & ambition',        '工作与抱负'],
  ['tech',    'Technology & attention', '科技与注意力'],
  ['love',    'Love & family',          '爱与家庭'],
  ['trust',   'Secrets & trust',        '秘密与信任'],
  ['society', 'Society & justice',      '社会与正义'],
  ['meaning', 'Meaning & mortality',    '意义与死亡'],
  ['self',    'Self & happiness',       '自我与幸福'],
];
let PICKS = [];
let ONBOARDED = false;
const OB = { open: false, step: 0, sel: [], moved: false };
/* A chat app holds conversations, not one transcript. Each carries its own
   cast, its own history, and its own record of which philosophers have
   already shown a real passage. */
let chat = { convos: [], open: null, busy:false, query:'', filter:'all',
             picking:false, pending: [], typing:null, draft:'', seeded:false,
             // The new-chat sheet (B46): one / several / ask, the question,
             // the suggestions (null, 'finding' or a list), and a question
             // carried into picking when suggest failed.
             newMode:'one', askQ:'', suggest:null, carried:null };

/* --- Storage. Every access can throw (private windows, blocked site data),
       and the page has to render correctly when it does. ------------------ */
function load(){
  try{
    const c = localStorage.getItem('still.chat');
    if(c){
      const saved = JSON.parse(c);
      // An earlier build kept a single conversation; carry it over as one.
      if(saved.cast && !saved.convos){
        saved.convos = saved.cast.length
          ? [{id:'c1', cast:saved.cast, msgs:saved.msgs||[], said:saved.said||{},
              at: Date.now()}] : [];
        saved.open = saved.convos.length ? 'c1' : null;
      }
      delete saved.cast; delete saved.msgs; delete saved.said;
      chat = Object.assign(chat, saved, {busy:false, picking:false, pending:[]});
    }
  }catch(e){ /* defaults stand */ }
  try{
    const raw = localStorage.getItem('still.state');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    const l = localStorage.getItem('still.lang');
    if(l === 'en' || l === 'zh') lang = l;
  }catch(e){ /* defaults stand */ }
  try{
    const tp = JSON.parse(localStorage.getItem('still.topics') || '[]');
    if(Array.isArray(tp)) PICKS = tp.filter(id => TOPICS.some(x => x[0] === id));
    ONBOARDED = !!localStorage.getItem('still.onboarded');
  }catch(e){ ONBOARDED = true; /* storage blocked: never trap anyone in a welcome */ }
}
function saveTopics(){
  if(PREVIEW) return;
  try{
    localStorage.setItem('still.topics', JSON.stringify(PICKS));
    if(ONBOARDED) localStorage.setItem('still.onboarded', new Date().toISOString());
  }catch(e){}
}
function save(){
  if(PREVIEW) return;
  try{
    localStorage.setItem('still.state', JSON.stringify(state));
    localStorage.setItem('still.lang', lang);
    localStorage.setItem('still.chat', JSON.stringify({
      open: chat.open, seeded: chat.seeded,
      convos: chat.convos.map(c => ({...c, msgs: c.msgs.slice(-60)}))
    }));
  }catch(e){ /* nothing to do; the page still works for this session */ }
}

/* --- Helpers ------------------------------------------------------------- */
const t = (en, zh) => lang === 'zh' ? zh : en;
const L = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n.toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
const byId = (arr, id) => arr.find(x => x.id === id);

function dateLabel(iso){
  const d = new Date(iso + 'T00:00:00Z');
  const o = {timeZone:'UTC'};
  if(lang === 'zh'){
    const wd = d.toLocaleDateString('zh-Hans-CN',{...o, weekday:'long'});
    return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${wd}`;
  }
  // en_GB puts the day before the month, and the app's format keeps a comma
  // after the weekday that the locale's own long form leaves out.
  const wd = d.toLocaleDateString('en-GB',{...o, weekday:'long'});
  const mo = d.toLocaleDateString('en-GB',{...o, month:'long'});
  return `${wd}, ${d.getUTCDate()} ${mo}`;
}
const initial = name => (name || '?').trim()[0] || '?';

const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
/* Report: the flag opens a sheet (B39) that sends a note, an optional
   screenshot and which item it is to Still (/v1/report). A sent report
   fills its flag, remembered on this device. */
let REPORTS_SENT = (() => { try{ return new Set(JSON.parse(localStorage.getItem('still.reportsSent') || '[]')); }catch(e){ return new Set(); } })();
const reportBtn = key => {
  // On a draft, an editor's flag rates it instead (EDITOR, below).
  if(isDraftKey(key)) return rateBtn(key);
  const sent = REPORTS_SENT.has(key);
  return `<button class="icon-btn${sent ? ' on' : ''}" data-report="${esc(key)}" aria-haspopup="dialog"
  aria-label="${sent ? t('Reported','已举报') : t('Report','举报')}">${sent ? FLAG.replace('<path d="M5 4h11', '<path fill="currentColor" d="M5 4h11') : FLAG}</button>`;
};
const reportNote = key => reported === key
  ? `<p class="report-note report-note--ok" role="status">${t('Thanks — sent','谢谢，已发送')}</p>`
  : '';
let REPORT = null;   // { key, kind, id, comment, shot, sending, err }
function openReport(key){
  const [kind, id] = String(key).split(/:(.*)/s);
  REPORT = { key, kind, id, comment: '', shot: '', sending: false, err: '' };
  render();
  setTimeout(() => { const b = document.getElementById('rep-comment'); if(b) b.focus(); }, 300);
}
function reportDialog(){
  if(!REPORT) return '';
  const f = REPORT, q = f.kind === 'question';
  return `<div class="backdrop" data-rep-cancel="1"></div>
    <div class="modal sheet fb-sheet rep-sheet" role="dialog" aria-modal="true" aria-labelledby="rep-t">
      <header><b id="rep-t">${q ? t('Report this question','举报这个问题') : t('Report this reply','举报这条回复')}</b></header>
      <div class="fb-body">
        <textarea id="rep-comment" rows="4" maxlength="2000" required
          placeholder="${t("What's wrong?",'哪里有问题？')}"
          aria-label="${t("What's wrong?",'哪里有问题？')}">${esc(f.comment)}</textarea>
        ${f.shot ? `<div class="rep-shot"><img src="${esc(f.shot)}" alt="${t('Screenshot','截图')}">
            <button type="button" class="linkish" data-rep-shot-remove="1">${t('Remove','移除')}</button></div>`
          : `<label class="rep-add"><input type="file" accept="image/*" id="rep-file">
            <span>${t('Add a screenshot','添加截图')}</span> <small>${t('(optional)','（可选）')}</small></label>`}
        <p class="fb-note">${q ? t('This sends your note, the screenshot and which question it is to Still.',
          '这会把你的说明、截图和对应问题发送给 Still。') : t('This sends your note, the screenshot and which reply it is to Still.',
          '这会把你的说明、截图和对应回复发送给 Still。')}</p>
        ${f.err ? `<p class="fb-err" role="alert">${esc(f.err)}</p>` : ''}
      </div>
      <footer class="fb-row">
        <button type="button" class="fb-cancel" data-rep-cancel="1">${t('Cancel','取消')}</button>
        <button type="button" class="fb-send" data-rep-send="1"${f.sending || !f.comment.trim() ? ' disabled' : ''}>${
          f.sending ? t('Sending…','发送中…') : t('Send report','发送举报')}</button>
      </footer>
    </div>`;
}
/* A screenshot, made small on the device: at most 1600px on its long side,
   JPEG, under 500 KB (the server's limit). Quality steps down first, then
   the size, until it fits. */
async function shrinkShot(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    let k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    for(let pass = 0; pass < 4; pass++, k *= .75){
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      for(let q = .85; q >= .35; q -= .1){
        const d = c.toDataURL('image/jpeg', q);
        if(d.length * .75 <= 5e5) return d;
      }
    }
    return '';
  }finally{ URL.revokeObjectURL(url); }
}
async function sendReport(){
  const f = REPORT; if(!f || f.sending) return;
  const box = document.getElementById('rep-comment'); if(box) f.comment = box.value;
  if(!f.comment.trim()) return;
  if(!AGENT_URL){ f.err = t("Reports can't be sent from this page.", '这个页面无法发送举报。'); return render(); }
  let questionId = null, voice = null;
  if(f.kind === 'question') questionId = f.id;
  else { const rr = (C.responses || []).find(x => x.id === f.id);
    if(rr){ questionId = rr.questionId || null; voice = rr.voiceId || null; } }
  const body = { platform: 'web', lang, target: { kind: f.kind, id: f.id, questionId, voice },
    comment: f.comment.trim(), screenshot: f.shot || null, page: location.href };
  f.sending = true; f.err = ''; render();
  try{
    const r = await fetch(AGENT_URL + '/v1/report', { method: 'POST',
      headers: agentHeaders({ 'content-type': 'application/json' }), body: JSON.stringify(body) });
    if(!r.ok) throw new Error('report ' + r.status);
  }catch(e){
    if(REPORT !== f) return;
    f.sending = false;
    f.err = t("Couldn't send it. Check your connection and try again.", '没能发送。请检查网络后再试。');
    return render();
  }
  REPORTS_SENT.add(f.key);
  try{ localStorage.setItem('still.reportsSent', JSON.stringify([...REPORTS_SENT])); }catch(e){}
  REPORT = null; reported = f.key; render();
  setTimeout(() => { if(reported === f.key){ reported = null; render(); } }, 2400);
}
document.addEventListener('keydown', ev => {
  if(REPORT && ev.key === 'Escape' && !REPORT.sending){ ev.preventDefault(); REPORT = null; render(); }
});

/* --- Editors (Docs/editor-role.md) ---------------------------------------
   A few trusted accounts rate the AI-drafted posts before they go live. An
   editor signed in here gets the drafts from the gate (GET /v1/editor/drafts,
   editors only; never in assets/), sees them above Home's feed, and on a
   draft the flag opens the rating sheet: 1-5 stars for the question and an
   optional note (POST /v1/editor/feedback). Drafts are kept in memory only,
   never in this browser's storage, and stay out of the Answers book and the
   thinkers' pages. Everyone else, and every published post, is unchanged. */
let EDITOR = { on: false, drafts: [], mine: {} };
const isDraftQ = id => EDITOR.on && EDITOR.drafts.includes(id);
function isDraftKey(key){
  const [kind, id] = String(key).split(/:(.*)/s);
  if(kind === 'question') return isDraftQ(id);
  const r = kind === 'response' ? (C.responses || []).find(x => x.id === id) : null;
  return !!(r && r.draft && isDraftQ(r.questionId));
}
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"'
  + ' stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9'
  + ' 6.8 19.6l1-5.8-4.3-4.1 5.9-.9z"/></svg>';
function rateBtn(key){
  const [kind, id] = String(key).split(/:(.*)/s);
  const qid = kind === 'question' ? id : ((C.responses || []).find(x => x.id === id) || {}).questionId;
  const rated = !!EDITOR.mine[qid];
  return `<button class="icon-btn${rated ? ' on' : ''}" data-rate="${esc(key)}" aria-haspopup="dialog"
    aria-label="${rated ? t('Rated — change your rating','已评分，修改评分') : t('Rate this draft','给这篇草稿评分')}">${
    rated ? FLAG.replace('<path d="M5 4h11', '<path fill="currentColor" d="M5 4h11') : FLAG}</button>`;
}
/* Take out any drafts merged earlier, then merge these: the question as
   status "draft", its replies marked draft, and voices and works only where
   the published content lacks them. */
function setDrafts(list){
  C.questions = C.questions.filter(q => q.status !== 'draft');
  C.responses = C.responses.filter(r => !r.draft);
  EDITOR.drafts = []; EDITOR.mine = {};
  for(const d of list || []){
    const b = d && d.bundle; if(!b || !b.question) continue;
    // Already published (the drafts table catches up on the next upload): the reader's copy wins.
    if(byId(C.questions, b.question.id)) continue;
    C.questions.push({ ...b.question, status: 'draft' });
    for(const r of b.responses || []) C.responses.push({ ...r, draft: true });
    for(const v of b.voices || []) if(!byId(C.voices, v.id)) C.voices.push(v);
    for(const w of b.works || []) if(!byId(C.works, w.id)) C.works.push(w);
    EDITOR.drafts.push(b.question.id);
    if(d.mine) EDITOR.mine[b.question.id] = d.mine;
  }
}
async function refreshEditor(){
  if(!AGENT_URL || PREVIEW || !C) return;
  if(!AUTH.session){ if(EDITOR.on || EDITOR.drafts.length){ setDrafts([]); EDITOR.on = false; render(); } return; }
  try{
    const me = await fetch(AGENT_URL + '/v1/me', { headers: agentHeaders({}) }).then(r => r.ok ? r.json() : null);
    const on = !!(me && me.account && me.account.editor);
    let list = [];
    if(on){
      const r = await fetch(AGENT_URL + '/v1/editor/drafts', { headers: agentHeaders({}) });
      if(r.ok) list = ((await r.json()).drafts) || [];
    }
    EDITOR.on = on; setDrafts(on ? list : []);
    render();
  }catch(e){ /* offline: no drafts, nothing else changes */ }
}

async function sendRate(){
  const f = RATE; if(!f || f.sending || !f.stars) return;
  const box = document.getElementById('ed-comment'); if(box) f.comment = box.value;
  const body = { post_id: f.qid, response_id: f.rid, stars: f.stars, comment: f.comment.trim(),
    platform: 'web', lang };
  f.sending = true; f.err = ''; render();
  let status = 0;
  try{
    const r = await fetch(AGENT_URL + '/v1/editor/feedback', { method: 'POST',
      headers: agentHeaders({ 'content-type': 'application/json' }), body: JSON.stringify(body) });
    status = r.status;
    if(!r.ok) throw new Error('rate ' + r.status);
  }catch(e){
    if(RATE !== f) return;
    f.sending = false;
    f.err = status === 403 ? t('This account is no longer an editor.','这个账户已不再是编辑。')
      : status === 404 ? t('This draft has changed or been published. Reload to see the latest.','这篇草稿已更改或已发布。请刷新查看最新版本。')
      : t("Couldn't send it. Check your connection and try again.", '没能发送。请检查网络后再试。');
    return render();
  }
  if(!f.rid) EDITOR.mine[f.qid] = { stars: f.stars, comment: f.comment.trim() || null, at: new Date().toISOString() };
  else if(!EDITOR.mine[f.qid]) EDITOR.mine[f.qid] = { stars: f.stars, comment: null, at: new Date().toISOString() };
  RATE = null; reported = f.key; render();
  setTimeout(() => { if(reported === f.key){ reported = null; render(); } }, 2400);
}

/* Questions newest first — the app sorts the feed by date descending, so an
   appended question rises to the top instead of sinking to its index. */
const questions = () => C.questions
  .filter(q => q.status === 'published')
  .sort((a,b) => b.date.localeCompare(a.date));

const responsesFor = q => C.responses.filter(r => r.questionId === q.id);

/* Ordered by how far a voice reaches, the way the thread is ordered in the
   app, so the best-known names are not always first by accident. */
function threadRows(q, filter){
  let rs = responsesFor(q);
  if(filter && filter !== 'all') rs = rs.filter(r => r.optionKey === filter);
  return rs.map(r => ({ r, v: byId(C.voices, r.voiceId) }))
           .filter(x => x.v)
           .sort((a,b) => ((b.v.reach||{}).weight||0) - ((a.v.reach||{}).weight||0));
}

function worksFor(q){
  const ids = new Set();
  Object.values(q.answers || {}).forEach(a => (a.workIds||[]).forEach(w => ids.add(w)));
  return [...ids].map(id => byId(C.works, id)).filter(Boolean);
}

/* --- Navigation ---------------------------------------------------------- */
const here = () => stack[stack.length - 1];
/* Moving deeper slides the new page in from the right; going back brings
   the previous one in from the left; switching tabs does not slide. */
/* NAVIGATION. Going deeper, the new page comes in from the right and the
   current one leaves to the left, side by side, like turning to the next
   page: no shadow or dimming, so it never reads as a drawer over the page
   (founder, 12 Nov). The bar's back button fades in across the same move.
   Going back is the reverse. Tabs do not slide. With reduced motion, a
   crossfade. Every push is a browser history entry, so the back button and
   Safari's own edge swipe go back too (Safari animates its swipe itself, so
   a back that arrives from the browser is drawn without ours). Full screen
   from the home screen there is no browser swipe: there, a swipe from the
   left edge follows the finger. */
let NAV = null, NAV_SKIP_POP = 0, CONVO_PUSHED = false;
function closeConvo(){
  chat.open = null;
  if(CONVO_PUSHED){ CONVO_PUSHED = false; NAV = 'pop'; NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } }
  render();
}
const navReduced = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
/* Safari's status-bar colour (founder, 12 Nov: it lagged one page behind,
   white on the green Answers and green on Home). Safari reads theme-color
   reliably only when the tag is new, and it can sample the page while the
   slide's ghost still covers the top. So the tag is replaced, not edited,
   and set again once the move has finished. It matches each page's own
   background (html.on-answers paints #5B8352). */
let THEME_TIMER = 0;
function setThemeColor(c){
  const put = () => {
    const old = document.querySelector('meta[name="theme-color"]');
    if(old && old.getAttribute('content') === c && !THEME_TIMER) return;
    const m = document.createElement('meta'); m.name = 'theme-color'; m.content = c;
    if(old) old.replaceWith(m); else document.head.appendChild(m);
  };
  put();
  clearTimeout(THEME_TIMER);
  THEME_TIMER = setTimeout(() => { THEME_TIMER = 0; put(); }, 420);
}
function navSnapshot(view){
  const r = view.getBoundingClientRect();
  const g = document.createElement('div');
  g.className = 'nav-ghost'; g.setAttribute('aria-hidden', 'true');
  g.style.left = r.left + 'px'; g.style.width = r.width + 'px';
  const inner = document.createElement('div');
  inner.className = 'nav-ghost-in'; inner.style.transform = `translateY(${r.top}px)`;
  inner.innerHTML = view.innerHTML;
  inner.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  g.appendChild(inner);
  return g;
}
function navAnimate(ghost, kind){
  const view = document.getElementById('view');
  const html = document.documentElement;
  // With the sidebar (900px and up) the page sits in a column: sliding it
  // would cross the sidebar, so the page changes with a quick crossfade.
  const fade = navReduced() || matchMedia('(min-width:900px)').matches;
  if(fade){
    ghost.classList.add('over', 'fade-out');
  } else if(kind === 'push'){
    ghost.classList.add('under', 'push-out'); view.classList.add('nav-in-right');
  } else {
    ghost.classList.add('over', 'pop-out'); view.classList.add('nav-in-left');
  }
  html.classList.add('nav-busy');
  const bar = document.getElementById('bar');
  if(bar && !fade){ bar.classList.remove('nav-bar-in'); void bar.offsetWidth; bar.classList.add('nav-bar-in'); }
  document.body.appendChild(ghost);
  setTimeout(() => { ghost.remove(); view.classList.remove('nav-in-right', 'nav-in-left'); html.classList.remove('nav-busy');
    if(bar) bar.classList.remove('nav-bar-in'); },
    fade ? 220 : 380);
}
function go(entry){ reported = null; stack.push(entry); NAV = 'push';
  // In the editor's iframe, history is the editor's: back must not leave it.
  if(!PREVIEW) try{ history.pushState({ still: stack.length }, ''); }catch(e){}
  render(); window.scrollTo(0,0); }
addEventListener('popstate', () => {
  if(NAV_SKIP_POP){ NAV_SKIP_POP--; return; }
  // The browser went back (its button, or Safari's swipe, which drew its
  // own motion): step back without ours.
  if(stack.length > 1){ reported = null; stack.pop(); render(); }
  else if(chat.open && stack[0].tab === 'chat'){ chat.open = null; CONVO_PUSHED = false; render(); }
});
/* The home-screen app's edge swipe: from the left edge, the page follows
   the finger with the previous page under it; let go past 40% of the width
   or with a flick and it goes back, otherwise it settles. */
(function(){
  let s = null;
  document.addEventListener('touchstart', ev => {
    if(!standalone() || navReduced() || OB.open || document.querySelector('.modal')) return;
    // Dragging a selection handle near the edge is not a swipe back.
    const sel = window.getSelection && getSelection();
    if(sel && !sel.isCollapsed) return;
    const t = ev.touches[0];
    const canBack = stack.length > 1 || (chat.open && stack[0].tab === 'chat');
    if(!canBack || t.clientX > 24) return;
    s = { x0: t.clientX, y0: t.clientY, t0: Date.now(), dx: 0, on: false, ghost: null };
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if(!s) return;
    const t = ev.touches[0], dx = t.clientX - s.x0, dy = t.clientY - s.y0;
    if(!s.on){
      if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ s = null; return; }
      if(dx < 8) return;
      s.on = true;
      // The page underneath: the one going back would show.
      const view = document.getElementById('view');
      const prev = stack.length > 1 ? stack[stack.length - 2] : { tab: 'chat' };
      const keepOpen = chat.open; if(stack.length === 1) chat.open = null;
      const g = navSnapshot(view);
      g.querySelector('.nav-ghost-in').innerHTML = viewHTML(prev);
      g.querySelector('.nav-ghost-in').style.transform = `translateY(${view.getBoundingClientRect().top + scrollY}px)`;
      chat.open = keepOpen;
      g.classList.add('under', 'live'); document.body.appendChild(g);
      document.documentElement.classList.add('nav-busy', 'nav-drag');
      s.ghost = g;
    }
    ev.preventDefault();
    s.dx = Math.max(0, dx);
    const w = innerWidth, f = Math.min(1, s.dx / w);
    document.getElementById('view').style.transform = `translateX(${s.dx}px)`;
    s.ghost.style.transform = `translateX(${-100 * (1 - f)}%)`;
  }, { passive: false });
  const end = () => {
    if(!s || !s.on){ s = null; return; }
    const view = document.getElementById('view'), g = s.ghost, w = innerWidth;
    const fast = s.dx / Math.max(1, Date.now() - s.t0) > .5;
    const done = s.dx > w * .4 || (fast && s.dx > 40);
    view.style.transition = g.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)';
    view.style.transform = done ? `translateX(${w}px)` : 'translateX(0)';
    g.style.transform = done ? 'translateX(0)' : 'translateX(-100%)';
    s = null;
    setTimeout(() => {
      view.style.transition = view.style.transform = '';
      g.remove(); document.documentElement.classList.remove('nav-busy', 'nav-drag');
      if(done){
        reported = null;
        if(stack.length > 1){ stack.pop(); NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } }
        else { chat.open = null; if(CONVO_PUSHED){ CONVO_PUSHED = false; NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } } }
        render();
      }
    }, 250);
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();
function tab(name){ reported = null; stack = [{tab:name}]; render(); window.scrollTo(0,0); }
function back(){ reported = null;
  if(chat.picking){ chat.picking = false; return render(); }
  if(chat.open && stack[0].tab === 'chat' && stack.length === 1){ closeConvo(); return; }
  if(stack.length > 1){ stack.pop(); NAV = 'pop';
    if(!PREVIEW){ NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } }
    render(); } }

      ? `<span class="pct" style="${mine?`color:${esc(p.text)}`:''}">${pct}%</span>` : ''}

  if(CONFIRM && ev.key === 'Escape'){ ev.preventDefault(); CONFIRM = null; render(); }

function questionCard(q, flat){
  const chosen = state.votes[q.id] ?? null;
  const liked = !!state.likes['question:'+q.id];
  const joined = q.joined || 0;
  const close = q.status === 'draft'
    ? t('Read every reply, then rate the draft with the flag.','读完所有回复，再用旗子给草稿评分。')
    : joined > 0
    ? (chosen == null
        ? t(`Answer to open the thread. ${num(joined)} living have already answered.`,
            `作答后即可展开讨论。已有 ${num(joined)} 位在世的人作答。`)
        : t(`${num(joined)} living have answered. You can change yours any time.`,
            `${num(joined)} 位在世的人已作答。你可以随时更改答案。`))
    : S(chosen == null ? 'lead' : 'bars');

  return `
  <article class="card ${flat?'card--flat':''} q ${flat?'q--flat':''}" data-open="${flat?'':esc(q.id)}">
    <div class="q-top">
      <span class="q-date">${esc(dateLabel(q.date))}${q.status === 'draft'
        ? ` <span class="ed-tag">${t('Draft','草稿')}</span>` : ''}</span>
      <button class="icon-btn ${liked?'on':''}" data-like="question:${esc(q.id)}"
              aria-label="${t('Like','喜欢')}" aria-pressed="${liked}">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor"
             stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.7 1.1-1a5.5 5.5 0 0 0 0-7.7z"/></svg>
      </button>
      ${reportBtn('question:'+q.id)}
    </div>
    <h2 class="q-title">${esc(L(q.title))}</h2>
    ${flat
      // In the thread the card is shortened, as the app does, so the
      // replies show sooner: a smaller title, three lines of description
      // with More / Less, tighter options.
      ? `<p class="q-why${LEDE_OPEN ? '' : ' clamp'}">${esc(L(q.why))}</p>
         <button type="button" class="q-more" data-lede="1" aria-expanded="${LEDE_OPEN}">${
           LEDE_OPEN ? t('Less','收起') : t('More','更多')}</button>`
      : `<p class="q-why">${esc(L(q.why))}</p>`}
    <div class="opts">${q.options.map(o => optionRow(q,o,chosen)).join('')}</div>
    <p class="q-close">${esc(close)}</p>
    ${reportNote('question:'+q.id)}
    ${(chosen != null || q.status === 'draft') && !flat
      ? `<button class="wide" data-open="${esc(q.id)}">${t('Open the thread','打开讨论')}</button>` : ''}
  </article>`;
}

/* Home, ordered by the reader's topics: the newest published question
   always stays on top, whatever the picks (as the app does); after it,
   questions sharing more of the picks come first, newest first among
   equals. Nothing is dropped. A question without topics ranks as sharing
   none. */
function homeOrder(qs){
  if(!PICKS.length) return qs;
  const score = q => (Array.isArray(q.topics) ? q.topics : []).filter(x => PICKS.includes(x)).length;
  const newest = qs.reduce((a, q) => !a || (q.date || '') > (a.date || '') ? q : a, null);
  if(!newest) return qs;
  return [newest].concat(qs.filter(q => q !== newest).map((q, i) => ({ q, i, s: score(q) }))
    .sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.q));
}

};

document.addEventListener('keydown', ev => {
  if(!OB.open || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const to = ev.key === '1' || ev.key === 'ArrowLeft' ? 0 : ev.key === '2' || ev.key === 'ArrowRight' ? 1 : null;
  if(to === null || to === OB.step) return;
  ev.preventDefault(); OB.step = to; OB.moved = true; render();

function finishOnboarding(picks){
  if(picks) PICKS = picks.slice();
  ONBOARDED = true; OB.open = false; saveTopics();
  // It opens over wherever the reader signed up (often a chat) or from Me:
  // closing it leaves them there. Skipping keeps the default topics.
  render();
}
/* The welcome (Welcome, then Topics) shows once, right after a sign-up:

   off, the first access code entered here. `again` is Me's "Show the

function openOnboarding(again){
  if(!again && ONBOARDED) return;
  OB.open = true; OB.step = 0; OB.moved = false; OB.sel = PICKS.slice();
}
