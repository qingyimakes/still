/* A featured work's title in the reader's language; where the content's
   zh title is only the English, the Chinese title from library.json. */
/* The smaller second line under a title: the original-language title when
   one is sourced (Wikidata, see library.json); in zh, otherwise the
   English. Never a guess, and nothing when it would repeat the first. */
/* Interface strings that ship with the content: { en: {...}, zh: {...} },
   keyed by language first (not by field, as every other content string). */
const S = k => { const st = (C && C.strings) || {}; return (st[lang] && st[lang][k]) || (st.en && st.en[k]) || ''; };
function subTitle(orig, shown, en, tag){
  const t2 = orig && orig.text;
  if(!t2 || t2 === shown) return '';
  const el = tag || 'span';
  return `<${el} class="orig-t"${orig && orig.lang ? ` lang="${esc(orig.lang)}"` : ''}>${esc(t2)}</${el}>`;
}
/* Under a reply: the Still book its quote comes from, as a small card that
   opens the book's page. Replaces the old outside "read more" link; a quote
   from a book Still does not have shows nothing (founder, B38). */
function refBook(w, v){
  const face = w.image && w.image.file
    ? `<img src="${IMG}${esc(w.image.file)}" alt="" ${lazy(IMG + w.image.file)}>`
    : `<span>${esc(initial(workTitle(w)))}</span>`;
  // The author in full, as the reply header gives it: "Mill" read as
  // someone else (founder, B38).
  const by = [(v && fullName(v)) || L(w.author), L(w.year)].filter(Boolean).join(' · ');
  return `<button type="button" class="ref-book" data-work="${esc(w.id)}">
    <span class="cover">${face}</span>
    <span class="ref-t"><b>${esc(workTitle(w))}</b>${by ? `<small>${esc(by)}</small>` : ''}</span>
    <span class="ref-go" aria-hidden="true">›</span>
  </button>`;
}
const workTitle = w => (lang === 'zh' && w.title && (!w.title.zh || w.title.zh === w.title.en) && FEATURED_ZH[w.id])
  ? FEATURED_ZH[w.id] : L(w.title);
function bookCard(w){
  return `<button class="card book-card" data-work="${esc(w.id)}">
    <div class="cover">${w.image && w.image.file
      ? `<img src="${IMG}${esc(w.image.file)}" alt="" ${lazy(IMG + w.image.file)}>`
      : `<span>${esc(workTitle(w))}</span>`}</div>
    <div><h4>${esc(workTitle(w))}</h4>${subTitle(FEATURED_ORIG[w.id], workTitle(w), w.title.en, 'p')}<p class="by">${esc(L(w.author))}</p></div>
    <p>${esc(L(w.why))}</p>
  </button>`;
}

/* --- Answers ------------------------------------------------------------- */
/* One passage, drawn at random, from the same bundle the threads use. The
   reader never types the question, so the page cannot pretend to have read
   it — and says so. */
let drawn = null, bookOpen = false;
/* The Book of Answers' passages (assets/answers.json, built by
   Tools/build-answers.py): exact public-domain words from the library
   thinkers, each with its source and a one-line context note. Empty if the
   file is missing; the book then falls back to the thread passages. */
let ANSWERS = [];
/* The book is a strict toggle: one click, one flip. While a flip runs,
   clicks, taps and keys are ignored; the state changes once, when it
   lands. Opening draws a fresh passage first, under the shut cover. */
let BOOK_BUSY = false, BOOK_CLOSING = false, BOOK_FLIPPING = false;
let SCROLL_SEEN = { id: null, n: 0 };
let FOOT_RO = null;
window.addEventListener('resize', () => StillFlip.measure(document.getElementById('book')));
function toggleBook(){
  if(BOOK_BUSY) return;
  BOOK_BUSY = true;
  const opening = !bookOpen;
  if(opening){ draw(); render(); }
  const el = document.getElementById('book');
  const land = () => {
    BOOK_FLIPPING = false;
    bookOpen = opening; BOOK_CLOSING = !opening; render();
    // The cover's return plays once, then the flag clears.
    setTimeout(() => { BOOK_CLOSING = false; BOOK_BUSY = false; }, opening ? 0 : StillFlip.returnMs());
  };
  if(el){ BOOK_FLIPPING = true; StillFlip.run(el, opening, land); } else land();
}
/* The pages turned past are real passages from the same sourced bundle,
   in the reader's language: none repeated, none the one it lands on.
   Long ones are cut at a word with an ellipsis; the last page is whole. */
function riffleQuotes(last){
  const pool = (ANSWERS.length ? ANSWERS : quotable()).filter(x => x !== last);
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const cut = (q, n) => { q = String(q || '');
    if(q.length <= n) return q;
    const s = q.slice(0, n), sp = lang === 'zh' ? s.length : s.lastIndexOf(' ');
    return s.slice(0, sp > n * 0.6 ? sp : n).replace(/[\s,;:.—-]+$/, '') + '…'; };
  return pool.slice(0, StillFlip.count()).map(x => {
    const P = passageOf(x);
    return { text: cut(P.text, lang === 'zh' && !P.enOnly ? 48 : 120), name: P.name };
  });
}

/* Library thinkers the Book of Answers quotes who are not on the roster
   (Addams, Croce, Gilman, Godwin, Santayana, Spencer). The agent reads their
   texts, so they join the chat roster — Pro, chosen in the picker, opened
   from the book — but not Explore, which has no page for them yet. */
const LIBRARY_ZH = { addams: '简·亚当斯', croce: '贝内德托·克罗齐', gilman: '夏洛特·珀金斯·吉尔曼',
                     godwin: '威廉·葛德文', santayana: '乔治·桑塔亚那', spencer: '赫伯特·斯宾塞' };
function addLibraryThinkers(list){
  const seen = new Set(Object.values(AGENT_IDS));
  for(const e of ANSWERS){
    if(seen.has(e.thinker)) continue;
    seen.add(e.thinker);
    const id = 'p-' + e.name.toLowerCase().normalize('NFD').replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
    if(list.some(p => p.id === id)) { AGENT_IDS[id] = e.thinker; continue; }
    list.push({ id, name: e.name, nameZh: LIBRARY_ZH[e.thinker] || null, rank: null, tier: 'pro',
                voiceId: null, image: null, quotes: [], libraryOnly: true });
    AGENT_IDS[id] = e.thinker;
  }
}
/* The roster person behind an agent thinker id (adam_smith -> p-adam-smith). */
function philByAgent(a){
  const id = Object.keys(AGENT_IDS).find(k => AGENT_IDS[k] === a);
  return id ? philById(id) : null;
}
/* What the book shows, in one shape for both sources. A pool passage has no
   Chinese yet: in zh the English is shown and labelled as the English. */
/* The Book of Answers passage a chat was opened from, in the shape
   /v1/ask takes: {quote, work, passageId, author}. The agent finds the
   passage in the thinker's own index (by id, else by its words); the quote
   text is never used as evidence by itself. */
function askContext(r, P){
  if(!r || !P) return null;
  if(r.pool){
    const m = String(r.id || '').match(/^ap-([^-]+)-([^-]+)-mvp-(\d+)/);
    return { quote: r.en, work: r.work || '', author: r.name || '',
             passageId: m ? `${m[1]}:${m[2]}:mvp:${m[3]}` : '' };
  }
  return { quote: (P.quote && (P.quote.en || L(P.quote))) || '', work: '', author: P.name || '', passageId: '' };
}
function passageOf(r){
  if(!r) return null;
  if(r.pool){
    const p = philByAgent(r.thinker);
    const where = [r.work, r.locator].filter(Boolean).join(', ');
    return { text: lang === 'zh' && r.zh ? r.zh : r.en, enOnly: lang === 'zh' && !r.zh,
      quote: { en: r.en, zh: r.zh || r.en },
      name: p ? pn(p) : r.name, phil: p, voice: p && p.voiceId ? byId(C.voices, p.voiceId) : null,
      context: r.context, where, approx: !!r.locatorApprox, translator: r.translator,
      source: { label: { en: `${r.name}, ${where}${r.translator ? `, trans. ${r.translator}` : ''}`,
                         zh: `${r.name}，${where}${r.translator ? `，译者 ${r.translator}` : ''}` } } };
  }
  const v = byId(C.voices, r.voiceId);
  return { text: L(r.quote), enOnly: false, quote: r.quote, name: v ? fullName(v) : '', phil: chatTarget(v), voice: v,
    response: r, source: r.source };
}

function quotable(){
  return C.responses.filter(r => !r.draft && r.quote && L(r.quote) && r.source && r.source.label);
}
let INTERP_OPEN = false;
/* The person behind a voice who can be talked to: a roster entry for a
   thread voice that is a person. Texts, schools and communities have no
   chat persona, so no button. */
function chatTarget(v){
  if(!v || v.type !== 'person') return null;
  return PHIL.find(p => p.voiceId === v.id) || null;
}
function draw(){
  INTERP_OPEN = false;
  const pool = ANSWERS.length ? ANSWERS : quotable();
  drawn = pool[Math.floor(Math.random() * pool.length)] || null;
}

/* A voice's full name: the roster's (Hume → David Hume), else its
   Wikipedia title for a person, else the voice's own name (texts, schools). */
/* The Still book a reply's source line quotes, if it is one: a work of this
   voice (listed on it, or by the same author) whose title the source names.
   The longest title wins. Same rule as the app's ContentStore.quotedWork. */
function quotedWork(label, v){
  const source = String((label && label.en) || '').toLowerCase();
  const author = String((v && v.name && v.name.en) || '').toLowerCase();
  return (C.works || [])
    .filter(w => (v.workIds || []).includes(w.id) || String((w.author && w.author.en) || '').toLowerCase().includes(author))
    .filter(w => w.title && w.title.en && source.includes(w.title.en.toLowerCase()))
    .sort((a, b) => b.title.en.length - a.title.en.length)[0] || null;
}
function fullName(v){
  if(!v) return '';
  const p = PHIL.find(x => x.voiceId === v.id);
  if(p) return pn(p);
  if(v.type === 'person' && v.wiki && lang !== 'zh') return v.wiki.replace(/_/g, ' ').replace(/ \(.*\)$/, '');
  return L(v.name);
}
function answersView(){
  if(!drawn) draw();
  const r = drawn;
  const P = passageOf(r);
  const v = P && P.voice;
  const q = r && !r.pool ? byId(C.questions, r.questionId) : null;

  // A thick book on grass. Shut, its cover carries the title and the
  // prompt; opening it riffles through many pages to the last one, where
  // the passage is. The pages turned past are real passages too.
  const pages = riffleQuotes(r);
  // In the Interpretation sheet: the author's own chat, the passage as its
  // context (the same as "Chat with …" under the passage), and the authored
  // interpretation when the content carries one — never generated here.
  const readChat = `<button type="button" class="fpill read-chat" data-chat-from-book="1">${t('Chat','聊聊')}</button>`;
  const iv = r && r.interpretation;
  const ivText = !iv ? '' : typeof iv === 'string' ? iv : (lang === 'zh' && iv.zh ? iv.zh : iv.en || '');
  const interp = ivText ? `<div class="grp">
          <p class="label label--sm">${t('Our reading','我们的解读')}</p>
          <p>${esc(ivText)}</p>
        </div>` : '';
  return `<div class="page page--answers"><div class="ans">
    ${StillFlip.bookHTML({ open: bookOpen, esc, pages,
      attrs: `id="book" role="button" tabindex="0" aria-label="${bookOpen ? t('Tap to close','轻点合上') : t('Open the book','翻开这本书')}"`,
      title: t('Book of<br>Answers','答案<br>之书'), cta: t('Hold a question in mind<br>then flip it','心里想着一个问题<br>然后翻开它'),
      final: `
        <div class="leaf-text${(P ? P.text : '').length > (lang === 'zh' && !(P && P.enOnly) ? 90 : 220) ? ' long' : ''}">
          ${P && P.enOnly ? `<p class="en-orig">英文原文</p>` : ''}
          <p class="passage"${P && P.enOnly ? ' lang="en"' : ''}>“${esc(P ? P.text : '')}”</p>
          <p class="attrib">— ${P ? (P.phil && !P.phil.libraryOnly
            ? `<a href="#" class="linkish" ${P.phil.voiceId ? `data-voice="${esc(P.phil.voiceId)}"` : `data-phil="${esc(P.phil.id)}"`}>${esc(P.name)}</a>`
            : v ? `<a href="#" class="linkish" data-voice="${esc(v.id)}">${esc(P.name)}</a>` : esc(P.name)) : ''}</p>
        </div>
        ${`<div class="leaf-acts">
          <button type="button" class="linkish" data-interp="1" aria-expanded="${INTERP_OPEN}"
            aria-controls="reading">${t('Interpretation','解读')}</button>
          <button type="button" class="linkish" data-chat-from-book="1">${P && P.phil
            ? t(`Chat with ${esc(pn(P.phil))}`, `和${esc(pn(P.phil))}聊聊`)
            : t('Start a chat', '开始聊天')}</button>
        </div>`}` })}

    ${bookOpen ? `
      ${INTERP_OPEN ? `<section class="reading" id="reading">
        <p class="label" style="text-align:center;margin:0">${t('Interpretation','解读')}</p>
        ${r.pool ? `
        ${P.phil ? `<div class="who">${castAvatar(P.phil)}
          <div><b>${esc(P.name)}</b><span>${esc(r.work)}</span></div>${readChat}</div>` : `<div class="who"><div><b>${esc(P.name)}</b><span>${esc(r.work)}</span></div></div>`}
        ${interp}

          <p>${esc(r.context)}</p>

        </div>

          <p>${r.translator ? t(`Translated by ${esc(r.translator)}. `, `译者：${esc(r.translator)}。`) : ''}${t('Public domain.','公有领域。')}</p>
        </div>` : `

            style="font-size:12px;color:var(--ink-secondary);word-break:break-all">${esc(r.source.url)}</a></p>`:''}
        </div>`}
      </section>` : ''}` : `
      `}
  </div></div>`;
}

// MARK: - Group chat

// The philosophers here are a model writing in their manner. That is the one
// thing this app refuses to let anyone mistake, so every generated line is
// tagged SIMULATED, and the passages they actually wrote appear in a separate
// block, in the thread's quote styling, with the source. The two never share
// a shape.

const philById = id => PHIL.find(p => p.id === id);
/* A person's name in the reader's language: the roster's Chinese name in
   zh (curated thread names first, then Wikidata), else the English. */
const pn = p => (lang === 'zh' && p && p.nameZh) ? p.nameZh : ((p && p.name) || '');

function linkAvatar(p, cls){
  if(!p || !p.id) return castAvatar(p, cls);
  return `<button class="avlink" data-phil="${esc(p.id)}"
                  aria-label="${esc(p.name || '')}">${castAvatar(p, cls)}</button>`;
}

function castAvatar(p, cls){
  const img = p.image ? `<img src="${IMG}${esc(p.image)}" alt="" ${lazy(IMG + p.image)}>` : esc(initial(p.name));
  return `<div class="av ${cls||''}">${img}</div>`;
}

/* The shape of a chat app: a list of conversations, and the one you have
   open. Below 900px you see one or the other; above it, both at once, which
   is what the two-pane layout in every desktop messenger does. */

const convo = () => chat.convos.find(c => c.id === chat.open) || null;

function convoTitle(c){
  const names = (c.cast || []).map(id => pn(philById(id))).filter(Boolean);
  if(!names.length) return t('Empty conversation','空对话');
  if(names.length <= 2) return names.join(t(' and ',' 与 '));
  return names.slice(0,2).join(', ') + t(` and ${names.length-2} more`, ` 等 ${names.length} 人`);
}

function whenLabel(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if(days < 1 && d.getDate() === now.getDate())
    return d.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US',
      {hour:'numeric', minute:'2-digit'});
  if(days < 7) return t(`${Math.max(1,days)}d`, `${Math.max(1,days)} 天`);
  return d.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-GB',
    {day:'numeric', month:'short'});
}

/* Seeded once, tracked by a flag rather than by the list being empty. Gating
   on emptiness meant anyone who had already opened the tab — which is anyone
   who had tried it at all — never saw them. Existing conversations are added
   to, never replaced. */
function seedExamples(){
  if(chat.seeded || !PHIL.length) return;
  chat.seeded = true;
  const now = Date.now();
  EXAMPLES.forEach((ex, n) => {
    const cast = ex.cast.filter(id => philById(id));
    if(cast.length !== ex.cast.length) return;   // roster changed; skip quietly
    const at = now - ex.hours * 3600000;
    let step = 0;
    const msgs = ex.turns.map(turn => {
      step += 90000;
      if(turn.mine) return {mine:true, text: L({en:turn.en, zh:turn.zh}), at: at + step};
      const p = philById(turn.who);
      return { id:p.id, name:p.name, at: at + step,
               text: L({en:turn.en, zh:turn.zh}),
               commitment: L(turn.commit), bridge: L(turn.bridge),
               said: p.quotes[turn.q] || null };
    });
    chat.convos.push({ id:'ex' + n, cast, msgs, said:{}, at: at + step, example:true });
  });
  if(!chat.open && chat.convos.length) chat.open = chat.convos
    .slice().sort((x,y) => (y.at||0) - (x.at||0))[0].id;
  save();
}

/* A conversation's name: what the reader renamed it to, else the first
   thing they asked, else "New conversation". Who is in it goes on the
   second line. */
function convoName(c){
  if(c.title) return c.title;
  const first = c.msgs.find(m => m.mine);
  return first ? shortTitle(first.text) : t('New conversation','新对话');
}
/* No model is asked for this: a model-written summary would need its own
   call to the agent. Until then, the gist of the first message. */
function shortTitle(text){
  let s = String(text).trim().split(/(?<=[.?!。？！])\s/)[0];
  const lead = /^(so|well|ok|okay|hey|hi|hello|please|honestly|i('m| am) (curious|wondering) (about|whether|if)|i want to (talk|know|ask) about|can we talk about|let'?s talk about|tell me about|what do you (all |both )?think (about|of)|do you (all |both )?think( that)?)[,\s]+/i;
  for(let k = 0; k < 3 && lead.test(s); k++) s = s.replace(lead, '');
  s = s.replace(/[\s?.!。？！]+$/, '');
  if(s.length > 44) s = s.slice(0, 44).replace(/\s+\S*$/, '') + '…';
  return s ? s[0].toUpperCase() + s.slice(1) : t('New conversation','新对话');
}
const CROW = { menu: null, renaming: null, confirm: null };
/* Swipe a row left on a touch screen to show More and Delete, as in Mail.
   One row open at a time; swipe back, or tap anywhere else, to close.
   The "…" stays in the page for VoiceOver and keyboards (visually hidden
   on touch), and a long press opens the same menu. */
const ROWSWIPE = { open: null };
const SWIPE_W = 168;
(function(){
  if(!matchMedia('(pointer: coarse)').matches) return;
  let row = null, slide = null, x0 = 0, y0 = 0, dx = 0, base = 0, axis = null, hold = null;
  document.addEventListener('touchstart', ev => {
    const r = ev.target.closest && ev.target.closest('.crow[data-crow]');
    if(!r || ev.target.closest('.crow-acts,.crow-menu,.crow-rename')) return;
    row = r; slide = r.querySelector('.crow-slide'); if(!slide) { row = null; return; }
    x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; axis = null;
    base = r.classList.contains('swiped') ? -SWIPE_W : 0;
    clearTimeout(hold);
    hold = setTimeout(() => {           // long press: the options menu
      if(axis || !row) return;
      const id = row.dataset.crow; row = null;
      ROWSWIPE.open = null; CROW.menu = id; CROW.confirm = null; HOLD_FIRED = Date.now(); render();
      if(navigator.vibrate) navigator.vibrate(8);
    }, 520);
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if(!row) return;
    const mx = ev.touches[0].clientX - x0, my = ev.touches[0].clientY - y0;
    if(!axis && Math.hypot(mx, my) > 8) { axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; clearTimeout(hold); }
    if(axis !== 'x') return;
    ev.preventDefault();
    dx = mx;
    const at = Math.max(-SWIPE_W - 24, Math.min(0, base + dx));
    slide.style.transition = 'none'; slide.style.transform = `translateX(${at}px)`;
    row.classList.add('dragging');
  }, { passive: false });
  const end = () => {
    clearTimeout(hold);
    if(!row) return;
    const r = row, sl = slide; row = slide = null;
    if(axis !== 'x') return;
    const at = base + dx;
    sl.style.transition = ''; sl.style.transform = '';
    r.classList.remove('dragging');
    SWIPE_FIRED = Date.now();
    const id = r.dataset.crow;
    const hadMenu = CROW.menu, hadConfirm = CROW.confirm;
    ROWSWIPE.open = at < -SWIPE_W / 2.5 ? id : null;
    if(ROWSWIPE.open !== id) CROW.confirm = null;
    CROW.menu = null;
    // Only the row moves (B34): a full render rebuilt the whole page on
    // every swipe, which blinked it, and the new row jumped to its place
    // instead of sliding there. Render only if a menu or a confirm closed.
    if(hadMenu || hadConfirm !== CROW.confirm) render(); else syncRowSwipe();
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();
let SWIPE_FIRED = 0, HOLD_FIRED = 0;
/* Show ROWSWIPE.open on the rows already in the page, without a render. */
function syncRowSwipe(){
  document.querySelectorAll('.crow[data-crow]').forEach(r => {
    const on = r.dataset.crow === ROWSWIPE.open;
    r.classList.toggle('swiped', on);
    const acts = r.querySelector('.crow-acts');
    if(acts){ if(on) acts.removeAttribute('aria-hidden'); else acts.setAttribute('aria-hidden', 'true'); }
  });
}

}

/* Dictation goes through the agent: the clip is sent to Groq Whisper at
   /v1/transcribe and the text lands in the box; the reader still presses
   Send. Never the browser's own recognition (in Chrome that is Google).
   Until /v1/health reports transcribe, and where the browser cannot
   record, there is no mic at all. Recording arrives with that endpoint. */
const MIC = { state: 'idle', firstNote: false, noted: false, error: '',
              rec: null, stream: null, chunks: [], started: 0, tick: null, stopAt: null };
function micAvailable(){
  const tr = AGENT_INFO && AGENT_INFO.transcribe;
  return AGENT_STATE === 'ok' && !!(tr && tr.available)
    && typeof MediaRecorder !== 'undefined'
    && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function micButton(enabled){
  if(!micAvailable()) return '';
  const rec = MIC.state === 'recording', busy = MIC.state === 'transcribing';
  return `<button type="button" class="mic${rec ? ' on' : ''}${busy ? ' busy' : ''}" data-mic="1"
            aria-pressed="${rec ? 'true' : 'false'}" ${enabled && !busy ? '' : 'disabled'}
            aria-label="${rec ? t('Stop dictation','停止听写')
                        : busy ? t('Turning speech into text','正在转成文字')
                        : t('Start dictation','开始听写')}">
      ${busy ? '<i class="spin" aria-hidden="true"></i>' : `<svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/>
           <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>`}
    </button>`;
}
/* The small line under the box while dictating: the elapsed time, the
   one-time note on where the voice goes, or what went wrong. */
function micLine(){
  const bits = [];
  if(MIC.state === 'recording')
    bits.push(`<span class="mic-time" id="mic-time">${micClock()}</span>`);
  if(MIC.state === 'transcribing') bits.push(t('Turning it into text…','正在转成文字…'));
  if(MIC.firstNote && MIC.state !== 'idle')
    bits.push(t("Your voice is sent to Groq to turn it into text. It isn't stored.",
                '你的语音会发送给 Groq 转成文字，不会被保存。'));
  if(MIC.state === 'idle' && MIC.error) bits.push(`<span class="mic-err">${esc(MIC.error)}</span>`);
  return bits.length ? `<span class="mic-note" role="status">${bits.join(' · ')}</span>` : '';
}
function micClock(){
  const s2 = Math.floor((Date.now() - MIC.started) / 1000);
  return `${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')}`;
}
function micMime(){
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
/* Tap: record. Tap again, or the agent's limit (60 s), stops it; the clip
   goes to the agent's /v1/transcribe (Groq Whisper) and the text is added
   to the box. Sending stays the reader's own tap. The browser asks for the
   microphone on the first tap only. */
async function toggleMic(){
  if(MIC.state === 'transcribing') return;
  if(MIC.state === 'recording'){ micStop(); return; }
  MIC.error = '';
  if(!MIC.noted){ MIC.noted = true; MIC.firstNote = true; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){
    MIC.error = t('The microphone is blocked for this page.','此页面无法使用麦克风。');
    MIC.firstNote = false; return render();
  }
  const mime = micMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  MIC.stream = stream; MIC.rec = rec; MIC.chunks = [];
  rec.ondataavailable = ev => { if(ev.data && ev.data.size) MIC.chunks.push(ev.data); };
  rec.onstop = micSend;
  rec.start();
  MIC.state = 'recording'; MIC.started = Date.now();
  const max = ((AGENT_INFO.transcribe || {}).max_seconds || 60) * 1000;
  MIC.stopAt = setTimeout(micStop, max - 250);
  MIC.tick = setInterval(() => {
    const el = document.getElementById('mic-time'); if(el) el.textContent = micClock();
  }, 500);
  render();
}
function micStop(){
  clearTimeout(MIC.stopAt); clearInterval(MIC.tick);
  if(MIC.rec && MIC.rec.state !== 'inactive') MIC.rec.stop();
  if(MIC.stream) MIC.stream.getTracks().forEach(tr => tr.stop());
}
async function micSend(){
  const seconds = Math.min(60, (Date.now() - MIC.started) / 1000);
  const type = ((MIC.rec && MIC.rec.mimeType) || 'audio/webm').split(';')[0];
  const blob = new Blob(MIC.chunks, { type });
  MIC.rec = null; MIC.stream = null; MIC.chunks = [];
  MIC.state = 'transcribing'; render();
  let text = '', err = '';
  try{
    const r = await fetch(`${AGENT_URL}/v1/transcribe?language=${lang === 'zh' ? 'zh' : 'en'}`, {
      method: 'POST', body: blob,
      headers: agentHeaders({ 'content-type': type, 'x-audio-seconds': seconds.toFixed(1) }) });
    const body = await r.json().catch(() => ({}));
    if(r.status === 401){
      const b = body || {};
      if(b.status === 'access_required'){ accessRequired(b.reason);
        err = t('Voice needs an access code.', '语音需要访问码。'); }
      else { keyRejected(); err = t("That code didn't work.", '这个访问码不对。'); }
    }
    else if(r.status === 429) err = t("Today's voice limit is used up.", '今天的语音额度已用完。');
    else if(!r.ok) err = t("Couldn't hear that, try again.", '没听清，请再试一次。');
    else text = String(body.text || '').trim();
    if(r.ok && !text) err = t("Couldn't hear that, try again.", '没听清，请再试一次。');
  }catch(e){ err = t("Couldn't hear that, try again.", '没听清，请再试一次。'); }
  MIC.state = 'idle'; MIC.firstNote = false; MIC.error = err;
  if(text){
    // render() reads the draft back from the box, so the box gets it too.
    const box = document.getElementById('say');
    const was = (box ? box.value : chat.draft || '').replace(/\s*$/, '');
    chat.draft = was + (was ? ' ' : '') + text;
    if(box) box.value = chat.draft;
  }
  render(); refreshAgentInfo();
  setTimeout(() => { const el = document.getElementById('say');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); syncSend(); } });
}
/* Send is disabled while the field is empty, without re-rendering on every key. */
function syncSend(){
  const box = document.getElementById('say');
  const btn = document.querySelector('.composer .send[type="submit"]');
  if(box && btn) btn.disabled = !box.value.trim() || box.disabled;
}

const clock = ts => { const d = new Date(ts || Date.now());
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0'); };

function msgRow(m, i, c){
  // Same speaker twice running reads as one turn.
  const prev = c.msgs[i-1], next = c.msgs[i+1];
  const cont = prev && !!prev.mine === !!m.mine && prev.id === m.id ? ' cont' : '';
  const last = !(next && !!next.mine === !!m.mine && next.id === m.id);

  if(m.mine) return `<article class="msg mine${cont}">
      <div class="msg-body">
        <div class="bubble">${esc(m.text)}</div>
        ${last ? `<span class="stamp">${clock(m.at)}</span>` : ''}
      </div>
    </article>`;

  if(m.context) return `<div class="ctx-card said">
      <span class="tag">${t('From the Book of Answers','出自答案之书')}</span>
      <q>${esc(L(m.quote))}</q>
      <span class="src">— ${m.source && m.source.url
        ? `<a href="${esc(m.source.url)}" target="_blank" rel="noopener">${esc(L(m.source.label))}</a>`
        : esc(L(m.source && m.source.label))}</span></div>`;
  // The interface speaking (stopped, busy, no passage…), not a thinker:
  // a plain centred line, never labelled Simulated.
  if(!m.id) return `<p class="sysline">${esc(m.text)}${
    last ? ` <span>· ${clock(m.at)}</span>` : ''}</p>${(m.suggest || []).length
    ? `<div class="sys-sugg">${m.suggest.map(id => philById(id)).filter(Boolean).map(p =>
        `<button type="button" class="fpill" data-chat-with="${esc(p.id)}">${
          t(`Chat with ${esc(pn(p))}`, `和${esc(pn(p))}聊聊`)}</button>`).join('')}</div>` : ''}`;

  const p = philById(m.id) || {name:m.name, image:null};
  const q = m.said;
  if(m.agent) return agentRow(m, p, cont, last);
  return `<article class="msg${cont}" data-k="${esc(msgKey(m))}">
    <div class="msg-body">
      <div class="msg-head">${linkAvatar(p)}<b>${esc(pn(p))}</b></div>
      <div class="bubble">${paras(m.text)}</div>
      ${q ? `<details class="said-fold"${FOLD_OPEN.has(msgKey(m)) ? ' open' : ''}>
        <summary><span>${t('Sources','来源')} · 1</span>${FOLD_CHEV}</summary>
        <div class="said">
        <span class="tag">${t('What he actually wrote','他真正写下的')}</span>
        <q>${esc(L(q.text))}</q>

          ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(L(q.label))}</a>`
          : esc(L(q.label))}</span>

}

/* While a thinker is "thinking": a few loose stages by elapsed time, not a
   readout of the method. It says what kind of work is happening, never
   which texts, models or steps. */
let TYPING_ID = null, TYPING_START = 0;
function loadingStage(name){
  if(chat.typing !== TYPING_ID){ TYPING_ID = chat.typing; TYPING_START = Date.now(); }
  const s = (Date.now() - TYPING_START) / 1000;
  return s < 1.2 ? t(`Reading ${name}…`, `正在读${name}…`)
       : s < 3.5 ? t('Finding what bears on this…', '正在找相关的部分…')
       : t('Writing…', '正在写…');
}
setInterval(() => {
  const el = document.querySelector('.loading .stage');
  if(!el || !chat.typing) return;
  const name = (philById(chat.typing) || {}).name || '';
  const next = loadingStage(name);
  if(el.textContent !== next) el.textContent = next;
}, 300);

/* A new reply types itself in, word by word, quickly: never more than
   about 1.4 s however long it is. Re-renders mid-way continue from where
   it was (negative delays), so it never restarts or pops. The labels and
   actions arrive when the text is done. */
const FRESH = new Map();   // message key -> time it arrived
function markFresh(m){ FRESH.set(msgKey(m), Date.now()); }
function revealFresh(){
  if(!FRESH.size) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ FRESH.clear(); return; }
  for(const [key, start] of FRESH){
    const art = document.querySelector(`[data-k="${CSS.escape(key)}"]`);
    if(!art) continue;
    const bubble = art.querySelector('.bubble'); if(!bubble) continue;
    const nodes = [];
    const walk = n => { for(const c of [...n.childNodes]){
      if(c.nodeType === 3 && c.textContent.trim()) nodes.push(c);
      else if(c.nodeType === 1) walk(c); } };
    walk(bubble);
    const words = nodes.reduce((n, x) => n + x.textContent.split(/(\s+)/).filter(w => w.trim()).length, 0);
    const step = Math.max(10, Math.min(35, 1400 / Math.max(1, words)));
    const elapsed = Date.now() - start;
    let i = 0;
    for(const node of nodes){
      const frag = document.createDocumentFragment();
      for(const w of node.textContent.split(/(\s+)/)){
        if(!w) continue;
        if(!w.trim()){ frag.appendChild(document.createTextNode(w)); continue; }
        const s = document.createElement('span');
        s.className = 'w'; s.textContent = w;
        s.style.animationDelay = (i++ * step - elapsed) + 'ms';
        frag.appendChild(s);
      }
      node.replaceWith(frag);
    }
    const total = words * step;
    // Quote rules, quote marks drawn by CSS (q, blockquote), reference
    // numbers: every element inside the reply waits for its own first word,
    // so the whole reply types in top to bottom (founder).
    bubble.querySelectorAll('*:not(.w)').forEach(el => {
      const first = el.querySelector('.w');
      el.classList.add('wb');
      el.style.animationDelay = first ? first.style.animationDelay : (total - elapsed) + 'ms';
    });
    art.querySelectorAll('.msg-foot,.msg-acts,.said,.said-more,.said-fold,.vblock footer').forEach(x => {
      x.classList.add('after'); x.style.animationDelay = (total - elapsed) + 'ms'; });
    if(elapsed > total + 400) FRESH.delete(key);
  }
}

/* A reply's text as paragraphs: blank lines separate them. */
function paras(text){
  return String(text || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
    .map(x => `<p>${esc(x)}</p>`).join('') || '<p></p>';
}

/* Every reply ends with one plain line: the time (on the last of a run),

function replyLabels(m){

  return [
    t('Simulated','模拟'),
    t('Agent','代理') + (a.model ? ' · ' + esc(shortModel(a.model)) : ''),

/* Reactions stay on this device, like every other piece of user state. */
const msgKey = m => `${m.at}:${m.id}`;
let REACT = (() => { try{ return JSON.parse(localStorage.getItem('still.reactions') || '{}'); }catch(e){ return {}; } })();
let SHARED = null;
function msgByKey(key){
  const c = convo(); return c ? c.msgs.find(m => msgKey(m) === key) : null;
}
/* A shared reply carries its label with it: out of the conversation, it
   must still say it is simulated and who wrote it. Only verified spans keep
   quotation marks, as in the chat. */
/* A reply as plain text, paragraphs kept: what Copy, Read aloud and
   feedback carry. Verified spans keep their quotation marks. */
function replyPlain(m){
  if(!m.agent) return String(m.text || '').trim();
  const tmp = document.createElement('div');
  tmp.innerHTML = agentBubble(m.agent, m.text);
  tmp.querySelectorAll('q').forEach(q => { q.textContent = '“' + q.textContent + '”'; });
  tmp.querySelectorAll('sup').forEach(s => s.remove());
  return [...tmp.querySelectorAll('p')].map(x => x.textContent.trim()).filter(Boolean).join('\n\n');
}
let COPIED = null;
async function copyReply(key){
  const m = msgByKey(key); if(!m) return;
  try{ await navigator.clipboard.writeText(replyPlain(m)); }catch(e){ return; }
  COPIED = key; render();
  setTimeout(() => { if(COPIED === key){ COPIED = null; render(); } }, 1600);
}
/* Read aloud: the browser's own voice, in the reply's language. Tapping
   again, or another reply, stops it. */
let SPEAKING = null;
function speakReply(key){
  const synth = window.speechSynthesis; if(!synth) return;
  const was = SPEAKING;
  synth.cancel(); SPEAKING = null;
  if(was === key){ render(); return; }
  const m = msgByKey(key); if(!m) return render();
  const text = replyPlain(m);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = questionLang(text) === 'zh' ? 'zh-CN' : 'en-US';
  const voice = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(u.lang.slice(0, 2)));
  if(voice) u.voice = voice;
  u.onend = u.onerror = () => { if(SPEAKING === key){ SPEAKING = null; render(); } };
  SPEAKING = key; render();
  synth.speak(u);
}

async function sendFeedback(){
  const f = FEEDBACK; if(!f || f.sending) return;

  const conversation = c.msgs.filter(x => !x.context && (x.mine || x.id)).slice(-40).map(x => ({
    role: x.mine ? 'user' : 'thinker', who: x.mine ? 'Reader' : x.name,
    text: x.mine ? String(x.text || '') : replyPlain(x), at: new Date(x.at).toISOString() }));

    <div class="filters">${FILTERS.filter(([k]) => !only || (k !== 'pro' && k !== 'basic')).map(([k, lab]) =>

    ${mode === 'one' ? '' : `<footer>
      <button class="wide" data-pick-done="1" ${target.length ? '' : 'disabled'}>${
        convo() ? t('Done','完成')
                : t(`Start conversation${target.length ? ' · ' + target.length : ''}`,
                    `开始对话${target.length ? ' · ' + target.length : ''}`)}</button>

  </div>`;
}

/* The agent is on, but nobody in the room has their texts in its library.
   Not "no model": the site works, this thinker just can't answer yet. Offer
   three Pro thinkers as a way on. */
function proSuggestions(not){
  const lib = agentRoster() || agentLibrary();
  return PHIL.filter(p => lib.has(p.id) && !not.includes(p.id))
             .sort((a, b) => (a.rank || 1e9) - (b.rank || 1e9)).slice(0, 3).map(p => p.id);
}
function notInLibrary(c, cast){
  const names = cast.map(p => pn(p));
  const one = names.length === 1;
  const en = one
    ? `${names[0]}'s own writings aren't in Still's library yet, so ${names[0]} can't answer here. Try a thinker marked Pro, whose replies come from their texts.`
    : `${names.join(' and ')}'s own writings aren't in Still's library yet, so they can't answer here. Try a thinker marked Pro, whose replies come from their texts.`;
  const zh = `${names.join('、')}的著作还没有收入 Still 的文库，因此无法在这里回应。试试标为 Pro 的思想家，他们的回复来自其著作。`;
  c.msgs.push({ id:null, name:'—', at: Date.now(), said:null, text: t(en, zh),
                suggest: proSuggestions(cast.map(p => p.id)) });
}

/* A clearly-labelled stand-in for any other room. It deliberately does not
   put a philosophical position in anyone's mouth. */
function demoPlaceholder(p){
  if(AGENT_URL) return {
    en: `The thinkers can't be reached right now, so ${pn(p)} can't answer. Try again in a minute.`,
    zh: `暂时连不上思想家，因此${pn(p)}无法回应。请过一分钟再试。` };
  return { en: `This is where ${pn(p)} would answer. No model is connected to this copy, so there is nothing to generate the reply.`,
           zh: `这里本应是${pn(p)}的回应。此副本未连接模型，因此没有东西来生成这条回复。` };
}

async function demoSpeak(c, cast){
  const key = cast.map(p => p.id).join('|');
  const rounds = DEMO_ROUNDS[key] || [];
  c.demoRound = c.demoRound || 0;
  const round = rounds[c.demoRound];
  c.demoRound++;

  for(const p of cast){
    if(chat.stopped) break;
    const turn = round && round.find(r => r.who === p.id);
    chat.typing = p.id; render();
    const body = turn ? L({en:turn.en, zh:turn.zh}) : L(demoPlaceholder(p));
    await new Promise(r => setTimeout(r, Math.min(2000, 500 + body.length * 8)));
    chat.typing = null;

    let said = null;
    if(turn && p.quotes.length && !c.said[p.id]){
      said = p.quotes[Math.floor(Math.random() * p.quotes.length)];
      c.said[p.id] = 1;
    }
    c.msgs.push({ id:p.id, name:p.name, text:body, said, at: Date.now(), demo:true,
                  commitment: turn ? L(turn.commit) : null,
                  bridge: turn ? L(turn.bridge) : null });
    markFresh(c.msgs[c.msgs.length - 1]);
    c.at = Date.now(); save(); render();
  }
}

async function model(){

// --- The local thinker agent ----------------------------------------------
//
// Agent/ — retrieval over each thinker's approved primary texts, with every
// quotation checked against the passage it came from. Off unless the page is
// opened on this machine with ?agent=1 (or ?agent=http://localhost:PORT), so
// the published page never calls it. The address must be localhost: what the
// reader types goes to the agent on this Mac and nowhere else.

const AGENT_CONSTANT = null;   // e.g. 'http://localhost:8077' to switch it on without the query
/* The public gate: the tester-only route to the agent for the published
   site. Chat there needs the tester passcode; reading, Answers and Explore
   never ask.
   The site and the gate are one Cloudflare Worker (Hosting/README.md, "The
   page's contract"): on still.<sub>.workers.dev the gate is the page's own
   origin, so calls are same-origin with no CORS. Anywhere else (GitHub
   Pages, this Mac) there is no gate.
   The Worker also answers on the custom domain stillasking.app (and www.),
   where the gate is likewise the page's own origin. */
/* Preview versions (`w.sh preview`) are served at <version>-still.<sub>.workers.dev. */
const GATE_HOST = /^(([a-z0-9-]+-)?still\.[a-z0-9-]+\.workers\.dev|(www\.)?stillasking\.app)$/;
const AGENT_GATE = GATE_HOST.test(location.hostname) ? location.origin : null;
const AGENT_DEFAULT = 'http://localhost:8077';
const LOCAL_HOST = /^(localhost|127\.0\.0\.1|\[::1\])$/;
/* A home network: the founder's phone opening the page from the Mac over
   Wi-Fi. Private addresses only (192.168/16, 10/8, 172.16/12), never a
   public host, so the published page still cannot call an agent. */
const PRIVATE_HOST = /^(192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/;
const nearHost = h => LOCAL_HOST.test(h) || PRIVATE_HOST.test(h);
/* Where chat goes: ?agent= when given, else AGENT_CONSTANT, else the gate.
   Only two kinds of address are ever accepted, because the passcode and
   what the reader types go there: an agent on this Mac or the home network
   (when the page itself is opened from one), or the gate itself. A link
   with ?agent=<some other server> cannot point the published page
   anywhere else. */
const AGENT_URL = (() => {
  let v = AGENT_CONSTANT || AGENT_GATE;
  try{
    const q = new URLSearchParams(location.search).get('agent');
    if(q !== null) v = (q === '' || q === '1') ? AGENT_DEFAULT : (q === '0' ? null : q);
  }catch(e){}
  if(!v) return null;
  try{
    const u = new URL(v);
    const base = u.origin + u.pathname.replace(/\/+$/, '');
    if(AGENT_GATE){
      const g = new URL(AGENT_GATE);
      if(u.protocol === 'https:' && u.origin === g.origin) return base;
    }
    return /^https?:$/.test(u.protocol) && nearHost(location.hostname) && nearHost(u.hostname) ? u.origin : null;
  }catch(e){ return null; }
})();
/* The agent's passcode for callers that are not the Mac itself. Never in
   the address (the page server logs every request line, and links get
   shared): asked for in a field when the agent answers 401, kept in this
   browser's storage only, forgettable from "How this works". */
let AGENT_KEY = (() => { try{ return localStorage.getItem('still.agentKey') || ''; }catch(e){ return ''; } })();
let AGENT_NEEDS_KEY = false;
let AGENT_KEY_BAD = false;   // the last access code got a 401

/* --- Chat access ---------------------------------------------------------
   The first AI message is free and asks nothing. Each agent call carries a
   random device id (made here, kept in this browser, tied to nothing else)
   so the gate can count that one free message. When the gate says the free
   message is used, the reply box becomes a request-access card. An access
   code, if someone has one, goes in X-Still-Key. Reading, Answers and
   Explore never ask. */
const DEVICE_ID = (() => {
  try{
    let d = localStorage.getItem('still.deviceId');
    if(!d){
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem('still.deviceId', d);
    }
    return d;
  }catch(e){ return ''; }
})();

  sent: (() => { try{ return localStorage.getItem('still.accessRequested') === '1'; }catch(e){ return false; } })(),

    `<label class="fpill"><input type="radio" name="${source}-${name}" value="${v}" data-acc="${name}"${ACCESS[name] === v ? ' checked' : ''}>${esc(l)}</label>`).join('')}</div>`;
  // One question per step, as the app's stepper: email (with its note),
  // who you are, how you heard, your question, then the two consents.
  const step = ACCESS.step || 0, last = step === ACC_STEPS - 1;
  const opt = `<i>${t('optional','选填')}</i>`;
  const body = step === 0 ? `<label class="acc-f"><span>${t('Email','邮箱')}</span>
        <input type="email" data-acc="email" value="${esc(ACCESS.email)}" autocomplete="email" required>
        <small>${t('We use your email only to send you access.','我们只用你的邮箱来发送访问权限。')}
          <a href="privacy?lang=${lang}" target="_blank" rel="noopener">${t('Privacy','隐私')}</a></small></label>`
    : step === 1 ? `<fieldset class="acc-f"><legend>${t('You are…','你是…')} ${opt}</legend>${opts('role', ACCESS_ROLES())}</fieldset>`
    : step === 2 ? `<fieldset class="acc-f"><legend>${t('How did you hear about Still?','你是怎么知道 Still 的？')} ${opt}</legend>${opts('heard', ACCESS_HEARD())}</fieldset>`
    : step === 3 ? `<label class="acc-f"><span>${t('What question would you ask a thinker?','你想问思想家什么问题？')} ${opt}</span>
        <input type="text" data-acc="question" value="${esc(ACCESS.question)}" maxlength="200"></label>`
    : `<label class="acc-check"><input type="checkbox" data-acc="interview"${ACCESS.interview ? ' checked' : ''}>
        <span>${t("I'm open to a 20-minute video call about how I use Still — thank-you: 3 months of full access.",
          '我愿意参加 20 分钟视频访谈，谈谈我如何使用 Still（感谢：3 个月完整权限）。')}</span></label>
      ${ACCESS.interview ? `<label class="acc-f acc-sub"><span>${t('LinkedIn (optional, helps us schedule)','LinkedIn（可选，方便安排时间）')}</span>
        <input type="url" data-acc="linkedin" value="${esc(ACCESS.linkedin)}" maxlength="200"
          inputmode="url" autocomplete="url" placeholder="linkedin.com/in/…"></label>` : ''}
      <label class="acc-check"><input type="checkbox" data-acc="updates"${ACCESS.updates ? ' checked' : ''}>
        <span>${t('Also send me occasional updates about Still.','也给我发送 Still 的不定期更新。')}</span></label>`;
  const label = ACCESS.sending ? t('Sending…','发送中…')
    : last ? t('Request access','申请访问')
    : step >= 1 && !accAnswered(step) ? t('Skip','跳过') : t('Continue','继续');
  return `<form class="acc-form" data-acc-form="${source}" novalidate>
      <p class="acc-step">${t(`${step + 1} of ${ACC_STEPS}`, `第 ${step + 1} / ${ACC_STEPS} 步`)}</p>
      ${body}
      ${ACCESS.err ? `<p class="key-bad" role="alert">${esc(ACCESS.err)}</p>` : ''}
      <button type="submit" class="acc-go acc-next"${ACCESS.sending ? ' disabled' : ''}>${label}</button>
      ${step > 0 ? `<button type="button" class="acc-back" data-acc-back="1">${t('Back','上一步')}</button>` : ''}
      ${last ? `<p class="acc-note">${t('We save your email, your answers and your country — only to give you access and, if you ticked it, to contact you.',
        '我们保存你的邮箱、回答和所在国家，仅用于发送访问权限，以及在你勾选时联系你。')}</p>` : ''}
    </form>`;
}

/* The access request: POST /v1/access on the gate (Hosting/README.md).
   202 = stored (or already on the list); 400 names the bad field; 429 =
   too many from this network today. With no gate (GitHub Pages, this Mac)
   nothing is sent, and the card says so: it never claims a request went
   through. */
const accessUrl = () => toGate() ? AGENT_URL + '/v1/access' : null;
async function requestAccess(fields){
  const url = accessUrl();
  if(!url) return { ok: false, reason: 'not_configured' };
  const r = await fetch(url, { method: 'POST',
    headers: agentHeaders({ 'content-type': 'application/json' }), body: JSON.stringify(fields) });
  return { ok: r.status === 202 || r.ok, status: r.status, body: await r.json().catch(() => null) };
}
const LINKEDIN = /^(https:\/\/)?(www\.)?linkedin\.com\/\S+$/i;
async function submitAccess(source){
  const email = ACCESS.email.trim();
  const li = ACCESS.interview ? ACCESS.linkedin.trim() : '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    ACCESS.err = t('Please enter a valid email.', '请输入有效的邮箱。'); return render();
  }
  if(li && (li.length > 200 || !LINKEDIN.test(li))){
    ACCESS.err = t('That LinkedIn link should start with linkedin.com.', 'LinkedIn 链接应以 linkedin.com 开头。'); return render();
  }
  const c = convo();
  const first = c && c.cast && c.cast[0];
  ACCESS.sending = true; ACCESS.err = ''; render();
  let res;
  try{
    res = await requestAccess({ email, role: ACCESS.role || null, heard_from: ACCESS.heard || null,
      question: ACCESS.question.trim().slice(0, 200) || null,
      interview_ok: !!ACCESS.interview, linkedin: li || null, updates_ok: !!ACCESS.updates,
      lang: lang === 'zh' ? 'zh' : 'en', thinker: source === 'chat_limit' && first ? (AGENT_IDS[first] || first) : null,
      device_id: DEVICE_ID, source });
  }catch(e){ res = { ok: false }; }
  ACCESS.sending = false;
  if(res.ok){
    ACCESS.sent = true;
    try{ localStorage.setItem('still.accessRequested', '1'); }catch(e){}
  }else if(res.reason === 'not_configured'){
    ACCESS.err = t("Requests aren't open on this page.", '此页面暂不接受申请。');
  }else if(res.status === 400 && res.body && res.body.field){
    const f = res.body.field;
    ACCESS.err = f === 'email' ? t('Please check your email.', '请检查邮箱。')
      : f === 'linkedin' ? t('That LinkedIn link should start with linkedin.com.', 'LinkedIn 链接应以 linkedin.com 开头。')
      : t('Please check the form.', '请检查表单。');
  }else if(res.status === 429){
    ACCESS.err = t('Too many requests from this network today. Please try tomorrow.', '今天来自这个网络的申请太多，请明天再试。');
  }else ACCESS.err = t("That didn't go through. Please try again.", '没有发送成功，请再试一次。');
  render();
}function setAgentKey(k){
  AGENT_KEY = k || '';
  try{ k ? localStorage.setItem('still.agentKey', k) : localStorage.removeItem('still.agentKey'); }catch(e){}
}
/* The device id goes to the gate only: it is what counts the free message
   there. The local agent's CORS allows content-type, x-audio-seconds and
   x-still-key, and any other header would fail its preflight. */
const toGate = () => { try{ return !!AGENT_GATE && !!AGENT_URL && new URL(AGENT_URL).origin === new URL(AGENT_GATE).origin; }catch(e){ return false; } };
const agentHeaders = extra => Object.assign({}, extra,
  DEVICE_ID && toGate() ? { 'x-still-device': DEVICE_ID } : {},
  AGENT_KEY ? { 'x-still-key': AGENT_KEY } : {},
  AUTH.session ? { authorization: 'Bearer ' + AUTH.session } : {});

/* --- Sign in with Google (B42) -------------------------------------------
   Google Identity Services gives this page an ID token; the gate's
   /v1/auth/google turns it into a Still session, kept in this browser and
   sent as a Bearer token with every agent request. Signing in sends your
   Google email and name to Still, and the Me page says so. Nothing here
   shows until the founder fills in the client id. */
const GOOGLE_WEB_CLIENT_ID = '122414017379-bhft9q10gps0l00ousuf0o3bbbpbib9u.apps.googleusercontent.com';
const AUTH = (() => {
  try{
    const s = JSON.parse(localStorage.getItem('still.session') || 'null');
    if(s && s.session) return { session: s.session, email: s.email || '', name: s.name || '', busy: false, err: '' };
  }catch(e){}
  return { session: '', email: '', name: '', busy: false, err: '' };
})();
const googleOn = () => !!GOOGLE_WEB_CLIENT_ID && !!AGENT_URL;
function setSession(s){
  const was = AUTH.session;
  AUTH.session = (s && s.session) || ''; AUTH.email = (s && s.email) || ''; AUTH.name = (s && s.name) || '';
  // Signed in or out: an editor's drafts come or go with the session.
  if(was !== AUTH.session) setTimeout(refreshEditor);
  try{ AUTH.session ? localStorage.setItem('still.session', JSON.stringify(
      { session: AUTH.session, email: AUTH.email, name: AUTH.name })) : localStorage.removeItem('still.session'); }catch(e){}
}
async function authPost(path, body){
  const r = await fetch(AGENT_URL + path, { method: 'POST',
    headers: agentHeaders({ 'content-type': 'application/json' }), body: JSON.stringify(body || {}) });
  const out = await r.json().catch(() => null);
  if(!r.ok) throw new Error((out && (out.error || out.status)) || ('auth ' + r.status));
  return out || {};
}
async function googleSignedIn(resp){
  if(!resp || !resp.credential) return;
  AUTH.busy = true; AUTH.err = ''; render();
  try{
    const out = await authPost('/v1/auth/google', { id_token: resp.credential, platform: 'web' });
    const u = out.user || out;
    const session = out.session || out.token;
    if(!session) throw new Error('no session');
    setSession({ session, email: u.email, name: u.name });
    // A sign-up, not a returning sign-in: the welcome. If the server does
    // not say which, the first sign-in in this browser counts as one.
    const created = out.created ?? out.new_user ?? out.is_new ?? u.created ?? u.is_new;
    if(created === true || (created == null && !ONBOARDED)) openOnboarding();
    // Signed in counts as access: the request card and sheet stand down.
    ACCESS.required = false; ACCESS.sheet = false;
    try{ localStorage.removeItem('still.accessRequired'); }catch(e){}
  }catch(e){
    AUTH.err = t("Couldn't sign you in. Please try again.", '没能登录，请再试一次。');
  }
  AUTH.busy = false; render();
  // A nonce is good for one sign-in: get the next one ready.
  if(!AUTH.session) initGoogle();
}
/* Every sign-in carries a fresh nonce from the gate (POST /v1/auth/nonce),
   which Google puts in the ID token; the gate accepts each once, within 10
   minutes. So Google is set up again with a new one after every attempt and
   before the old one expires, and the buttons are redrawn with it. */
let NONCE_TIMER = null;
async function initGoogle(){
  clearTimeout(NONCE_TIMER);
  let nonce = '';
  try{ nonce = (await authPost('/v1/auth/nonce')).nonce || ''; }catch(e){}
  if(!nonce){ GSI = 'failed'; return render(); }
  try{
    google.accounts.id.initialize({ client_id: GOOGLE_WEB_CLIENT_ID, callback: googleSignedIn, nonce,
      ux_mode: 'popup', auto_select: false, cancel_on_tap_outside: true });
    GSI = 'ready';
  }catch(e){ GSI = 'failed'; return render(); }
  document.querySelectorAll('.gsi-slot').forEach(el => { el.innerHTML = ''; });
  mountGoogle();
  NONCE_TIMER = setTimeout(() => { if(!AUTH.session) initGoogle(); }, 9 * 60 * 1000);
}
async function signOut(){
  const had = AUTH.session;
  if(had){ try{ await authPost('/v1/auth/logout'); }catch(e){} }
  setSession(null);
  try{ window.google && google.accounts.id.disableAutoSelect(); }catch(e){}
  render();
}
async function deleteAccount(){
  AUTH.busy = true; AUTH.err = ''; render();
  try{ await authPost('/v1/account/delete'); }
  catch(e){
    AUTH.busy = false;
    AUTH.err = t("Couldn't delete your account. Please try again.", '没能删除账户，请再试一次。');
    return render();
  }
  AUTH.busy = false;
  setSession(null);
  try{ window.google && google.accounts.id.disableAutoSelect(); }catch(e){}
  render();
}
/* Google's script loads only when there is a client id, and only once.
   Its button is drawn into each empty .gsi-slot after every render. */
let GSI = 'idle';   // idle | loading | nonce | ready | failed
function mountGoogle(){
  if(!googleOn() || AUTH.session) return;
  const slots = [...document.querySelectorAll('.gsi-slot:empty')];
  if(!slots.length) return;
  if(GSI === 'idle'){
    GSI = 'loading';
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => { GSI = 'nonce'; initGoogle(); };
    s.onerror = () => { GSI = 'failed'; render(); };
    document.head.appendChild(s);
    return;
  }
  if(GSI !== 'ready') return;
  for(const el of slots){
    google.accounts.id.renderButton(el, { type: 'standard', theme: 'outline', size: 'large',
      text: 'signin_with', shape: 'pill', logo_alignment: 'center',
      width: Math.min(400, Math.max(200, Math.round(el.getBoundingClientRect().width) || 280)),
      locale: lang === 'zh' ? 'zh_CN' : 'en' });
  }
}

let AGENT_STATE = AGENT_URL ? 'unknown' : 'off';   // off | unknown | ok | down
let AGENT_INFO = null;   // /v1/health: provider, model, provider_host, thinkers, choices
// The reader's pick among the agent's models. Groq is the default, and the
// pick is deliberately NOT remembered: the paid model is used only while it is
// chosen in this page, and a reload goes back to the free one.
let AGENT_CHOICE = '';

/* Claude is offered only to someone with an access code (the gate
   enforces it too); without one the menu shows the free models only. */
function agentChoices(){
  const all = (AGENT_INFO && AGENT_INFO.choices) || [];
  return AGENT_KEY ? all : all.filter(r => r.family !== 'claude' && !/^claude/i.test(r.id || ''));
}
/* A model whose worst-case reply costs more than the per-message cap can
   never answer under it (Fable 5.1 at $0.50). It stays in the list, greyed
   with the reason, and comes back by itself if the cap is raised. */
function overMessageCap(r){
  const caps = AGENT_INFO && AGENT_INFO.caps;
  if(!caps || caps.max_usd_per_message == null || !r.model) return false;
  const worst = (caps.worst_reply_usd || {})[r.model];
  return worst != null && worst > caps.max_usd_per_message;
}
function agentChoice(){
  const rows = agentChoices().filter(r => r.available && !overMessageCap(r));
  return rows.find(r => r.id === AGENT_CHOICE)
      || rows.find(r => r.id === (AGENT_INFO && AGENT_INFO.default_choice)) || rows[0] || null;
}
function setAgentChoice(id){
  AGENT_CHOICE = id;
  render();
}
function shortModel(m){ return String(m || '').replace(/^.*\//, ''); }
/* A readable name for a model id, from the agent's own row label. */
function modelName(id){
  const r = agentChoices().find(x => x.id === id || x.model === id);
  if(r && r.label) return r.label.split(' · ')[0];
  return shortModel(id);
}
function choiceName(id){ return modelName(id); }

function usageGroups(){ return (AGENT_INFO && AGENT_INFO.usage && AGENT_INFO.usage.groups) || {}; }
function groupOf(id){
  const r = agentChoices().find(x => x.id === id);
  return r && r.family === 'claude' ? 'claude' : id;
}

/* What is left today for one model, in small words for the menu. */
function leftText(id){
  if(id === 'auto') return '';
  const g = usageGroups()[groupOf(id)];
  if(!g) return '';
  if(groupOf(id) === 'claude'){
    if(g.replies_left == null) return '';
    let s = t(`${g.replies_left} replies, $${(g.usd_left || 0).toFixed(2)} left today`,
              `今天剩 ${g.replies_left} 条、$${(g.usd_left || 0).toFixed(2)}`);
    if(g.period_left != null) s += t(` · $${g.period_left.toFixed(0)} left this period`,
                                     ` · 本期剩 $${g.period_left.toFixed(0)}`);
    return s;
  }
  return g.replies_left == null ? '' : t(`${g.replies_left} left today`, `今天剩 ${g.replies_left} 条`);
}

/* Today's use in the notice: the chosen model, or everything Auto may use. */
function agentUsageLine(){
  const pick = agentChoice();
  if(!pick) return '';
  const groups = usageGroups();
  const parts = [];
  const groqIds = agentChoices().filter(r => r.family === 'groq').map(r => r.id);
  const show = pick.id === 'auto' ? [...groqIds, 'claude'] : [groupOf(pick.id)];
  const groqShown = show.filter(id => groqIds.includes(id) && groups[id]);
  if(groqShown.length){
    const used = groqShown.reduce((n, id) => n + groups[id].replies, 0);
    const cap = groqShown.reduce((n, id) => n + (groups[id].replies_cap || 0), 0);
    parts.push(groqShown.length > 1
      ? t(`Groq today: ${used} of ${cap} replies across ${groqShown.length} models`,
          `Groq 今天：${used} / ${cap} 条（${groqShown.length} 个模型）`)
      : t(`${modelName(groqShown[0])} today: ${used} of ${cap} replies`,
          `${modelName(groqShown[0])} 今天：${used} / ${cap} 条`));
  }
  const c = show.includes('claude') && groups.claude;
  if(c){
    let s = t(`Claude today: ${c.replies} of ${c.replies_cap} replies, $${c.usd.toFixed(2)} of $${(c.usd_cap || 0).toFixed(0)}`,
              `Claude 今天：${c.replies} / ${c.replies_cap} 条，$${c.usd.toFixed(2)} / $${(c.usd_cap || 0).toFixed(0)}`);
    if(c.period_cap != null) s += t(` · since ${c.period_start}: $${c.period_usd.toFixed(2)} of $${c.period_cap.toFixed(0)}`,
                                    ` · 自 ${c.period_start}：$${c.period_usd.toFixed(2)} / $${c.period_cap.toFixed(0)}`);
    parts.push(s);
  }
  return parts.length ? parts.join(' · ') + t('. Daily counts reset at midnight.', '。每日计数午夜重置。') : '';
}

/* Set the first time a reply comes from Claude because Groq could not give
   it; the notice says so once. */

/* The model menu lives in the composer, next to Send, where a thumb is. Every
   model by its real name, grouped; one that cannot be used is greyed with its
   reason. The small line under the composer says what is left today. */
/* The model menu: a floating panel above the chip (a bottom sheet on a
   phone). The main list is the four most people want; "More models" drills
   into the rest. Each row: the name, what is left today on the right, a
   check on the current one. A model that cannot answer stays in the list,
   greyed with its reason. */
const MENU = { open: false, sub: false };
const MENU_MAIN = ['auto', 'openai/gpt-oss-120b', 'claude-sonnet-5-5', 'claude-haiku-5-5'];
function menuName(r){ return r.id === 'auto' ? t('Auto','自动') : modelName(r.id); }
function menuSide(r){
  if(!r.available) return r.reason || t('Unavailable','不可用');
  if(overMessageCap(r)) return t('Over the per-message limit','超出单条消息上限');
  if(r.id === 'auto') return '';
  // Messages left today, never dollars (founder).
  const g = usageGroups()[groupOf(r.id)] || {};
  return g.replies_left != null ? t(`${g.replies_left} left`, `剩 ${g.replies_left} 条`) : '';
}
/* One plain line under each model's name: what it is for, never how it runs. */
function menuBlurb(r){
  const id = r.id || '';
  if(id === 'auto') return t('Picks the best available for you', '自动为你选择可用的最佳模型');
  if(/gpt-oss/i.test(id)) return t('Free and open', '免费、开源');
  if(/sonnet/i.test(id)) return t('Most careful replies', '回应最细致');
  if(/haiku/i.test(id)) return t('Fastest replies', '回应最快');
  if(/opus/i.test(id)) return t('Deepest replies', '回应最深入');
  return '';
}
function modelMenu(){
  const rows = agentChoices();
  const cur = agentChoice();
  const main = MENU_MAIN.map(id => rows.find(r => r.id === id)).filter(Boolean);
  const more = rows.filter(r => !MENU_MAIN.includes(r.id));
  const item = r => {
    const off = !r.available || overMessageCap(r);
    const on = cur && cur.id === r.id;
    const side = menuSide(r), blurb = menuBlurb(r);
    return `<button type="button" class="mi${off ? ' off' : ''}" role="menuitemradio"
        aria-checked="${on ? 'true' : 'false'}"${off ? ' aria-disabled="true"' : ''}
        tabindex="-1" data-mi="${esc(r.id)}">
        <span class="nm">${esc(menuName(r))}${blurb || (off && side) ? `<small>${esc(off && side ? side : blurb)}</small>` : ''}</span>
        <span class="side">${off ? '' : esc(side)}</span>
        <span class="chk" aria-hidden="true">${on ? '&#10003;' : ''}</span></button>`;
  };
  // On a phone a sheet like Claude's: a titled header with close, the
  // models in one grouped card, More models as its own row beneath.

const AGENT_IDS = {

/* Roster ids the running agent can answer for, or null when the agent is
   off, not yet checked, or down (then the whole roster shows, as before). */
/* Pro = the thinker agent's library holds this person's own texts. Derived,
   never counted by hand: every roster id the agent map names, plus any
   thinker a running agent reports that matches a roster name. It grows as
   the corpus grows. Everyone else is Basic. Pro is a label, not a lock. */
function agentLibrary(){
  const ids = new Set(Object.keys(AGENT_IDS));
  const live = AGENT_INFO && Array.isArray(AGENT_INFO.thinkers) ? AGENT_INFO.thinkers : [];
  const known = new Set(Object.values(AGENT_IDS));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[^a-z]+/g, ' ').trim();
  for(const a of live){
    if(known.has(a)) continue;
    const want = norm(a);
    const p = PHIL.find(x => norm(x.name) === want || norm(x.name).endsWith(' ' + want)
                          || norm(x.id.replace(/^p-/, '')) === want);
    if(p){ ids.add(p.id); AGENT_IDS[p.id] = a; }
  }
  return ids;
}
function applyTiers(){
  const lib = agentLibrary();
  for(const p of PHIL) p.tier = lib.has(p.id) ? 'pro' : 'basic';
}

function agentRoster(){
  if(!AGENT_URL) return null;
  if(AGENT_STATE === 'unknown'){ setTimeout(agentReady); return null; }
  if(AGENT_STATE !== 'ok' || !AGENT_INFO || !Array.isArray(AGENT_INFO.thinkers)) return null;
  const have = new Set(AGENT_INFO.thinkers);
  return new Set(Object.keys(AGENT_IDS).filter(id => have.has(AGENT_IDS[id])));
}

/* The round in progress: one id for the per-message cap, and one switch the
   Stop button pulls to cancel the pending request and ask no one else. */
let ROUND = null;

/* The language the reader wrote in: Chinese if the question has Han
   characters, English if it has Latin letters, else the UI language. Sent
   with each question so the reply can come back in it (agent side pending;
   unknown fields are ignored until then). */
function questionLang(q){
  const x = String(q || '');
  if(/[\u3400-\u9fff]/.test(x)) return 'zh';
  if(/[A-Za-z]/.test(x)) return 'en';
  return lang;
}

async function agentFetch(path, body, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  if(body && ROUND) ROUND.ctl.signal.addEventListener('abort', () => ctl.abort(), { once: true });
  try{
    const r = await fetch(AGENT_URL + path, body
      ? { method:'POST', headers: agentHeaders({'content-type':'application/json'}),
          body: JSON.stringify(body), signal: ctl.signal }
      : { signal: ctl.signal });   // health stays open: no passcode, no preflight
    // The reader's own count rides on every ask reply, refusals included.
    if(path === '/v1/ask') noteMyUse(r.headers);
    if(r.status === 429){
      // A daily cap or a burst limit: a status to name, not a failure.
      const body = await r.json().catch(() => null);
      if(body && body.status === 'limit_reached') return { limit: body };
      if(body && body.status === 'rate_limited') return { rated: body };
    }
    if(r.status === 401){
      // The gate (Hosting/README.md): access_required (free used / closed /
      // code needed / no device) or invalid_code. The local agent's own
      // passcode 401 has no such status and is treated as a bad code.
      const b = await r.json().catch(() => null);
      if(b && b.status === 'access_required'){ accessRequired(b.reason); throw new Error('access'); }
      keyRejected(); throw new Error('auth');
    }
    if(r.status === 503){
      const b = await r.json().catch(() => null);
      if(b && b.status === 'starting'){ wakeUp(); throw new Error('starting'); }
      // Busy for a moment (Groq's per-minute limit): not an error, and not
      // counted against the reader.
      if(b && b.status === 'busy') return { busy: b };
    }
    if(!r.ok) throw new Error('agent ' + r.status);
    return await r.json();
  }finally{ clearTimeout(timer); }
}

/* The Space asleep or building (503 starting): say so, and retry health
   every 10 s for up to 3 minutes. */
let WAKE = null;
function wakeUp(){
  AGENT_STATE = 'starting';
  if(WAKE) return;
  WAKE = { until: Date.now() + 180000 };
  const tick = async () => {
    if(!WAKE) return;
    try{
      const r = await fetch(AGENT_URL + '/v1/health');
      const h = r.ok ? await r.json() : null;
      if(h && h.ready > 0){ AGENT_INFO = h; AGENT_STATE = 'ok'; WAKE = null; applyTiers(); render(); return; }
    }catch(e){}
    if(Date.now() > WAKE.until){ WAKE = null; AGENT_STATE = 'down'; render(); return; }
    setTimeout(tick, 10000);
  };
  render(); setTimeout(tick, 10000);
}
/* Healthy means it answers and has at least one thinker indexed. Checked
   once; a failed ask marks it down so the next turn falls back. */
async function agentReady(){
  if(!AGENT_URL) return false;
  if(AGENT_STATE === 'unknown'){
    try{
      const h = await agentFetch('/v1/health', null, 3000);
      AGENT_INFO = h;
      AGENT_STATE = h && h.ready > 0 ? 'ok' : 'down';
      applyTiers();
      if(AGENT_STATE === 'ok') refreshMe();   // the ring shows the reader's own count from the start
    }catch(e){ AGENT_STATE = e.message === 'starting' ? 'starting'
      : (e.message === 'auth' || e.message === 'access') ? 'unknown' : 'down'; }
    render();
  }
  return AGENT_STATE === 'ok';
}

    + esc(fell);   // today's use is behind the ring in the composer
  if(AGENT_STATE === 'ok') return t(
    `Replies come from the thinker agent running on this computer (${where}). What you type goes there and nowhere else. It assembles each reply from the thinker's own texts; the reply is still simulated.`,
    `回应来自这台电脑上运行的思想者代理（${where}）。你输入的内容只会发到那里。它用思想家自己的文本拼出每条回应，但回应仍是模拟的。`);
  if(AGENT_STATE === 'down') return t(
    `The thinker agent at ${where} did not answer, so this falls back to the usual source.`,
    `${where} 上的思想者代理没有回应，因此退回到平常的来源。`);
  setTimeout(agentReady);
  return t(`Checking the thinker agent at ${where}…`, `正在检查 ${where} 上的思想者代理…`);
