         scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.filters::-webkit-scrollbar{display:none}
.fpill{flex:none;font-size:13.5px;font-weight:500;padding:7px 14px;
       border-radius:var(--r-pill);background:var(--chip);color:var(--ink)}
.fpill.on{background:var(--ink);color:var(--accent)}
.selected{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 2px}
.selchip{font-size:13px;font-weight:500;padding:5px 8px 5px 11px;
         border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);
         display:flex;align-items:center;gap:6px}
.selchip span{opacity:.6;font-size:14px}
.plist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 0}
.modal footer{flex:none;padding:12px 20px 16px}
/* Phone: the picker takes the whole screen, top edge to the top, so the
   list still has room with the keyboard up. */
@media (max-width:639px){
  .modal.pick{top:0;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top,0px);box-shadow:none}
}
.modal footer .wide{margin:0}
.modal footer .wide[disabled]{opacity:.35}

.prow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;
      border-bottom:1px solid var(--hairline);text-align:left}
.prow .meta{flex:1;min-width:0}
.prow b{font-size:16px;font-weight:500;display:block}
.prow .meta > span{font-size:12.5px;color:var(--ink-secondary)}
.prow .tick{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);
            color:var(--ink-secondary);font-size:15px;line-height:28px;
            text-align:center}
.prow.on .tick{background:var(--ink);color:var(--on-ink)}

@media (min-width:640px){
  .modal{left:50%;bottom:auto;top:50%;right:auto;transform:translate(-50%,-50%);
         width:min(460px,calc(100vw - 40px));border-radius:20px;max-height:min(680px,82dvh);
         box-shadow:0 20px 60px rgba(36,50,53,.26)}
}

<script>
/* ---------------------------------------------------------------------------
   Still, on the web.

   A port of the iOS app, reading the same PastLives/Resources/content.json the
   app ships in its bundle. Everything on this page comes out of that file:
   the questions, the replies, the quotations and their sources. Nothing is
   generated here, which is the whole point of the project — a quote is only a
   quote if it has a source you can follow.

   State (votes, likes, language) lives in this browser only, the same way the
   app keeps it on the phone and never sends it anywhere.
--------------------------------------------------------------------------- */

const IMG = 'assets/img/';
let C = null;                 // content.json
let lang = 'en';
let state = { votes:{}, likes:{} };
let stack = [{ tab:'home' }]; // view stack; last entry is what is showing
let reported = null;          // which item's report note is showing
let PHIL = [];                // the ranked roster, from assets/philosophers.json
let SAMPLE = undefined;       // the model, once asked for: null means no model here
/* What the reader wants to think about: picked once in the welcome,
   changeable in Me. It orders Home and hides nothing. Ids match the
   content's question.topics. */
const TOPICS = [
  ['power',   'Power & leadership',     '权力与领导'],
  ['money',   'Money & success',        '金钱与成功'],
  ['work',    'Work & ambition',        '工作与抱负'],
  ['tech',    'Technology & attention', '科技与注意力'],
  ['love',    'Love & family',          '爱与家庭'],
  ['trust',   'Secrets & trust',        '秘密与信任'],
  ['society', 'Society & justice',      '社会与正义'],
  ['meaning', 'Meaning & mortality',    '意义与死亡'],
  ['self',    'Self & happiness',       '自我与幸福'],
];
let PICKS = [];
let ONBOARDED = false;
const OB = { open: false, step: 0, sel: [], moved: false };
/* A chat app holds conversations, not one transcript. Each carries its own
   cast, its own history, and its own record of which philosophers have
   already shown a real passage. */
let chat = { convos: [], open: null, busy:false, query:'', filter:'all',
             picking:false, pending: [], typing:null, draft:'', seeded:false };

/* --- Storage. Every access can throw (private windows, blocked site data),
       and the page has to render correctly when it does. ------------------ */
function load(){
  try{
    const c = localStorage.getItem('still.chat');
    if(c){
      const saved = JSON.parse(c);
      // An earlier build kept a single conversation; carry it over as one.
      if(saved.cast && !saved.convos){
        saved.convos = saved.cast.length
          ? [{id:'c1', cast:saved.cast, msgs:saved.msgs||[], said:saved.said||{},
              at: Date.now()}] : [];
        saved.open = saved.convos.length ? 'c1' : null;
      }
      delete saved.cast; delete saved.msgs; delete saved.said;
      chat = Object.assign(chat, saved, {busy:false, picking:false, pending:[]});
    }
  }catch(e){ /* defaults stand */ }
  try{
    const raw = localStorage.getItem('still.state');
    if(raw) state = Object.assign(state, JSON.parse(raw));
    const l = localStorage.getItem('still.lang');
    if(l === 'en' || l === 'zh') lang = l;
  }catch(e){ /* defaults stand */ }
  try{
    const tp = JSON.parse(localStorage.getItem('still.topics') || '[]');
    if(Array.isArray(tp)) PICKS = tp.filter(id => TOPICS.some(x => x[0] === id));
    ONBOARDED = !!localStorage.getItem('still.onboarded');
  }catch(e){ ONBOARDED = true; /* storage blocked: never trap anyone in a welcome */ }
}
function saveTopics(){
  try{
    localStorage.setItem('still.topics', JSON.stringify(PICKS));
    if(ONBOARDED) localStorage.setItem('still.onboarded', new Date().toISOString());
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem('still.state', JSON.stringify(state));
    localStorage.setItem('still.lang', lang);
    localStorage.setItem('still.chat', JSON.stringify({
      open: chat.open, seeded: chat.seeded,
      convos: chat.convos.map(c => ({...c, msgs: c.msgs.slice(-60)}))
    }));
  }catch(e){ /* nothing to do; the page still works for this session */ }
}

/* --- Helpers ------------------------------------------------------------- */
const t = (en, zh) => lang === 'zh' ? zh : en;
const L = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n.toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
const byId = (arr, id) => arr.find(x => x.id === id);

function dateLabel(iso){
  const d = new Date(iso + 'T00:00:00Z');
  const o = {timeZone:'UTC'};
  if(lang === 'zh'){
    const wd = d.toLocaleDateString('zh-Hans-CN',{...o, weekday:'long'});
    return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${wd}`;
  }
  // en_GB puts the day before the month, and the app's format keeps a comma
  // after the weekday that the locale's own long form leaves out.
  const wd = d.toLocaleDateString('en-GB',{...o, weekday:'long'});
  const mo = d.toLocaleDateString('en-GB',{...o, month:'long'});
  return `${wd}, ${d.getUTCDate()} ${mo}`;
}
const initial = name => (name || '?').trim()[0] || '?';

const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"'
  + ' stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
/* The app logs a report on the device and can hand it to Mail. The web port
   has neither, so the button says so rather than pretending to send. */
const reportBtn = key => `<button class="icon-btn" data-report="${esc(key)}"
  aria-label="${t('Report','举报')}">${FLAG}</button>`;
const reportNote = key => reported === key
  ? `<p class="report-note">${t('Reporting is in the app — it logs on the device and can be handed to Mail. This page cannot send anything.','举报功能在 App 内：记录在设备上，并可通过邮件发送。此页面无法发送任何内容。')}</p>`
  : '';
function avatar(name, image, cls){
  const inner = image && image.file
    ? `<img src="${IMG}${esc(image.file)}" alt="" loading="lazy">`
    : esc(initial(name));
  return `<div class="av ${cls||''}">${inner}</div>`;
}
const kindLabel = k => L((C.kinds || {})[k]) || k;
const style = k => (C.optionStyle || {})[k] || {fill:'#E0D5C7',ink:'#243235',
  text:'#5F5B54',line:'#243235',bg:'rgba(36,50,53,.06)'};

/* Questions newest first — the app sorts the feed by date descending, so an
   appended question rises to the top instead of sinking to its index. */
const questions = () => C.questions
  .filter(q => q.status === 'published')
  .sort((a,b) => b.date.localeCompare(a.date));

const responsesFor = q => C.responses.filter(r => r.questionId === q.id);

/* Ordered by how far a voice reaches, the way the thread is ordered in the
   app, so the best-known names are not always first by accident. */
function threadRows(q, filter){
  let rs = responsesFor(q);
  if(filter && filter !== 'all') rs = rs.filter(r => r.optionKey === filter);
  return rs.map(r => ({ r, v: byId(C.voices, r.voiceId) }))
           .filter(x => x.v)
           .sort((a,b) => ((b.v.reach||{}).weight||0) - ((a.v.reach||{}).weight||0));
}

function worksFor(q){
  const ids = new Set();
  Object.values(q.answers || {}).forEach(a => (a.workIds||[]).forEach(w => ids.add(w)));
  return [...ids].map(id => byId(C.works, id)).filter(Boolean);
}

/* --- Navigation ---------------------------------------------------------- */
const here = () => stack[stack.length - 1];
/* Moving deeper slides the new page in from the right; going back brings
   the previous one in from the left; switching tabs does not slide. */
/* NAVIGATION, the way iOS does it. Going deeper, the new page slides in
   from the right over the current one, which drifts a little left and dims;
   going back is the reverse. Tabs do not slide. With reduced motion, a
   crossfade. Every push is a browser history entry, so the back button and
   Safari's own edge swipe go back too (Safari animates its swipe itself, so
   a back that arrives from the browser is drawn without ours). Full screen
   from the home screen there is no browser swipe: there, a swipe from the
   left edge follows the finger. */
let NAV = null, NAV_SKIP_POP = 0, CONVO_PUSHED = false;
function closeConvo(){
  chat.open = null;
  if(CONVO_PUSHED){ CONVO_PUSHED = false; NAV = 'pop'; NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } }
  render();
}
const navReduced = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function navSnapshot(view){
  const r = view.getBoundingClientRect();
  const g = document.createElement('div');
  g.className = 'nav-ghost'; g.setAttribute('aria-hidden', 'true');
  g.style.left = r.left + 'px'; g.style.width = r.width + 'px';
  const inner = document.createElement('div');
  inner.className = 'nav-ghost-in'; inner.style.transform = `translateY(${r.top}px)`;
  inner.innerHTML = view.innerHTML;
  inner.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  g.appendChild(inner);
  return g;
}
function navAnimate(ghost, kind){
  const view = document.getElementById('view');
  const html = document.documentElement;
  if(navReduced()){
    ghost.classList.add('over', 'fade-out');
  } else if(kind === 'push'){
    ghost.classList.add('under', 'push-out'); view.classList.add('nav-in-right');
  } else {
    ghost.classList.add('over', 'pop-out'); view.classList.add('nav-in-left');
  }
  html.classList.add('nav-busy');
  document.body.appendChild(ghost);
  setTimeout(() => { ghost.remove(); view.classList.remove('nav-in-right', 'nav-in-left'); html.classList.remove('nav-busy'); },
    navReduced() ? 220 : 380);
}
function go(entry){ reported = null; stack.push(entry); NAV = 'push';
  try{ history.pushState({ still: stack.length }, ''); }catch(e){}
  render(); window.scrollTo(0,0); }
addEventListener('popstate', () => {
  if(NAV_SKIP_POP){ NAV_SKIP_POP--; return; }
  // The browser went back (its button, or Safari's swipe, which drew its
  // own motion): step back without ours.
  if(stack.length > 1){ reported = null; stack.pop(); render(); }
  else if(chat.open && stack[0].tab === 'chat'){ chat.open = null; CONVO_PUSHED = false; render(); }
});
/* The home-screen app's edge swipe: from the left edge, the page follows
   the finger with the previous page under it; let go past 40% of the width
   or with a flick and it goes back, otherwise it settles. */
(function(){
  let s = null;
  document.addEventListener('touchstart', ev => {
    if(!standalone() || navReduced() || OB.open || document.querySelector('.modal')) return;
    const t = ev.touches[0];
    const canBack = stack.length > 1 || (chat.open && stack[0].tab === 'chat');
    if(!canBack || t.clientX > 24) return;
    s = { x0: t.clientX, y0: t.clientY, t0: Date.now(), dx: 0, on: false, ghost: null };
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if(!s) return;
    const t = ev.touches[0], dx = t.clientX - s.x0, dy = t.clientY - s.y0;
    if(!s.on){
      if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ s = null; return; }
      if(dx < 8) return;
      s.on = true;
      // The page underneath: the one going back would show.
      const view = document.getElementById('view');
      const prev = stack.length > 1 ? stack[stack.length - 2] : { tab: 'chat' };
      const keepOpen = chat.open; if(stack.length === 1) chat.open = null;
      const g = navSnapshot(view);
      g.querySelector('.nav-ghost-in').innerHTML = viewHTML(prev);
      g.querySelector('.nav-ghost-in').style.transform = `translateY(${view.getBoundingClientRect().top + scrollY}px)`;
      chat.open = keepOpen;
      g.classList.add('under', 'live'); document.body.appendChild(g);
      document.documentElement.classList.add('nav-busy', 'nav-drag');
      s.ghost = g;
    }
    ev.preventDefault();
    s.dx = Math.max(0, dx);
    const w = innerWidth, f = Math.min(1, s.dx / w);
    document.getElementById('view').style.transform = `translateX(${s.dx}px)`;
    s.ghost.style.transform = `translateX(${-30 * (1 - f)}%)`;
    s.ghost.style.setProperty('--dim', String(.1 * (1 - f)));
  }, { passive: false });
  const end = () => {
    if(!s || !s.on){ s = null; return; }
    const view = document.getElementById('view'), g = s.ghost, w = innerWidth;
    const fast = s.dx / Math.max(1, Date.now() - s.t0) > .5;
    const done = s.dx > w * .4 || (fast && s.dx > 40);
    view.style.transition = g.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)';
    view.style.transform = done ? `translateX(${w}px)` : 'translateX(0)';
    g.style.transform = done ? 'translateX(0)' : 'translateX(-30%)';
    s = null;
    setTimeout(() => {
      view.style.transition = view.style.transform = '';
      g.remove(); document.documentElement.classList.remove('nav-busy', 'nav-drag');
      if(done){
        reported = null;
        if(stack.length > 1){ stack.pop(); NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } }
        else { chat.open = null; if(CONVO_PUSHED){ CONVO_PUSHED = false; NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; } } }

      }
    }, 250);
  };

})();

function back(){ reported = null;
  if(chat.picking){ chat.picking = false; return render(); }
  if(chat.open && stack[0].tab === 'chat' && stack.length === 1){ closeConvo(); return; }
  if(stack.length > 1){ stack.pop(); NAV = 'pop';
    NAV_SKIP_POP++; try{ history.back(); }catch(e){ NAV_SKIP_POP--; }
    render(); } }

/* --- Views --------------------------------------------------------------- */

function optionRow(q, o, chosen){
  const p = style(o.key);
  const answered = chosen != null;
  const mine = chosen === o.key;
  const pct = (q.baselinePct || {})[o.key];
  const dim = answered && !mine ? 'opacity:.42' : '';
  return `
  <button class="opt ${mine?'mine':''}" data-vote="${esc(o.key)}"
          style="border-color:${mine?esc(p.line):'var(--hairline-strong)'}">

/* Home, ordered by the reader's topics: today's question stays on top;
   after it, questions sharing more of the picks come first, newest first
   among equals. Nothing is dropped. A question without topics ranks as
   sharing none. */
function homeOrder(qs){
  if(!PICKS.length) return qs;
  const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const pinned = qs.length && qs[0].date === today ? [qs[0]] : [];
  const score = q => (Array.isArray(q.topics) ? q.topics : []).filter(x => PICKS.includes(x)).length;
  return pinned.concat(qs.slice(pinned.length).map((q, i) => ({ q, i, s: score(q) }))
    .sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.q));
}

const S = k => { const st = (C && C.strings) || {}; return (st[lang] && st[lang][k]) || (st.en && st.en[k]) || ''; };

/* --- Answers ------------------------------------------------------------- */
/* One passage, drawn at random, from the same bundle the threads use. The
   reader never types the question, so the page cannot pretend to have read
   it — and says so. */
let drawn = null, bookOpen = false;
/* The Book of Answers' passages (assets/answers.json, built by
   Tools/build-answers.py): exact public-domain words from the library
   thinkers, each with its source and a one-line context note. Empty if the
   file is missing; the book then falls back to the thread passages. */
let ANSWERS = [];
/* The book is a strict toggle: one click, one flip. While a flip runs,
   clicks, taps and keys are ignored; the state changes once, when it
   lands. Opening draws a fresh passage first, under the shut cover. */
let BOOK_BUSY = false, BOOK_CLOSING = false, BOOK_FLIPPING = false;
let SCROLL_SEEN = { id: null, n: 0 };
let FOOT_RO = null;
window.addEventListener('resize', () => StillFlip.measure(document.getElementById('book')));
function toggleBook(){
  if(BOOK_BUSY) return;
  BOOK_BUSY = true;
  const opening = !bookOpen;
  if(opening){ draw(); render(); }
  const el = document.getElementById('book');
  const land = () => {
    BOOK_FLIPPING = false;
    bookOpen = opening; BOOK_CLOSING = !opening; render();
    // The cover's return plays once, then the flag clears.
    setTimeout(() => { BOOK_CLOSING = false; BOOK_BUSY = false; }, opening ? 0 : StillFlip.returnMs());
  };
  if(el){ BOOK_FLIPPING = true; StillFlip.run(el, opening, land); } else land();
}
/* The pages turned past are real passages from the same sourced bundle,
   in the reader's language: none repeated, none the one it lands on.
   Long ones are cut at a word with an ellipsis; the last page is whole. */
function riffleQuotes(last){
  const pool = (ANSWERS.length ? ANSWERS : quotable()).filter(x => x !== last);
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const cut = (q, n) => { q = String(q || '');
    if(q.length <= n) return q;
    const s = q.slice(0, n), sp = lang === 'zh' ? s.length : s.lastIndexOf(' ');
    return s.slice(0, sp > n * 0.6 ? sp : n).replace(/[\s,;:.—-]+$/, '') + '…'; };
  return pool.slice(0, StillFlip.count()).map(x => {
    const P = passageOf(x);
    return { text: cut(P.text, lang === 'zh' && !P.enOnly ? 48 : 120), name: P.name };
  });
}

/* Library thinkers the Book of Answers quotes who are not on the roster
   (Addams, Croce, Gilman, Godwin, Santayana, Spencer). The agent reads their
   texts, so they join the chat roster — Pro, chosen in the picker, opened
   from the book — but not Explore, which has no page for them yet. */
const LIBRARY_ZH = { addams: '简·亚当斯', croce: '贝内德托·克罗齐', gilman: '夏洛特·珀金斯·吉尔曼',
                     godwin: '威廉·葛德文', santayana: '乔治·桑塔亚那', spencer: '赫伯特·斯宾塞' };
function addLibraryThinkers(list){
  const seen = new Set(Object.values(AGENT_IDS));
  for(const e of ANSWERS){
    if(seen.has(e.thinker)) continue;
    seen.add(e.thinker);
    const id = 'p-' + e.name.toLowerCase().normalize('NFD').replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');
    if(list.some(p => p.id === id)) { AGENT_IDS[id] = e.thinker; continue; }
    list.push({ id, name: e.name, nameZh: LIBRARY_ZH[e.thinker] || null, rank: null, tier: 'pro',
                voiceId: null, image: null, quotes: [], libraryOnly: true });
    AGENT_IDS[id] = e.thinker;
  }
}
/* The roster person behind an agent thinker id (adam_smith -> p-adam-smith). */
function philByAgent(a){
  const id = Object.keys(AGENT_IDS).find(k => AGENT_IDS[k] === a);
  return id ? philById(id) : null;
}
/* What the book shows, in one shape for both sources. A pool passage has no
   Chinese yet: in zh the English is shown and labelled as the English. */
function passageOf(r){
  if(!r) return null;
  if(r.pool){
    const p = philByAgent(r.thinker);
    const where = [r.work, r.locator].filter(Boolean).join(', ');
    return { text: lang === 'zh' && r.zh ? r.zh : r.en, enOnly: lang === 'zh' && !r.zh,
      quote: { en: r.en, zh: r.zh || r.en },
      name: p ? pn(p) : r.name, phil: p, voice: p && p.voiceId ? byId(C.voices, p.voiceId) : null,
      context: r.context, where, approx: !!r.locatorApprox, translator: r.translator,
      source: { label: { en: `${r.name}, ${where}${r.translator ? `, trans. ${r.translator}` : ''}`,
                         zh: `${r.name}，${where}${r.translator ? `，译者 ${r.translator}` : ''}` } } };
  }
  const v = byId(C.voices, r.voiceId);
  return { text: L(r.quote), enOnly: false, quote: r.quote, name: v ? fullName(v) : '', phil: chatTarget(v), voice: v,
    response: r, source: r.source };
}

function quotable(){
  return C.responses.filter(r => r.quote && L(r.quote) && r.source && r.source.label);
}
let INTERP_OPEN = false;
/* The person behind a voice who can be talked to: a roster entry for a
   thread voice that is a person. Texts, schools and communities have no
   chat persona, so no button. */
function chatTarget(v){
  if(!v || v.type !== 'person') return null;
  return PHIL.find(p => p.voiceId === v.id) || null;
}
function draw(){
  INTERP_OPEN = false;
  const pool = ANSWERS.length ? ANSWERS : quotable();
  drawn = pool[Math.floor(Math.random() * pool.length)] || null;
}

/* A voice's full name: the roster's (Hume → David Hume), else its
   Wikipedia title for a person, else the voice's own name (texts, schools). */
function fullName(v){
  if(!v) return '';
  const p = PHIL.find(x => x.voiceId === v.id);
  if(p) return pn(p);
  if(v.type === 'person' && v.wiki && lang !== 'zh') return v.wiki.replace(/_/g, ' ').replace(/ \(.*\)$/, '');
  return L(v.name);
}
function answersView(){
  if(!drawn) draw();

  // A thick book on grass. Shut, its cover carries the title and the
  // prompt; opening it riffles through many pages to the last one, where
  // the passage is. The pages turned past are real passages too.
  const pages = riffleQuotes(r);
  // In the Interpretation sheet: the author's own chat, the passage as its
  // context (the same as "Chat with …" under the passage), and the authored
  // interpretation when the content carries one — never generated here.
  const readChat = `<button type="button" class="fpill read-chat" data-chat-from-book="1">${t('Chat','聊聊')}</button>`;
  const iv = r && r.interpretation;
  const ivText = !iv ? '' : typeof iv === 'string' ? iv : (lang === 'zh' && iv.zh ? iv.zh : iv.en || '');
  const interp = ivText ? `<div class="grp">
          <p class="label label--sm">${t('Our reading','我们的解读')}</p>
          <p>${esc(ivText)}</p>
        </div>` : '';
  return `<div class="page page--answers"><div class="ans">
    ${StillFlip.bookHTML({ open: bookOpen, esc, pages,
      attrs: `id="book" role="button" tabindex="0" aria-label="${bookOpen ? t('Tap to close','轻点合上') : t('Open the book','翻开这本书')}"`,
      title: t('Book of<br>Answers','答案<br>之书'), cta: t('Hold a question in mind<br>then flip it','心里想着一个问题<br>然后翻开它'),
      final: `
        <div class="leaf-text${(P ? P.text : '').length > (lang === 'zh' && !(P && P.enOnly) ? 90 : 220) ? ' long' : ''}">
          ${P && P.enOnly ? `<p class="en-orig">英文原文</p>` : ''}
          <p class="passage"${P && P.enOnly ? ' lang="en"' : ''}>“${esc(P ? P.text : '')}”</p>
          <p class="attrib">— ${P ? (P.phil && !P.phil.libraryOnly
            ? `<a href="#" class="linkish" ${P.phil.voiceId ? `data-voice="${esc(P.phil.voiceId)}"` : `data-phil="${esc(P.phil.id)}"`}>${esc(P.name)}</a>`
            : v ? `<a href="#" class="linkish" data-voice="${esc(v.id)}">${esc(P.name)}</a>` : esc(P.name)) : ''}</p>
        </div>
        ${`<div class="leaf-acts">
          <button type="button" class="linkish" data-interp="1" aria-expanded="${INTERP_OPEN}"
            aria-controls="reading">${t('Interpretation','解读')}</button>
          <button type="button" class="linkish" data-chat-from-book="1">${P && P.phil
            ? t(`Chat with ${esc(pn(P.phil))}`, `和${esc(pn(P.phil))}聊聊`)

// The philosophers here are a model writing in their manner. That is the one
// thing this app refuses to let anyone mistake, so every generated line is
// tagged SIMULATED, and the passages they actually wrote appear in a separate
// block, in the thread's quote styling, with the source. The two never share
// a shape.

const philById = id => PHIL.find(p => p.id === id);
/* A person's name in the reader's language: the roster's Chinese name in
   zh (curated thread names first, then Wikidata), else the English. */
const pn = p => (lang === 'zh' && p && p.nameZh) ? p.nameZh : ((p && p.name) || '');

function linkAvatar(p, cls){
  if(!p || !p.id) return castAvatar(p, cls);
  return `<button class="avlink" data-phil="${esc(p.id)}"
                  aria-label="${esc(p.name || '')}">${castAvatar(p, cls)}</button>`;
}

function castAvatar(p, cls){
  const img = p.image ? `<img src="${IMG}${esc(p.image)}" alt="" loading="lazy">` : esc(initial(p.name));
  return `<div class="av ${cls||''}">${img}</div>`;
}

/* The shape of a chat app: a list of conversations, and the one you have
   open. Below 900px you see one or the other; above it, both at once, which
   is what the two-pane layout in every desktop messenger does. */

const convo = () => chat.convos.find(c => c.id === chat.open) || null;

function convoTitle(c){
  const names = (c.cast || []).map(id => pn(philById(id))).filter(Boolean);
  if(!names.length) return t('Empty conversation','空对话');
  if(names.length <= 2) return names.join(t(' and ',' 与 '));
  return names.slice(0,2).join(', ') + t(` and ${names.length-2} more`, ` 等 ${names.length} 人`);
}

function whenLabel(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if(days < 1 && d.getDate() === now.getDate())
    return d.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US',
      {hour:'numeric', minute:'2-digit'});
  if(days < 7) return t(`${Math.max(1,days)}d`, `${Math.max(1,days)} 天`);
  return d.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-GB',
    {day:'numeric', month:'short'});
}

/* Seeded once, tracked by a flag rather than by the list being empty. Gating
   on emptiness meant anyone who had already opened the tab — which is anyone
   who had tried it at all — never saw them. Existing conversations are added
   to, never replaced. */
function seedExamples(){
  if(chat.seeded || !PHIL.length) return;
  chat.seeded = true;
  const now = Date.now();
  EXAMPLES.forEach((ex, n) => {
    const cast = ex.cast.filter(id => philById(id));
    if(cast.length !== ex.cast.length) return;   // roster changed; skip quietly
    const at = now - ex.hours * 3600000;
    let step = 0;
    const msgs = ex.turns.map(turn => {
      step += 90000;
      if(turn.mine) return {mine:true, text: L({en:turn.en, zh:turn.zh}), at: at + step};
      const p = philById(turn.who);
      return { id:p.id, name:p.name, at: at + step,
               text: L({en:turn.en, zh:turn.zh}),
               commitment: L(turn.commit), bridge: L(turn.bridge),
               said: p.quotes[turn.q] || null };
    });
    chat.convos.push({ id:'ex' + n, cast, msgs, said:{}, at: at + step, example:true });
  });
  if(!chat.open && chat.convos.length) chat.open = chat.convos
    .slice().sort((x,y) => (y.at||0) - (x.at||0))[0].id;
  save();
}

/* "Chat with <name>" on a profile page: the same label and behaviour as
   the Answers book. A Basic thinker gets the tier's caveat beside it while
   the agent is on, because then they cannot reply yet. */
function chatButton(p){
  if(!p) return '';
  const wait = p.tier !== 'pro' && AGENT_URL && AGENT_STATE === 'ok';
  return `<div class="entry-chat">
    <button type="button" class="chat-go" data-chat-with="${esc(p.id)}">${
      t(`Chat with ${esc(pn(p))}`, `和${esc(pn(p))}聊聊`)}</button>
    ${wait ? `<p class="meta">${t(`Basic: ${esc(pn(p))}'s own writings aren't in Still's library yet, so ${esc(pn(p))} can't answer in chat.`,
      `基础：${esc(pn(p))}的著作还没有收入 Still 的文库，因此无法在聊天中回应。`)}</p>` : ''}</div>`;
}
function startChat(id){
  if(!philById(id)) return;
  const c = { id: 'c' + Date.now(), cast: [id], msgs: [], said: {}, at: Date.now() };
  chat.convos.push(c); chat.open = c.id; chat.pending = []; chat.picking = false;
  save(); tab('chat');
}

  if(!p) return `<div class="empty">${t('Not found','没有找到')}</div>`;
  if(p.libraryOnly) return `<div class="page"><div class="entry">
      <div class="entry-head">${castAvatar(p)}<div><h2>${esc(pn(p))}</h2>
        <p class="meta">${t("Their texts are in Still's library. A full page is not written yet.",'他们的著作已收入 Still 的文库。完整介绍尚未写成。')}</p></div></div>
      ${chatButton(p)}</div></div>`;
  const v = p.voiceId ? byId(C.voices, p.voiceId) : null;
  const said = v ? C.responses.filter(r => r.voiceId === v.id) : [];
  const threads = [...new Set(said.map(r => r.questionId))];
  const works = v ? (v.workIds || []).map(w => byId(C.works, w)).filter(Boolean) : [];
  const wiki = `https://en.wikipedia.org/wiki/${encodeURIComponent(p.wiki)}`;
  // The picture's licence lives on its thread voice, or on the roster entry
  // for people sourced by Tools/fetch-roster-portraits.mjs.
  const pic = (v && v.image) || (p.image && p.imageLicence) || null;

  return `<div class="page"><div class="entry">
    <div class="entry-head">
      ${castAvatar(p, 'av--lg')}
      <div>
        <h2>${esc(pn(p))}</h2>
        <p class="meta">${v ? esc(kindLabel(v.kind)) + ' · ' + esc(L(v.origin))
                            : t('In the roster, not yet in the threads',
                                '在名册中，尚未出现在讨论里')}</p>
      </div>
    </div>
    ${chatButton(p)}

    <div class="kinds" style="margin-top:16px">
      <button type="button" class="kind" data-tierinfo="${p.tier === 'pro' ? 'pro' : 'basic'}"
        aria-expanded="${TIER_OPEN[p.tier === 'pro' ? 'pro' : 'basic'] ? 'true' : 'false'}"><span
        class="tier ${p.tier}">${tierLabel(p.tier)}</span> ${t('What is this?','这是什么？')}</button>
      <span class="kind">${t(`#${p.rank} by readership`, `阅读量排名 #${p.rank}`)}</span>
      <span class="kind">${p.quotes.length
        ? t(`${p.quotes.length} sourced passages`, `${p.quotes.length} 段有出处的文字`)
        : t('No sourced passages yet','暂无有出处的文字')}</span>
    </div>
    ${TIER_OPEN[p.tier === 'pro' ? 'pro' : 'basic']
      ? `<p class="tier-info">${tierExplain(p.tier === 'pro' ? 'pro' : 'basic')}</p>` : ''}
    ${booksSection(p, v)}

    ${v && v.reach ? `<p class="body" style="font-family:var(--serif);font-style:italic">${
      esc(L(v.reach.note))}</p>` : ''}

    ${p.quotes.length ? `
      <h3 class="section-h" style="padding-left:0">${t('What they actually wrote','他们真正写下的')}</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${p.quotes.map(q => `<div class="said">
          <q>${esc(L(q.text))}</q>
          <span class="src">— ${q.url
            ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(L(q.label))}</a>`
            : esc(L(q.label))}</span>
        </div>`).join('')}
      </div>` : libraryOf(p) ? '' : `
      <p class="notice" style="margin:16px 0 0">${t(
        'No passage of theirs is in this app yet, so a reply from them cannot be checked against their own words.',
        '这个 App 里还没有他们的文字，因此他们的回应无法与其本人的原话对照。')}</p>`}


    ${threads.length ? `
      <h3 class="section-h" style="padding-left:0">${
        t('Speaks in these threads','在这些讨论里发言')}</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${said.map(r => {
          const qn = byId(C.questions, r.questionId);
          return `<button class="card" style="padding:16px;text-align:left"
                          data-open="${esc(r.questionId)}">
            <p style="font-family:var(--serif);font-size:17px;margin:0 0 8px">${
              esc(L(qn && qn.title))}</p>

              esc(L(r.claim))}</p>

       href="${esc(wiki)}" target="_blank" rel="noopener">${
       t('Read about them on Wikipedia','在维基百科上了解他们')} ↗</a>

    ${pic ? `<p class="credit">${esc(t('Image','图片'))}: ${esc(pic.licence||'')}${
      pic.credit ? ' · ' + esc(pic.credit) : ''}${pic.sourceUrl

        t('source','来源')}</a>` : ''}</p>` : ''}

    <p class="credit" style="border:0;padding-top:8px">${t(
      'Rank is English Wikipedia readership over twelve months. It measures how many people read about someone, not how important they are.',

  </div></div>`;

/* A conversation's name: what the reader renamed it to, else the first
   thing they asked, else "New conversation". Who is in it goes on the
   second line. */
function convoName(c){
  if(c.title) return c.title;
  const first = c.msgs.find(m => m.mine);
  return first ? shortTitle(first.text) : t('New conversation','新对话');
}
/* No model is asked for this: a model-written summary would need its own
   call to the agent. Until then, the gist of the first message. */
function shortTitle(text){
  let s = String(text).trim().split(/(?<=[.?!。？！])\s/)[0];
  const lead = /^(so|well|ok|okay|hey|hi|hello|please|honestly|i('m| am) (curious|wondering) (about|whether|if)|i want to (talk|know|ask) about|can we talk about|let'?s talk about|tell me about|what do you (all |both )?think (about|of)|do you (all |both )?think( that)?)[,\s]+/i;
  for(let k = 0; k < 3 && lead.test(s); k++) s = s.replace(lead, '');
  s = s.replace(/[\s?.!。？！]+$/, '');
  if(s.length > 44) s = s.slice(0, 44).replace(/\s+\S*$/, '') + '…';
  return s ? s[0].toUpperCase() + s.slice(1) : t('New conversation','新对话');
}
const CROW = { menu: null, renaming: null, confirm: null };
/* Swipe a row left on a touch screen to show More and Delete, as in Mail.
   One row open at a time; swipe back, or tap anywhere else, to close.
   The "…" stays in the page for VoiceOver and keyboards (visually hidden
   on touch), and a long press opens the same menu. */
const ROWSWIPE = { open: null };
const SWIPE_W = 168;
(function(){
  if(!matchMedia('(pointer: coarse)').matches) return;
  let row = null, slide = null, x0 = 0, y0 = 0, dx = 0, base = 0, axis = null, hold = null;
  document.addEventListener('touchstart', ev => {
    const r = ev.target.closest && ev.target.closest('.crow[data-crow]');
    if(!r || ev.target.closest('.crow-acts,.crow-menu,.crow-rename')) return;
    row = r; slide = r.querySelector('.crow-slide'); if(!slide) { row = null; return; }
    x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; axis = null;
    base = r.classList.contains('swiped') ? -SWIPE_W : 0;
    clearTimeout(hold);
    hold = setTimeout(() => {           // long press: the options menu
      if(axis || !row) return;
      const id = row.dataset.crow; row = null;
      ROWSWIPE.open = null; CROW.menu = id; CROW.confirm = null; HOLD_FIRED = Date.now(); render();
      if(navigator.vibrate) navigator.vibrate(8);
    }, 520);
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if(!row) return;
    const mx = ev.touches[0].clientX - x0, my = ev.touches[0].clientY - y0;
    if(!axis && Math.hypot(mx, my) > 8) { axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; clearTimeout(hold); }
    if(axis !== 'x') return;
    ev.preventDefault();
    dx = mx;
    const at = Math.max(-SWIPE_W - 24, Math.min(0, base + dx));
    slide.style.transition = 'none'; slide.style.transform = `translateX(${at}px)`;
    row.classList.add('dragging');
  }, { passive: false });
  const end = () => {
    clearTimeout(hold);
    if(!row) return;
    const r = row, sl = slide; row = slide = null;
    if(axis !== 'x') return;
    const at = base + dx;
    sl.style.transition = ''; sl.style.transform = '';
    r.classList.remove('dragging');
    SWIPE_FIRED = Date.now();
    const id = r.dataset.crow;
    ROWSWIPE.open = at < -SWIPE_W / 2.5 ? id : null;
    if(ROWSWIPE.open !== id) CROW.confirm = null;
    CROW.menu = null; render();
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();
let SWIPE_FIRED = 0, HOLD_FIRED = 0;
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 7 4 4H6l4-4z"/></svg>';

/* Questions to open a conversation with. First the threads the people in
   the room already answer in (an editorial fact, not a guess about what
   they "focus on"), then the newest questions. Picking one sends it. */
function suggestions(cast){
  const vids = new Set(cast.map(p => p.voiceId).filter(Boolean));
  const theirs = [...new Set(C.responses.filter(r => vids.has(r.voiceId))
    .map(r => r.questionId))];
  const qs = theirs.concat(C.questions.map(q => q.id))
    .filter((id, i, a) => a.indexOf(id) === i)
    .map(id => byId(C.questions, id)).filter(Boolean).slice(0, 3);
  if(!qs.length) return '';
  return `<div class="suggest">
    <span class="lbl">${t('Start with a question','从一个问题开始')}</span>
    ${qs.map(q => `<button class="ghost" data-ask="${esc(L(q.title))}">${
      esc(L(q.title))}</button>`).join('')}
  </div>`;
}

        || `<div class="av">?</div>`}</div>
      <div class="who">

        <span>${cast.length ? `${t(`${cast.length} in the room`, `${cast.length} 人在场`)} · <button
            type="button" class="simlink" data-how="1" aria-haspopup="dialog"
            aria-label="${t('Simulated. How this works','模拟。这是如何运作的')}">${
            t('Simulated','模拟')}<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5"

            fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="6" cy="8.75" r=".7" fill="currentColor"/></svg></button>`

            esc(pn(philById(chat.typing)))}</b></div>

        <textarea id="say" rows="1" placeholder="${t('Message','发消息')}"

/* The first line of every conversation, part of the transcript, so it
   scrolls away with it. Nothing stands permanently under the box; the "?"
   in the header has the full account, and every reply keeps its labels. */
function convoIntro(){
  let line;
  if(AGENT_URL && AGENT_STATE === 'starting') line = t(
    'The thinkers are waking up. This can take a minute or two.', '思想家们正在醒来，可能需要一两分钟。');
  else if(AGENT_URL && AGENT_STATE === 'ok') line = t(
    'This conversation is simulated. Replies are written by an AI model from each thinker\'s own texts, and what you type is sent to that model.',
    '这段对话是模拟的。回应由 AI 模型依据每位思想家本人的文本写成，你输入的内容会发送给该模型。');
  else if(SAMPLE === null && AGENT_STATE !== 'ok') line = t(
    'This conversation is simulated. No model is reachable here, so nobody will reply.',
    '这段对话是模拟的。此处无法连接模型，因此不会有回应。');
  else line = t('This conversation is simulated. Replies are written by an AI model, not by the thinkers.',
                '这段对话是模拟的。回应由 AI 模型写成，不出自思想家本人。');
  return `<p class="intro">${line}</p>`;
}

        <button class="x" type="button" data-how-close="1" aria-label="${t('Close','关闭')}">×</button></header>
      <div class="how-body">
        ${sec(t('How a reply is made','回应是怎样写成的'), `<ol>
          <li>${t("The thinker agent looks up passages in that thinker's own texts that bear on what you said.",
                  '思想者代理在这位思想家本人的文本中查找与你所说相关的段落。')}</li>
          <li>${t('An AI model writes a reply in the first person from those passages.',
                  'AI 模型依据这些段落，以第一人称写出回应。')}</li>
          <li>${t('Every quotation is checked word for word against the passage. Anything that does not match loses its quotation marks.',
                  '每一处引文都与段落逐字核对。对不上的会被去掉引号。')}</li></ol>`)}
        ${toGate() ? `
        ${sec(t('Which models','使用哪些模型'), `<p>${t(
          "Replies are written by free open models through Groq. Claude is off on the public site.",
          '回应由开源模型经 Groq 写成。公开网站上不使用 Claude。')}</p>`)}
        ${sec(t('What is sent where','什么会被发送到哪里'), `<p>${t(
          "What you type goes to Still's server on Cloudflare, then to the thinker agent on Hugging Face, then to Groq, whose model writes the reply. Your first message needs nothing; after that, an access code. If you leave your email, Still keeps it, your answers and your country to give you access.",
          '你输入的内容先到 Still 在 Cloudflare 上的服务器，再到 Hugging Face 上的思想者代理，然后到 Groq，由其模型写出回应。第一条消息无需任何东西；之后需要访问码。若你留下邮箱，Still 会保存邮箱、你的回答和所在国家，用于发送访问权限。')}</p>`)}` : `
        ${sec(t('Which models','使用哪些模型'), `<p>${t(

}

/* Under the box, right-aligned and small: the model picker (the current
   choice; tapping opens the full list) and a ring for today's use of the
   active model's cap. Tapping the ring shows the usage line. */
function composerMeta(){
  const note = micLine();
  return note ? `<div class="cmeta">${note}</div>` : '';
}
/* The model pill and today's-use ring, inside the box on the left of its
   bottom row (founder: the composer should look like Claude's). */
function modelControls(){
  // Shown whenever the agent answers, even with a single model: without an
  // access code the Claude models drop out, and the pill and today's-use
  // ring used to vanish with them.
  if(!AGENT_URL || AGENT_STATE !== 'ok' || !agentChoices().length) return '';
  const cur = agentChoice(); if(!cur) return '';
  const name = cur.id === 'auto' ? t('Auto','自动') : modelName(cur.id);
  const frac = usageFraction(cur.id);
  const r = 7, len = 2 * Math.PI * r;
  return `
      <button type="button" class="mchip" data-mchip="1" aria-haspopup="menu"
              aria-expanded="${MENU.open ? 'true' : 'false'}" aria-controls="mmenu"
              aria-label="${t(`Model: ${esc(name)}`, `模型：${esc(name)}`)}">
        <span>${esc(name)}</span>
        <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 5l4-4 4 4" fill="none"
             stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      ${MENU.open ? modelMenu() : ''}
      <button type="button" class="ring" data-usage="1" aria-expanded="${chat.usageOpen ? 'true' : 'false'}"
              aria-label="${t(`Today's use: ${Math.round(frac * 100)}% of the limit`, `今天已用 ${Math.round(frac * 100)}%`)}">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--hairline-strong)" stroke-width="2.4"/>
          <circle cx="9" cy="9" r="${r}" fill="none" stroke="${frac >= 0.9 ? 'var(--danger)' : 'var(--ink)'}"
                  stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 9 9)"
                  stroke-dasharray="${(len * frac).toFixed(2)} ${len.toFixed(2)}"/>
        </svg>
      </button>
      ${chat.usageOpen ? usagePanel() : ''}`;
}

/* Today's use, as a panel above the ring (a half sheet on a phone): one
   row per limit that applies to the current choice, in messages, with a
   bar and when it resets. */
function usagePanel(){
  const cur = agentChoice(); if(!cur) return '';
  const groups = usageGroups();
  const ids = cur.id === 'auto'
    ? (cur.chain || []).map(groupOf).filter((v, i, a) => a.indexOf(v) === i)
    : [groupOf(cur.id)];
  const rows = ids.map(g => ({ g, u: groups[g] })).filter(x => x.u && x.u.replies_cap);
  const name = g => g === 'claude' ? 'Claude' : modelName(g);
  const resets = (() => {
    const at = rows[0] && rows[0].u.resets_at; if(!at) return '';
    const d = new Date(at);
    return isNaN(d) ? '' : d.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US', { hour:'numeric', minute:'2-digit' });
  })();
  return `<div class="mback" data-usage-close="1"></div>
    <div class="mmenu upanel" role="dialog" aria-label="${t("Today's use","今日用量")}">
      <div class="up-head"><b>${t("Today's use","今日用量")}</b>${resets
        ? `<span>${t(`Resets ${resets}`, `${resets} 重置`)}</span>` : ''}</div>
      ${rows.length ? rows.map(({ g, u }) => {
        const f = Math.min(1, u.replies / u.replies_cap);
        return `<div class="up-row">
          <div class="up-line"><span>${esc(name(g))}</span>
            <span>${t(`${u.replies_left} of ${u.replies_cap} messages left`, `剩 ${u.replies_left}/${u.replies_cap} 条`)}</span></div>
          <div class="up-bar${f >= .9 ? ' low' : ''}"><i style="width:${(f * 100).toFixed(1)}%"></i></div>
        </div>`;
      }).join('') : `<p class="up-none">${t('No limits counted yet today.','今天还没有计数。')}</p>`}
    </div>`;
}
function closeUsage(){
  chat.usageOpen = false; render();
  setTimeout(() => { const b = document.querySelector('[data-usage]'); if(b) b.focus(); });
}

/* The tighter of the active model's caps: Groq replies, or Claude's replies
   and dollars, whichever is nearer. Auto shows the first model with room. */
function usageFraction(id){
  const groups = usageGroups();
  const frac = g => {
    if(!g) return 0;
    const a = g.replies_cap ? g.replies / g.replies_cap : 0;
    const b = g.usd_cap ? g.usd / g.usd_cap : 0;
    const c = g.period_cap ? g.period_usd / g.period_cap : 0;
    return Math.min(1, Math.max(a, b, c));
  };
  if(id === 'auto'){
    const ids = ((agentChoices().find(r => r.id === 'auto') || {}).chain || [])
      .map(groupOf).filter((v, i, a) => a.indexOf(v) === i);
    const open = ids.find(g => frac(groups[g]) < 1);
    return frac(groups[open || ids[ids.length - 1]]);
  }
  return frac(groups[groupOf(id)]);
}

/* Dictation goes through the agent: the clip is sent to Groq Whisper at
   /v1/transcribe and the text lands in the box; the reader still presses
   Send. Never the browser's own recognition (in Chrome that is Google).
   Until /v1/health reports transcribe, and where the browser cannot
   record, there is no mic at all. Recording arrives with that endpoint. */
const MIC = { state: 'idle', firstNote: false, noted: false, error: '',
              rec: null, stream: null, chunks: [], started: 0, tick: null, stopAt: null };
function micAvailable(){
  const tr = AGENT_INFO && AGENT_INFO.transcribe;
  return AGENT_STATE === 'ok' && !!(tr && tr.available)
    && typeof MediaRecorder !== 'undefined'
    && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function micButton(enabled){
  if(!micAvailable()) return '';
  const rec = MIC.state === 'recording', busy = MIC.state === 'transcribing';
  return `<button type="button" class="mic${rec ? ' on' : ''}${busy ? ' busy' : ''}" data-mic="1"
            aria-pressed="${rec ? 'true' : 'false'}" ${enabled && !busy ? '' : 'disabled'}
            aria-label="${rec ? t('Stop dictation','停止听写')
                        : busy ? t('Turning speech into text','正在转成文字')
                        : t('Start dictation','开始听写')}">
      ${busy ? '<i class="spin" aria-hidden="true"></i>' : `<svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/>
           <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>`}
    </button>`;
}
/* The small line under the box while dictating: the elapsed time, the
   one-time note on where the voice goes, or what went wrong. */
function micLine(){
  const bits = [];
  if(MIC.state === 'recording')
    bits.push(`<span class="mic-time" id="mic-time">${micClock()}</span>`);
  if(MIC.state === 'transcribing') bits.push(t('Turning it into text…','正在转成文字…'));
  if(MIC.firstNote && MIC.state !== 'idle')
    bits.push(t("Your voice is sent to Groq to turn it into text. It isn't stored.",
                '你的语音会发送给 Groq 转成文字，不会被保存。'));
  if(MIC.state === 'idle' && MIC.error) bits.push(`<span class="mic-err">${esc(MIC.error)}</span>`);
  return bits.length ? `<span class="mic-note" role="status">${bits.join(' · ')}</span>` : '';
}
function micClock(){
  const s2 = Math.floor((Date.now() - MIC.started) / 1000);
  return `${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')}`;
}
function micMime(){
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
/* Tap: record. Tap again, or the agent's limit (60 s), stops it; the clip
   goes to the agent's /v1/transcribe (Groq Whisper) and the text is added
   to the box. Sending stays the reader's own tap. The browser asks for the
   microphone on the first tap only. */
async function toggleMic(){
  if(MIC.state === 'transcribing') return;
  if(MIC.state === 'recording'){ micStop(); return; }
  MIC.error = '';
  if(!MIC.noted){ MIC.noted = true; MIC.firstNote = true; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){
    MIC.error = t('The microphone is blocked for this page.','此页面无法使用麦克风。');
    MIC.firstNote = false; return render();
  }
  const mime = micMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  MIC.stream = stream; MIC.rec = rec; MIC.chunks = [];
  rec.ondataavailable = ev => { if(ev.data && ev.data.size) MIC.chunks.push(ev.data); };
  rec.onstop = micSend;
  rec.start();
  MIC.state = 'recording'; MIC.started = Date.now();
  const max = ((AGENT_INFO.transcribe || {}).max_seconds || 60) * 1000;
  MIC.stopAt = setTimeout(micStop, max - 250);
  MIC.tick = setInterval(() => {
    const el = document.getElementById('mic-time'); if(el) el.textContent = micClock();
  }, 500);
  render();
}
function micStop(){
  clearTimeout(MIC.stopAt); clearInterval(MIC.tick);
  if(MIC.rec && MIC.rec.state !== 'inactive') MIC.rec.stop();
  if(MIC.stream) MIC.stream.getTracks().forEach(tr => tr.stop());
}
async function micSend(){
  const seconds = Math.min(60, (Date.now() - MIC.started) / 1000);
  const type = ((MIC.rec && MIC.rec.mimeType) || 'audio/webm').split(';')[0];
  const blob = new Blob(MIC.chunks, { type });
  MIC.rec = null; MIC.stream = null; MIC.chunks = [];
  MIC.state = 'transcribing'; render();
  let text = '', err = '';
  try{
    const r = await fetch(`${AGENT_URL}/v1/transcribe?language=${lang === 'zh' ? 'zh' : 'en'}`, {
      method: 'POST', body: blob,
      headers: agentHeaders({ 'content-type': type, 'x-audio-seconds': seconds.toFixed(1) }) });
    const body = await r.json().catch(() => ({}));
    if(r.status === 401){
      const b = body || {};
      if(b.status === 'access_required'){ accessRequired(b.reason);
        err = t('Voice needs an access code.', '语音需要访问码。'); }
      else { keyRejected(); err = t("That code didn't work.", '这个访问码不对。'); }
    }
    else if(r.status === 429) err = t("Today's voice limit is used up.", '今天的语音额度已用完。');
    else if(!r.ok) err = t("Couldn't hear that, try again.", '没听清，请再试一次。');
    else text = String(body.text || '').trim();
    if(r.ok && !text) err = t("Couldn't hear that, try again.", '没听清，请再试一次。');
  }catch(e){ err = t("Couldn't hear that, try again.", '没听清，请再试一次。'); }
  MIC.state = 'idle'; MIC.firstNote = false; MIC.error = err;
  if(text){
    // render() reads the draft back from the box, so the box gets it too.
    const box = document.getElementById('say');
    const was = (box ? box.value : chat.draft || '').replace(/\s*$/, '');
    chat.draft = was + (was ? ' ' : '') + text;
    if(box) box.value = chat.draft;
  }
  render(); refreshAgentInfo();
  setTimeout(() => { const el = document.getElementById('say');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); syncSend(); } });
}
/* Send is disabled while the field is empty, without re-rendering on every key. */
function syncSend(){
  const box = document.getElementById('say');
  const btn = document.querySelector('.composer .send[type="submit"]');
  if(box && btn) btn.disabled = !box.value.trim() || box.disabled;
}

const clock = ts => { const d = new Date(ts || Date.now());
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0'); };

function msgRow(m, i, c){
  // Same speaker twice running reads as one turn.
  const prev = c.msgs[i-1], next = c.msgs[i+1];
  const cont = prev && !!prev.mine === !!m.mine && prev.id === m.id ? ' cont' : '';
  const last = !(next && !!next.mine === !!m.mine && next.id === m.id);

  if(m.mine) return `<article class="msg mine${cont}">
      <div class="msg-body">
        <div class="bubble">${esc(m.text)}</div>
        ${last ? `<span class="stamp">${clock(m.at)}</span>` : ''}
      </div>
    </article>`;

  if(m.context) return `<div class="ctx-card said">
      <span class="tag">${t('From the Book of Answers','出自答案之书')}</span>
      <q>${esc(L(m.quote))}</q>
      <span class="src">— ${m.source && m.source.url
        ? `<a href="${esc(m.source.url)}" target="_blank" rel="noopener">${esc(L(m.source.label))}</a>`
        : esc(L(m.source && m.source.label))}</span></div>`;
  // The interface speaking (stopped, busy, no passage…), not a thinker:
  // a plain centred line, never labelled Simulated.
  if(!m.id) return `<p class="sysline">${esc(m.text)}${
    last ? ` <span>· ${clock(m.at)}</span>` : ''}</p>${(m.suggest || []).length
    ? `<div class="sys-sugg">${m.suggest.map(id => philById(id)).filter(Boolean).map(p =>
        `<button type="button" class="fpill" data-chat-with="${esc(p.id)}">${
          t(`Chat with ${esc(pn(p))}`, `和${esc(pn(p))}聊聊`)}</button>`).join('')}</div>` : ''}`;

  const p = philById(m.id) || {name:m.name, image:null};
  const q = m.said;
  if(m.agent) return agentRow(m, p, cont, last);
  return `<article class="msg${cont}" data-k="${esc(msgKey(m))}">
    <div class="msg-body">
      <div class="msg-head">${linkAvatar(p)}<b>${esc(pn(p))}</b></div>
      <div class="bubble">${paras(m.text)}</div>
      ${q ? `<div class="said">
        <span class="tag">${t('What he actually wrote','他真正写下的')}</span>
        <q>${esc(L(q.text))}</q>
        <span class="src">— ${q.url
          ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(L(q.label))}</a>`
          : esc(L(q.label))}</span>
      </div>` : ''}
      ${msgFoot(m, last, [t('Simulated','模拟')].concat(m.demo ? [t('Demo','演示')] : []))}
    </div>
  </article>`;
}

/* While a thinker is "thinking": a few loose stages by elapsed time, not a
   readout of the method. It says what kind of work is happening, never
   which texts, models or steps. */
let TYPING_ID = null, TYPING_START = 0;
function loadingStage(name){
  if(chat.typing !== TYPING_ID){ TYPING_ID = chat.typing; TYPING_START = Date.now(); }
  const s = (Date.now() - TYPING_START) / 1000;
  return s < 1.2 ? t(`Reading ${name}…`, `正在读${name}…`)
       : s < 3.5 ? t('Finding what bears on this…', '正在找相关的部分…')
       : t('Writing…', '正在写…');
}
setInterval(() => {
  const el = document.querySelector('.loading .stage');
  if(!el || !chat.typing) return;
  const name = (philById(chat.typing) || {}).name || '';
  const next = loadingStage(name);
  if(el.textContent !== next) el.textContent = next;
}, 300);

/* A new reply types itself in, word by word, quickly: never more than
   about 1.4 s however long it is. Re-renders mid-way continue from where
   it was (negative delays), so it never restarts or pops. The labels and
   actions arrive when the text is done. */
const FRESH = new Map();   // message key -> time it arrived
function markFresh(m){ FRESH.set(msgKey(m), Date.now()); }
function revealFresh(){
  if(!FRESH.size) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ FRESH.clear(); return; }
  for(const [key, start] of FRESH){
    const art = document.querySelector(`[data-k="${CSS.escape(key)}"]`);
    if(!art) continue;
    const bubble = art.querySelector('.bubble'); if(!bubble) continue;
    const nodes = [];
    const walk = n => { for(const c of [...n.childNodes]){
      if(c.nodeType === 3 && c.textContent.trim()) nodes.push(c);
      else if(c.nodeType === 1) walk(c); } };
    walk(bubble);
    const words = nodes.reduce((n, x) => n + x.textContent.split(/(\s+)/).filter(w => w.trim()).length, 0);
    const step = Math.max(10, Math.min(35, 1400 / Math.max(1, words)));
    const elapsed = Date.now() - start;
    let i = 0;
    for(const node of nodes){
      const frag = document.createDocumentFragment();
      for(const w of node.textContent.split(/(\s+)/)){
        if(!w) continue;
        if(!w.trim()){ frag.appendChild(document.createTextNode(w)); continue; }
        const s = document.createElement('span');
        s.className = 'w'; s.textContent = w;
        s.style.animationDelay = (i++ * step - elapsed) + 'ms';
        frag.appendChild(s);
      }
      node.replaceWith(frag);
    }
    const total = words * step;
    art.querySelectorAll('.msg-foot,.msg-acts,.said,.said-more,.vblock footer').forEach(x => {
      x.classList.add('after'); x.style.animationDelay = (total - elapsed) + 'ms'; });
    if(elapsed > total + 400) FRESH.delete(key);
  }
}

/* A reply's text as paragraphs: blank lines separate them. */
function paras(text){
  return String(text || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean)
    .map(x => `<p>${esc(x)}</p>`).join('') || '<p></p>';
}

/* Every reply ends with one plain line: the time (on the last of a run),
   then what it is. The labels are on every reply, never only the last —
   restyled from pills to text, not made optional. */
function msgFoot(m, last, labels){
  const bits = (last ? [clock(m.at)] : []).concat(labels);
  const key = msgKey(m), r = REACT[key];
  const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const UP = '<path d="M7 11v9H4v-9h3zm0 0l4-7a2 2 0 0 1 2 2v3h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.8 20H7"/>';
  const SHARE = '<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>';
  const canDerive = !!(m.agent || m.bridge);
  return `<p class="msg-foot">${bits.map(b => `<span>${b}</span>`).join('')}</p>
    <div class="msg-acts">
      ${canDerive ? `<button type="button" class="derive-link" data-derive="${esc(key)}"
          aria-haspopup="dialog">${t('How this was derived','这是如何推出的')}</button>` : ''}
      <button type="button" class="act${r === 'up' ? ' on' : ''}" data-react="up" data-key="${esc(key)}"
        aria-pressed="${r === 'up'}" aria-label="${t('Good reply','回应不错')}">${icon(UP)}</button>
      <button type="button" class="act down${r === 'down' ? ' on' : ''}" data-react="down" data-key="${esc(key)}"
        aria-pressed="${r === 'down'}" aria-label="${t('Bad reply','回应不好')}">${icon(UP)}</button>
      <button type="button" class="act" data-share="${esc(key)}"
        aria-label="${t('Share this reply','分享这条回应')}">${icon(SHARE)}</button>
      ${SHARED === key ? `<span class="act-note" role="status">${t('Copied','已复制')}</span>` : ''}
    </div>`;
}

/* Reactions stay on this device, like every other piece of user state. */
const msgKey = m => `${m.at}:${m.id}`;
let REACT = (() => { try{ return JSON.parse(localStorage.getItem('still.reactions') || '{}'); }catch(e){ return {}; } })();
let SHARED = null;
function react(key, val){
  REACT[key] = REACT[key] === val ? undefined : val;
  try{ localStorage.setItem('still.reactions', JSON.stringify(REACT)); }catch(e){}
  render();
}
function msgByKey(key){
  const c = convo(); return c ? c.msgs.find(m => msgKey(m) === key) : null;
}
/* A shared reply carries its label with it: out of the conversation, it
   must still say it is simulated and who wrote it. Only verified spans keep
   quotation marks, as in the chat. */
async function shareReply(key){
  const m = msgByKey(key); if(!m) return;
  const p = philById(m.id) || { name: m.name };
  const tmp = document.createElement('div');
  tmp.innerHTML = m.agent ? agentBubble(m.agent, m.text) : paras(m.text);
  tmp.querySelectorAll('q').forEach(q => { q.textContent = '“' + q.textContent + '”'; });
  tmp.querySelectorAll('sup').forEach(s => s.remove());
  const body = [...tmp.querySelectorAll('p')].map(x => x.textContent.trim()).filter(Boolean).join('\n\n');
  const model = m.agent && m.agent.model ? shortModel(m.agent.model) : t('an AI model','AI 模型');
  const text = `${pn(p)}: ${body}\n\n` + t(
    `Simulated. Written by ${model} in ${pn(p)}'s voice, not their words. From Still.`,
    `模拟。由 ${model} 以${pn(p)}的口吻写成，不是其原话。来自 Still。`);
  try{
    if(navigator.share){ await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    SHARED = key; render(); setTimeout(() => { SHARED = null; render(); }, 1600);
  }catch(e){}
}

function pickerModal(){
  const q = chat.query.trim().toLowerCase();
  const target = convo() ? convo().cast : chat.pending;

  // With the agent on, only the people it has texts for can be added.
  const only = agentRoster();
  const pool = only ? PHIL.filter(p => only.has(p.id)) : PHIL;
  // Only the people the agent can answer for are listed, so Pro and Basic
  // filters mean nothing here (Basic would always be empty): not offered.
  const f = only && (chat.filter === 'pro' || chat.filter === 'basic') ? 'all' : (chat.filter || 'all');
  const list = pool.filter(p => {
    if(q && !(p.name.toLowerCase().includes(q) || (p.nameZh || '').includes(q))) return false;
    if(f === 'pro')     return p.tier === 'pro';
    if(f === 'basic')   return p.tier === 'basic';
    if(f === 'sourced') return p.quotes.length > 0;
    return true;
  });

  // people who can actually reply. Stable, so rank order holds within each.
  if(AGENT_URL) list.sort((a, b) => (a.tier === 'pro' ? 0 : 1) - (b.tier === 'pro' ? 0 : 1));

          p.quotes.length ? ' · ' + t(`${p.quotes.length} sourced`, `${p.quotes.length} 条有出处`) : ''}</span>

      <span class="tick">${on ? '✓' : '+'}</span>

  return `<div class="backdrop" data-pick-cancel="1"></div>
  <div class="modal pick" role="dialog" aria-modal="true" aria-label="${t('Add philosophers','添加哲学家')}">
    <header>
      <b>${convo() ? t('Add to this conversation','添加到此对话')

      <button class="x" data-pick-cancel="1" aria-label="${t('Close','关闭')}">×</button>
    </header>

    <input id="pq" placeholder="${t(`Search ${pool.length} philosophers…`,`搜索 ${pool.length} 位哲学家…`)}"
           value="${esc(chat.query)}" autocomplete="off">
    ${only ? `<p class="notice">${t(
      `Showing the ${pool.length} people the thinker agent has texts for.`,
      `只显示思想者代理有其文本的 ${pool.length} 位。`)}</p>` : ''}

    <div class="filters">${FILTERS.filter(([k]) => !only || (k !== 'pro' && k !== 'basic')).map(([k, lab]) =>
      `<button class="fpill${f === k ? ' on' : ''}" data-filter-pick="${k}">${
        esc(lab()[lang] || lab().en)}</button>`).join('')}</div>

    ${target.length ? `<div class="selected">${target.map(chip).join('')}</div>` : ''}

    <div class="plist">
      ${list.length ? list.map(row).join('')
        : `<p class="list-empty">${t('Nobody by that name.','没有这个名字。')}</p>`}

        convo() ? t('Done','完成')
                : t(`Start conversation${target.length ? ' · ' + target.length : ''}`,
                    `开始对话${target.length ? ' · ' + target.length : ''}`)}</button>
    </footer>
  </div>`;
}

    zh: `暂时连不上思想家，因此${pn(p)}无法回应。请过一分钟再试。` };

async function demoSpeak(c, cast){
  const key = cast.map(p => p.id).join('|');
  const rounds = DEMO_ROUNDS[key] || [];
  c.demoRound = c.demoRound || 0;
  const round = rounds[c.demoRound];
  c.demoRound++;

  for(const p of cast){
    if(chat.stopped) break;
    const turn = round && round.find(r => r.who === p.id);
    chat.typing = p.id; render();
    const body = turn ? L({en:turn.en, zh:turn.zh}) : L(demoPlaceholder(p));
    await new Promise(r => setTimeout(r, Math.min(2000, 500 + body.length * 8)));
    chat.typing = null;

    let said = null;
    if(turn && p.quotes.length && !c.said[p.id]){
      said = p.quotes[Math.floor(Math.random() * p.quotes.length)];
      c.said[p.id] = 1;
    }
    c.msgs.push({ id:p.id, name:p.name, text:body, said, at: Date.now(), demo:true,
                  commitment: turn ? L(turn.commit) : null,
                  bridge: turn ? L(turn.bridge) : null });
    markFresh(c.msgs[c.msgs.length - 1]);
    c.at = Date.now(); save(); render();
  }
}

// --- The local thinker agent ----------------------------------------------
//
// Agent/ — retrieval over each thinker's approved primary texts, with every
// quotation checked against the passage it came from. Off unless the page is
// opened on this machine with ?agent=1 (or ?agent=http://localhost:PORT), so
// the published page never calls it. The address must be localhost: what the
// reader types goes to the agent on this Mac and nowhere else.

const AGENT_CONSTANT = null;   // e.g. 'http://localhost:8077' to switch it on without the query
/* The public gate: the tester-only route to the agent for the published
   site. Chat there needs the tester passcode; reading, Answers and Explore
   never ask.
   The site and the gate are one Cloudflare Worker (Hosting/README.md, "The
   page's contract"): on still.<sub>.workers.dev the gate is the page's own
   origin, so calls are same-origin with no CORS. Anywhere else (GitHub
   Pages, this Mac) there is no gate.
   The Worker also answers on the custom domain stillasking.app (and www.),
   where the gate is likewise the page's own origin. */
/* Preview versions (`w.sh preview`) are served at <version>-still.<sub>.workers.dev. */
const GATE_HOST = /^(([a-z0-9-]+-)?still\.[a-z0-9-]+\.workers\.dev|(www\.)?stillasking\.app)$/;
const AGENT_GATE = GATE_HOST.test(location.hostname) ? location.origin : null;
const AGENT_DEFAULT = 'http://localhost:8077';
const LOCAL_HOST = /^(localhost|127\.0\.0\.1|\[::1\])$/;
/* A home network: the founder's phone opening the page from the Mac over
   Wi-Fi. Private addresses only (192.168/16, 10/8, 172.16/12), never a
   public host, so the published page still cannot call an agent. */
const PRIVATE_HOST = /^(192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/;
const nearHost = h => LOCAL_HOST.test(h) || PRIVATE_HOST.test(h);
/* Where chat goes: ?agent= when given, else AGENT_CONSTANT, else the gate.
   Only two kinds of address are ever accepted, because the passcode and
   what the reader types go there: an agent on this Mac or the home network
   (when the page itself is opened from one), or the gate itself. A link
   with ?agent=<some other server> cannot point the published page
   anywhere else. */
const AGENT_URL = (() => {
  let v = AGENT_CONSTANT || AGENT_GATE;
  try{
    const q = new URLSearchParams(location.search).get('agent');
    if(q !== null) v = (q === '' || q === '1') ? AGENT_DEFAULT : (q === '0' ? null : q);
  }catch(e){}
  if(!v) return null;
  try{
    const u = new URL(v);
    const base = u.origin + u.pathname.replace(/\/+$/, '');
    if(AGENT_GATE){
      const g = new URL(AGENT_GATE);
      if(u.protocol === 'https:' && u.origin === g.origin) return base;
    }
    return /^https?:$/.test(u.protocol) && nearHost(location.hostname) && nearHost(u.hostname) ? u.origin : null;
  }catch(e){ return null; }
})();
/* The agent's passcode for callers that are not the Mac itself. Never in
   the address (the page server logs every request line, and links get
   shared): asked for in a field when the agent answers 401, kept in this
   browser's storage only, forgettable from "How this works". */
let AGENT_KEY = (() => { try{ return localStorage.getItem('still.agentKey') || ''; }catch(e){ return ''; } })();
let AGENT_NEEDS_KEY = false;
let AGENT_KEY_BAD = false;   // the last access code got a 401

/* --- Chat access ---------------------------------------------------------
   The first AI message is free and asks nothing. Each agent call carries a
   random device id (made here, kept in this browser, tied to nothing else)
   so the gate can count that one free message. When the gate says the free
   message is used, the reply box becomes a request-access card. An access
   code, if someone has one, goes in X-Still-Key. Reading, Answers and
   Explore never ask. */
const DEVICE_ID = (() => {
  try{
    let d = localStorage.getItem('still.deviceId');
    if(!d){
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem('still.deviceId', d);
    }
    return d;
  }catch(e){ return ''; }
})();
const ACCESS = {
  required: (() => { try{ return localStorage.getItem('still.accessRequired') === '1'; }catch(e){ return false; } })(),
  sent: (() => { try{ return localStorage.getItem('still.accessRequested') === '1'; }catch(e){ return false; } })(),
  email: '', role: '', heard: '', question: '', interview: false, linkedin: '', updates: false,
  sending: false, err: '', codeOpen: false, sheet: false, reason: ''
};
function accessRequired(reason){
  if(!ACCESS.required) ACCESS.sheet = 'chat';   // the moment it happens: open the sheet once
  ACCESS.required = true; ACCESS.reason = reason || '';
  try{ localStorage.setItem('still.accessRequired', '1'); }catch(e){}
}
const accessBlocked = () => !!AGENT_URL && ACCESS.required && !AGENT_KEY;
/* A rejected code reopens the code sheet with the error, never an inline
   field in the conversation. */
function keyRejected(){ setAgentKey(''); AGENT_NEEDS_KEY = true; AGENT_KEY_BAD = true; ACCESS.sheet = 'code'; }

/* The access request: POST /v1/access on the gate (Hosting/README.md).

   too many from this network today. With no gate (GitHub Pages, this Mac)
   nothing is sent, and the card says so: it never claims a request went

const accessUrl = () => toGate() ? AGENT_URL + '/v1/access' : null;
async function requestAccess(fields){
  const url = accessUrl();
  if(!url) return { ok: false, reason: 'not_configured' };
  const r = await fetch(url, { method: 'POST',
    headers: agentHeaders({ 'content-type': 'application/json' }), body: JSON.stringify(fields) });
  return { ok: r.status === 202 || r.ok, status: r.status, body: await r.json().catch(() => null) };
}
const LINKEDIN = /^(https:\/\/)?(www\.)?linkedin\.com\/\S+$/i;

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    ACCESS.err = t('Please enter a valid email.', '请输入有效的邮箱。'); return render();
  }
  if(li && (li.length > 200 || !LINKEDIN.test(li))){
    ACCESS.err = t('That LinkedIn link should start with linkedin.com.', 'LinkedIn 链接应以 linkedin.com 开头。'); return render();
  }
  const c = convo();
  const first = c && c.cast && c.cast[0];
  ACCESS.sending = true; ACCESS.err = ''; render();
  let res;
  try{
    res = await requestAccess({ email, role: ACCESS.role || null, heard_from: ACCESS.heard || null,
      question: ACCESS.question.trim().slice(0, 200) || null,
      interview_ok: !!ACCESS.interview, linkedin: li || null, updates_ok: !!ACCESS.updates,
      lang: lang === 'zh' ? 'zh' : 'en', thinker: source === 'chat_limit' && first ? (AGENT_IDS[first] || first) : null,
      device_id: DEVICE_ID, source });
  }catch(e){ res = { ok: false }; }
  ACCESS.sending = false;
  if(res.ok){
    ACCESS.sent = true;
    try{ localStorage.setItem('still.accessRequested', '1'); }catch(e){}
  }else if(res.reason === 'not_configured'){
    ACCESS.err = t("Requests aren't open on this page.", '此页面暂不接受申请。');
  }else if(res.status === 400 && res.body && res.body.field){
    const f = res.body.field;
    ACCESS.err = f === 'email' ? t('Please check your email.', '请检查邮箱。')
      : f === 'linkedin' ? t('That LinkedIn link should start with linkedin.com.', 'LinkedIn 链接应以 linkedin.com 开头。')
      : t('Please check the form.', '请检查表单。');
  }else if(res.status === 429){
    ACCESS.err = t('Too many requests from this network today. Please try tomorrow.', '今天来自这个网络的申请太多，请明天再试。');

const toGate = () => { try{ return !!AGENT_GATE && !!AGENT_URL && new URL(AGENT_URL).origin === new URL(AGENT_GATE).origin; }catch(e){ return false; } };

function agentChoices(){
  const all = (AGENT_INFO && AGENT_INFO.choices) || [];

/* A model whose worst-case reply costs more than the per-message cap can
   never answer under it (Fable 5.1 at $0.50). It stays in the list, greyed
   with the reason, and comes back by itself if the cap is raised. */
function overMessageCap(r){
  const caps = AGENT_INFO && AGENT_INFO.caps;
  if(!caps || caps.max_usd_per_message == null || !r.model) return false;
  const worst = (caps.worst_reply_usd || {})[r.model];
  return worst != null && worst > caps.max_usd_per_message;
}

  const rows = agentChoices().filter(r => r.available && !overMessageCap(r));
  return rows.find(r => r.id === AGENT_CHOICE)

/* Today's use in the notice: the chosen model, or everything Auto may use. */
function agentUsageLine(){
  const pick = agentChoice();
  if(!pick) return '';
  const groups = usageGroups();
  const parts = [];
  const groqIds = agentChoices().filter(r => r.family === 'groq').map(r => r.id);
  const show = pick.id === 'auto' ? [...groqIds, 'claude'] : [groupOf(pick.id)];
  const groqShown = show.filter(id => groqIds.includes(id) && groups[id]);
  if(groqShown.length){
    const used = groqShown.reduce((n, id) => n + groups[id].replies, 0);
    const cap = groqShown.reduce((n, id) => n + (groups[id].replies_cap || 0), 0);
    parts.push(groqShown.length > 1
      ? t(`Groq today: ${used} of ${cap} replies across ${groqShown.length} models`,
          `Groq 今天：${used} / ${cap} 条（${groqShown.length} 个模型）`)
      : t(`${modelName(groqShown[0])} today: ${used} of ${cap} replies`,
          `${modelName(groqShown[0])} 今天：${used} / ${cap} 条`));
  }
  const c = show.includes('claude') && groups.claude;
  if(c){
    let s = t(`Claude today: ${c.replies} of ${c.replies_cap} replies, $${c.usd.toFixed(2)} of $${(c.usd_cap || 0).toFixed(0)}`,
              `Claude 今天：${c.replies} / ${c.replies_cap} 条，$${c.usd.toFixed(2)} / $${(c.usd_cap || 0).toFixed(0)}`);
