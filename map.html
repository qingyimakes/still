<style>
/* ---------------------------------------------------------------------------
   The full influence map: every philosopher in Still's roster, linked where
   Wikidata records that one influenced or taught another.

   A companion to index.html, opened from Explore ▸ Full map. Same tokens as
   index.html (which lifts them from PastLives/Theme/Theme.swift): change a
   token there and change it here. Light only, like the app.

   Data: the nodes and edges are inline below (#data), written by
   Tools/fetch-influence.py from Wikidata P737 "influenced by" and P1066
   "student of". Chinese names and portraits come from assets/philosophers.json
   when it loads; the page still draws without it.
--------------------------------------------------------------------------- */
:root{
  color-scheme: light;
  --bg:#FAFAFA; --surface:#FFFFFF; --parchment:#E0D5C7; --room:#EDEBE7;
  --chip:rgba(36,50,53,.07); --chip-soft:rgba(36,50,53,.045);
  --ink:#243235; --ink-secondary:#6B6B6B; --ink-tertiary:#5F5B54;
  --text-body-soft:#5A5A5A; --initials:#8A867E; --on-ink:#FFFFFF;
  --accent:#DBFEAA;
  --hairline:rgba(36,50,53,.09); --hairline-strong:rgba(36,50,53,.14);
  --hairline-card:rgba(36,50,53,.16);
  --r-card:24px; --r-inner:16px; --r-chip:14px; --r-pill:999px;
  --sp-xs:4px; --sp-s:8px; --sp-m:12px; --sp-l:16px; --sp-xl:20px; --sp-xxl:24px;
  --serif:ui-serif,"New York","Newsreader","Songti SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"DM Sans","PingFang SC",sans-serif;
  /* The map's own: a dimmed node and edge (sigma reads hex, not rgba). */
  --node-dim:#E4E0D8; --edge-dim:#2432351A; --isolate:#BDB5A8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--room);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

.app{max-width:1240px;margin:0 auto;min-height:100vh;background:var(--bg)}
@media (min-width:1240px){ .app{box-shadow:0 1px 40px rgba(36,50,53,.10)} }

/* Top bar: the same glass bar as index.html, with its back button. */
.bar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:center;
     padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;
     background:rgba(250,250,250,.72);backdrop-filter:blur(20px) saturate(180%);
     -webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--hairline)}
.brand{font-family:var(--serif);font-style:italic;font-size:17px;text-decoration:none}
.back{position:absolute;left:12px;bottom:4px;width:44px;height:44px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);
      box-shadow:0 1px 6px rgba(36,50,53,.10)}
.back svg{width:22px;height:22px}

.page{padding:16px 0 40px}
.page-head{padding:8px 20px 4px}
.page-title{font-family:var(--serif);font-weight:400;font-size:34px;margin:0}
.page-sub{font-size:15px;line-height:1.4;color:var(--ink-tertiary);margin:8px 0 0;max-width:36em}
.tools{padding:0 20px;margin-top:var(--sp-l)}
.tools input{width:100%;max-width:420px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
             border:1px solid var(--hairline-strong);border-radius:var(--r-pill);padding:10px 16px}

.layout{display:grid;gap:var(--sp-l);padding:var(--sp-l) 20px 0}
@media (min-width:900px){ .layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start} }

.card{background:var(--surface);border-radius:var(--r-card);border:1px solid var(--hairline-card)}
#map{position:relative;height:min(68vh,720px);min-height:380px;overflow:hidden}
/* B41: the graph is round, so on a phone the frame is a square the column's
   width; a tall frame only added empty space above and below it. Sigma fits
   the graph to whatever box it is given, so it stays centred. */
@media (max-width:639px){ #map{height:auto;min-height:0;aspect-ratio:1/1} }
@media (min-width:900px){ #map{height:calc(100vh - 52px - 190px);min-height:520px;position:sticky;top:68px} }
.ring-label{position:absolute;left:var(--sp-l);bottom:var(--sp-m);font-size:12px;color:var(--ink-secondary);pointer-events:none}
.zoom{position:absolute;right:var(--sp-m);bottom:var(--sp-m);display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--hairline-strong);
             display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 1px 2px rgba(36,50,53,.06)}

.panel{padding:var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-l)}
.label{font-size:13px;font-weight:600;margin:0}
.label span{font-weight:400;color:var(--ink-secondary)}
.who{display:flex;align-items:center;gap:var(--sp-m)}
.av{width:56px;height:56px;flex:none;border-radius:50%;background:var(--parchment);overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--initials)}
.av img{width:100%;height:100%;object-fit:cover}
.who h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.who p{font-size:14.5px;color:var(--ink-secondary);margin:2px 0 0}
.links{display:flex;flex-wrap:wrap;gap:var(--sp-s)}
.links a{font-size:13px;font-weight:500;text-decoration:none;padding:6px 12px;border-radius:var(--r-pill);background:var(--chip)}
.links a.chat-go{background:var(--ink);color:var(--on-ink)}
.group{display:flex;flex-direction:column;gap:var(--sp-s)}
.list{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:500;padding:6px 12px 6px 10px;border-radius:var(--r-chip);background:var(--chip);
      display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:rgba(36,50,53,.11)}
.chip .tag{font-size:12px;font-weight:400;color:var(--ink-secondary)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{font-size:14px;color:var(--ink-secondary);margin:0}
.pill{font-size:14px;font-weight:500;padding:8px 14px;border-radius:var(--r-pill);background:var(--chip);
      display:inline-flex;align-items:center;gap:8px}
.pill .count{font-weight:400;color:var(--ink-secondary);font-variant-numeric:tabular-nums}
.pill.on{background:var(--ink);color:var(--accent)}
.pill.on .count{color:var(--accent);opacity:.8}
.stats{display:flex;gap:var(--sp-xxl)}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-secondary)}
.disclaim{background:var(--chip);border-radius:var(--r-inner);padding:var(--sp-l);display:flex;flex-direction:column;gap:var(--sp-xs)}
.disclaim b{font-size:14px;font-weight:500}
.disclaim p{font-size:13.5px;line-height:1.45;color:var(--ink-tertiary);margin:0}
#fail{padding:24px;color:var(--ink-secondary)}
</style>

<div class="app">
  <header class="bar">
    <a class="back" href="./" aria-label="Back to Still" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="brand" href="./">Still</a>
  </header>
  <main class="page">
    <div class="page-head">
      <h1 class="page-title" id="title">Full map</h1>
      <p class="page-sub" id="sub"></p>
    </div>
    <div class="tools">
      <input id="q" type="search" list="names" autocomplete="off">
      <datalist id="names"></datalist>
    </div>
    <div class="layout">
      <div id="map" class="card">
        <div class="ring-label" id="ring"></div>

      </div>
      <aside id="panel" class="card panel" aria-live="polite"></aside>
    </div>
  </main>
</div>

7"]},{"s":"p-louis-althusser","t":"p-gilles-deleuze","p":["P737"]},{"s":"p-charles-sanders-peirce","t":"p-gilles-deleuze","p":["P737"]},{"s":"p-duns-scotus","t":"p-gilles-deleuze","p":["P737"]},{"s":"p-søren-kierkegaard","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-karl-marx","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-sigmund-freud","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-georg-wilhelm-friedrich-hegel","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-immanuel-kant","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-friedrich-nietzsche","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-martin-heidegger","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-friedrich-wilhelm-joseph-schelling","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-walter-benjamin","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-theodor-w-adorno","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-jacques-lacan","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-louis-althusser","t":"p-slavoj-žižek","p":["P737"]},{"s":"p-george-berkeley","t":"p-charles-sanders-peirce","p":["P737"]},{"s":"p-confucius","t":"p-mencius","p":["P737"]},{"s":"p-martin-heidegger","t":"p-jean-françois-lyotard","p":["P737"]},{"s":"p-jean-paul-sartre","t":"p-frantz-fanon","p":["P737"]},{"s":"p-jean-paul-sartre","t":"p-edward-said","p":["P737"]},{"s":"p-michel-foucault","t":"p-edward-said","p":["P737"]},{"s":"p-karl-marx","t":"p-maurice-merleau-ponty","p":["P737"]},{"s":"p-martin-heidegger","t":"p-maurice-merleau-ponty","p":["P737"]},{"s":"p-edmund-husserl","t":"p-maurice-merleau-ponty","p":["P737"]},{"s":"p-martin-heidegger","t":"p-richard-rorty","p":["P737"]},{"s":"p-john-dewey","t":"p-richard-rorty","p":["P737"]},{"s":"p-bertrand-russell","t":"p-daniel-dennett","p":["P737"]},{"s":"p-willard-van-orman-quine","t":"p-daniel-dennett","p":["P737"]},{"s":"p-michel-foucault","t":"p-judith-butler","p":["P737"]},{"s":"p-ludwig-wittgenstein","t":"p-hilary-putnam","p":["P737"]},{"s":"p-william-james","t":"p-hilary-putnam","p":["P737"]},{"s":"p-john-dewey","t":"p-hilary-putnam","p":["P737"]},{"s":"p-aristotle","t":"p-g-e-m-anscombe","p":["P737"]},{"s":"p-ludwig-wittgenstein","t":"p-g-e-m-anscombe","p":["P737","P1066"]},{"s":"p-thomas-aquinas","t":"p-g-e-m-anscombe","p":["P737"]},{"s":"p-aristotle","t":"p-martha-nussbaum","p":["P737"]},{"s":"p-john-stuart-mill","t":"p-martha-nussbaum","p":["P737"]},{"s":"p-ludwig-wittgenstein","t":"p-john-searle","p":["P737"]},{"s":"p-ludwig-wittgenstein","t":"p-saul-kripke","p":["P737"]},{"s":"p-david-hume","t":"p-saul-kripke","p":["P737"]},{"s":"p-gottlob-frege","t":"p-saul-kripke","p":["P737"]},{"s":"p-willard-van-orman-quine","t":"p-saul-kripke","p":["P737"]},{"s":"p-hilary-putnam","t":"p-saul-kripke","p":["P737"]},{"s":"p-friedrich-nietzsche","t":"p-bernard-williams","p":["P737"]},{"s":"p-bertrand-russell","t":"p-david-chalmers","p":["P737"]},{"s":"p-richard-rorty","t":"p-cornel-west","p":["P737"]},{"s":"p-rené-descartes","t":"p-harry-frankfurt","p":["P737"]},{"s":"p-immanuel-kant","t":"p-harry-frankfurt","p":["P737"]},{"s":"p-ludwig-wittgenstein","t":"p-harry-frankfurt","p":["P737"]}]}</script>
<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
// The reader's language, as index.html stores it.
const LANG = (() => { try{ return localStorage.getItem('still.lang') === 'zh' ? 'zh' : 'en'; }catch(e){ return 'en'; } })();
const t = (en, zh) => LANG === 'zh' ? zh : en;
document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : 'en';

// Cluster colours: muted, earthy, chosen to sit on Still's paper. The first is
// the ink's own teal; the terracotta is the same as the Explore map's school line.
const PALETTE = ['#2F6F6A','#B06A3B','#6E7F3E','#7A5C99','#3F6496','#A8842C','#9C4A5A','#5E7C88','#8A6A4F','#4F7F5C'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const panel = document.getElementById('panel');
const nameOf = id => (LANG === 'zh' && byId[id].nameZh) || byId[id].name;
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
function seeded(seed){ return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

document.title = t('Still · Full map', 'Still · 完整关系图');
document.getElementById('title').textContent = t('Full map', '完整关系图');
document.getElementById('sub').textContent = t(
  `All ${DATA.nodes.length} philosophers in Still, linked where Wikidata records that one influenced or taught another. A bigger dot has more links; a colour is a cluster the layout found.`,
  `Still 中全部 ${DATA.nodes.length} 位哲学家，凡 Wikidata 记载一人影响或教过另一人，便连一条线。圆点越大，连线越多；颜色是布局算出的群落。`);
document.getElementById('ring').textContent = t('Outer ring: no recorded link', '外圈：没有记载的连线');
document.getElementById('q').placeholder = t('Find a philosopher…', '查找哲学家…');
document.getElementById('q').setAttribute('aria-label', t('Find a philosopher', '查找哲学家'));
document.getElementById('back').setAttribute('aria-label', t('Back to Still', '返回 Still'));
[['zin', t('Zoom in','放大')], ['zout', t('Zoom out','缩小')], ['zreset', t('Reset view','复位')]]
  .forEach(([id, l]) => document.getElementById(id).setAttribute('aria-label', l));

try {
  const Graph = graphology.Graph || graphology;
  const lib = graphologyLibrary;
  const SigmaCtor = window.Sigma && (window.Sigma.Sigma || window.Sigma.default || window.Sigma);
  const g = new Graph({ type: 'directed', multi: false });
  DATA.nodes.forEach(n => g.addNode(n.id, { label: n.name }));
  DATA.edges.forEach(e => g.addDirectedEdge(e.s, e.t, { props: e.p }));

  // Clusters on the linked part only; the unlinked get a neutral colour.
  const sub = g.copy();
  DATA.nodes.forEach(n => { if(!g.degree(n.id)) sub.dropNode(n.id); });
  const comm = lib.communitiesLouvain(sub, { rng: seeded(7) });
  const groups = {};
  sub.forEachNode(id => (groups[comm[id]] ||= []).push(id));
  const clusterOf = {}, clusters = [];
  Object.values(groups).sort((a, b) => b.length - a.length).forEach((ids, i) => {
    ids.sort((a, b) => g.degree(b) - g.degree(a));
    const c = { color: PALETTE[i % PALETTE.length], ids, head: ids[0] };
    clusters.push(c); ids.forEach(id => clusterOf[id] = c);
  });

  // Layout: seeded start, ForceAtlas2, the unlinked on a ring outside.
  const rnd = seeded(42), ISOLATE = css('--isolate');
  g.forEachNode((id, a) => {
    const deg = g.degree(id);
    a.size = deg ? 3 + Math.sqrt(deg) * 2.4 : 2.6;
    a.color = deg ? clusterOf[id].color : ISOLATE;
    a.x = rnd() * 100; a.y = rnd() * 100;
  });
  sub.forEachNode(id => sub.mergeNodeAttributes(id, g.getNodeAttributes(id)));
  const fa = lib.layoutForceAtlas2.inferSettings(sub);
  lib.layoutForceAtlas2.assign(sub, { iterations: 900, settings: { ...fa, gravity: 0.6, scalingRatio: 14, outboundAttractionDistribution: true } });
  let cx = 0, cy = 0, r = 0;
  sub.forEachNode((id, a) => { cx += a.x; cy += a.y; });
  cx /= sub.order; cy /= sub.order;
  sub.forEachNode((id, a) => { r = Math.max(r, Math.hypot(a.x - cx, a.y - cy)); g.mergeNodeAttributes(id, { x: a.x, y: a.y }); });
  const iso = DATA.nodes.filter(n => !g.degree(n.id)).map(n => n.id);
  iso.forEach((id, i) => {
    const a = (i / iso.length) * Math.PI * 2 - Math.PI / 2;
    g.mergeNodeAttributes(id, { x: cx + Math.cos(a) * r * 1.18, y: cy + Math.sin(a) * r * 1.18 });
  });

  let hovered = null, selected = null, focus = null;
  const near = new Set();
  const setNear = id => { near.clear(); if(id){ near.add(id); g.forEachNeighbor(id, n => near.add(n)); } };
  const colorOf = id => g.getNodeAttribute(id, 'color');

  const renderer = new SigmaCtor(g, document.getElementById('map'), {
    defaultEdgeType: 'arrow',
    labelFont: 'DM Sans, -apple-system, system-ui, sans-serif',
    labelSize: 12, labelWeight: '500', labelColor: { color: css('--ink') },
    labelDensity: 0.9, labelGridCellSize: 70, labelRenderedSizeThreshold: 9,
    zIndex: true,
    hoverRenderer: (ctx, d, s) => {
      const size = s.labelSize + 1;
      ctx.font = `600 ${size}px ${s.labelFont}`;
      const w = ctx.measureText(d.label).width + 16, h = size + 12;
      ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = 'rgba(36,50,53,.14)'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.roundRect(d.x + d.size + 4, d.y - h / 2, w, h, h / 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = css('--ink');
      ctx.fillText(d.label, d.x + d.size + 12, d.y + size / 3);
    },
    nodeReducer: (id, a) => {
      const res = { ...a, label: nameOf(id) };
      const active = hovered || selected;
      if(focus && clusterOf[id] !== focus){ res.color = css('--node-dim'); res.label = ''; }
      if(active){
        if(near.has(id)){ res.zIndex = 2; res.forceLabel = true; }
        else { res.color = css('--node-dim'); res.label = ''; res.zIndex = 0; }
      }
      if(id === selected) res.highlighted = true;
      return res;
    },
    edgeReducer: (id, a) => {
      const s = g.source(id), tt = g.target(id), active = hovered || selected;
      const res = { ...a, size: 0.6, color: css('--edge-dim') };
      if(active && (s === active || tt === active)){ res.color = colorOf(s); res.size = 1.6; res.zIndex = 1; }
      else if(active) res.hidden = true;
      else if(focus){
        if(clusterOf[s] === focus && clusterOf[tt] === focus){ res.color = focus.color + '99'; res.size = 1; }
        else res.hidden = true;
      } else res.color = colorOf(s) + '3D';
      return res;
    },
  });

  renderer.on('enterNode', ({ node }) => { hovered = node; setNear(node); renderer.refresh(); });
  renderer.on('leaveNode', () => { hovered = null; setNear(selected); renderer.refresh(); });
  renderer.on('clickNode', ({ node }) => select(node, false));
  renderer.on('clickStage', () => { selected = null; focus = null; setNear(null); renderer.refresh(); overview(); });
  const cam = renderer.getCamera();
  document.getElementById('zin').onclick = () => cam.animatedZoom({ duration: 300 });
  document.getElementById('zout').onclick = () => cam.animatedUnzoom({ duration: 300 });
  document.getElementById('zreset').onclick = () => cam.animatedReset({ duration: 300 });

  function chip(id, tag){
    const b = el('button', 'chip'); b.type = 'button';
    const d = el('span', 'dot'); d.style.background = colorOf(id);
    b.append(d, document.createTextNode(nameOf(id)));
    if(tag) b.append(el('span', 'tag', tag));
    b.onclick = () => select(id, true);
    return b;
  }
  function group(title, ids, tagFor, keepOrder){
    const w = el('div', 'group');
    const h = el('p', 'label', title + ' '); h.append(el('span', null, String(ids.length)));
    const list = el('div', 'list');
    if(!ids.length) list.append(el('p', 'empty', t('None recorded.', '没有记载。')));
    (keepOrder ? ids : ids.slice().sort((a, b) => byId[a].rank - byId[b].rank))
      .forEach(id => list.append(chip(id, tagFor && tagFor(id))));
    w.append(h, list);
    return w;
  }
  const taught = (s, tt) => (g.getEdgeAttribute(s, tt, 'props') || []).includes('P1066');
  function source(){
    const d = el('div', 'disclaim');
    d.append(el('b', null, t('Where the lines come from', '连线从哪里来')),
      el('p', null, t(
        `Wikidata's "influenced by" (P737) and "student of" (P1066), read ${DATA.fetched}, kept only where both people are in Still. These are volunteer-edited claims, not Still's, and they are thin outside Europe: most Chinese, Indian and recent thinkers sit on the outer ring for lack of data, not lack of influence.`,
        `来自 Wikidata 的“受……影响”（P737）与“师从”（P1066），读取于 ${DATA.fetched}，只保留两端都在 Still 中的连线。这些是志愿者编辑的说法，不是 Still 的判断，而且欧洲以外记载很少：多数中国、印度和近代思想家位于外圈，是因为缺少数据，而不是缺少影响。`)));
    return d;
  }
  function avatar(id){
    const n = byId[id], a = el('div', 'av');
    if(n.image){ const img = el('img'); img.alt = ''; img.src = 'assets/img/' + n.image; img.onerror = () => { img.remove(); a.textContent = n.name[0]; }; a.append(img); }
    else a.textContent = (nameOf(id) || '?')[0];
    return a;
  }

  function select(id, fly){
    selected = id; focus = null; setNear(id); renderer.refresh();
    if(fly){ const p = renderer.getNodeDisplayData(id); cam.animate({ x: p.x, y: p.y, ratio: Math.min(cam.ratio, 0.6) }, { duration: 450 }); }
    const n = byId[id], linked = g.degree(id) > 0;
    const who = el('div', 'who'), txt = el('div');
    txt.append(el('h2', null, nameOf(id)), el('p', null,
      [(LANG === 'zh' && n.originZh) || n.origin,
       linked ? t(`Cluster around ${nameOf(clusterOf[id].head)}`, `${nameOf(clusterOf[id].head)} 群落`) : t('No recorded link', '没有记载的连线')]
        .filter(Boolean).join(' · ')));
    who.append(avatar(id), txt);
    const links = el('div', 'links');
    const wp = el('a', null, 'Wikipedia ↗'); wp.href = `https://en.wikipedia.org/wiki/${n.wiki}`;
    const wd = el('a', null, `Wikidata ↗`); wd.href = `https://www.wikidata.org/wiki/${n.qid}#P737`;
    [wp, wd].forEach(a => { a.target = '_blank'; a.rel = 'noopener'; links.append(a); });
    // Same label as the profile page; ./?chat=<id> opens the chat in Still.
    const go = el('a', 'chat-go', t(`Chat with ${nameOf(id)}`, `和${nameOf(id)}聊聊`));
    go.href = `./?chat=${encodeURIComponent(id)}`;
    links.prepend(go);
    panel.replaceChildren(who, links,
      group(t('Drew on', '受其影响'), g.inNeighbors(id), s => taught(s, id) ? t('teacher', '老师') : ''),
      group(t('Passed on to', '影响了'), g.outNeighbors(id), x => taught(id, x) ? t('student', '学生') : ''));
    if(!linked) panel.append(el('p', 'empty', t(
      'Wikidata records no influence or teacher link between this philosopher and anyone else in Still. That is a gap in the data, not a finding that there was none.',
      'Wikidata 没有记载此人与 Still 中任何人之间的影响或师承关系。这是数据的空白，并不说明没有影响。')));
    panel.append(source());
  }

  function overview(){
    const stats = el('div', 'stats');
    [[DATA.nodes.length, t('philosophers', '位哲学家')], [DATA.edges.length, t('links', '条连线')], [iso.length, t('unlinked', '无连线')]]
      .forEach(([v, l]) => { const d = el('div'); d.append(el('b', null, String(v)), el('span', null, l)); stats.append(d); });
    const cl = el('div', 'group'); cl.append(el('p', 'label', t('Clusters', '群落')));
    const pills = el('div', 'list');
    clusters.forEach(c => {
      const b = el('button', 'pill' + (focus === c ? ' on' : '')); b.type = 'button';
      b.setAttribute('aria-pressed', String(focus === c));
      const d = el('span', 'dot'); d.style.background = c.color;
      b.append(d, document.createTextNode(t(`Around ${nameOf(c.head)}`, `${nameOf(c.head)} 一带`)), el('span', 'count', String(c.ids.length)));
      b.onclick = () => { focus = focus === c ? null : c; selected = null; setNear(null); renderer.refresh(); overview(); };
      pills.append(b);
    });
    cl.append(pills);
    const top = DATA.nodes.map(n => n.id).filter(id => g.outDegree(id))
      .sort((a, b) => g.outDegree(b) - g.outDegree(a)).slice(0, 8);
    panel.replaceChildren(stats, cl, group(t('Most often drawn on', '最常被借鉴'), top, id => String(g.outDegree(id)), true), source());
  }
  overview();

  // Search, over both names.
  const dl = document.getElementById('names'), q = document.getElementById('q');
  function fillNames(){
    dl.replaceChildren(...DATA.nodes.map(n => n.id).sort((a, b) => nameOf(a).localeCompare(nameOf(b)))
      .map(id => { const o = el('option'); o.value = nameOf(id); return o; }));
  }
  fillNames();
  const find = exact => {
    const v = q.value.trim().toLowerCase(); if(!v) return;
    const names = n => [n.name, n.nameZh].filter(Boolean).map(s => s.toLowerCase());
    const hit = DATA.nodes.find(n => names(n).includes(v)) || (!exact && DATA.nodes.find(n => names(n).some(s => s.includes(v))));
    if(hit && hit.id !== selected) select(hit.id, true);
  };
  q.addEventListener('input', () => find(true));
  q.addEventListener('keydown', e => { if(e.key === 'Enter') find(false); });

  // Chinese names, origins and portraits from the roster the app ships. Optional.
  fetch('assets/philosophers.json').then(r => r.ok ? r.json() : null).then(d => {
    if(!d) return;
    (d.philosophers || []).forEach(p => {
      const n = byId[p.id]; if(!n) return;
      if(p.nameZh) n.nameZh = p.nameZh;
      if(p.image) n.image = p.image;
      if(p.origin && typeof p.origin === 'object'){ n.origin = p.origin.en || n.origin; n.originZh = p.origin.zh; }
    });
    fillNames(); renderer.refresh();
    selected ? select(selected, false) : overview();
  }).catch(() => {});
} catch(err){
  const m = document.getElementById('map');
  m.replaceChildren(el('p', null, t('The map could not draw: ', '关系图无法绘制：') + err.message));
  m.firstChild.id = 'fail';
  console.error(err);
}
</script>
</html>
